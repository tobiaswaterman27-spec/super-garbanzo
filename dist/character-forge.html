<title>Character Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root {
    --ink:        #151a22;
    --stage:      #0f131a;
    --panel:      #1d242e;
    --panel-2:    #232b37;
    --line:       #2f3846;
    --line-soft:  #262e3a;
    --bone:       #e7e2d4;
    --muted:      #8d97a6;
    --brass:      #c8963e;
    --brass-dim:  #8a6529;
    --verdigris:  #4f8f7d;
    --danger:     #b5565c;

    --pixel: "Silkscreen", "Courier New", monospace;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --gutter: 20px;
    --radius: 3px;
  }

  /* Light theme is the un-stamped default only when the OS asks for it. */
  :root {
    --ink:        #e3e1d8;
    --stage:      #141920;
    --panel:      #f1efe8;
    --panel-2:    #e7e4da;
    --line:       #c7c3b7;
    --line-soft:  #d5d1c6;
    --bone:       #24272d;
    --muted:      #5e656f;
    --brass:      #8c621d;
    --brass-dim:  #b08a3e;
    --verdigris:  #3b6f60;
    --danger:     #973f45;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink:        #151a22;
      --stage:      #0f131a;
      --panel:      #1d242e;
      --panel-2:    #232b37;
      --line:       #2f3846;
      --line-soft:  #262e3a;
      --bone:       #e7e2d4;
      --muted:      #8d97a6;
      --brass:      #c8963e;
      --brass-dim:  #8a6529;
      --verdigris:  #4f8f7d;
      --danger:     #b5565c;
    }
  }

  :root[data-theme="dark"] {
    --ink:        #151a22;
    --stage:      #0f131a;
    --panel:      #1d242e;
    --panel-2:    #232b37;
    --line:       #2f3846;
    --line-soft:  #262e3a;
    --bone:       #e7e2d4;
    --muted:      #8d97a6;
    --brass:      #c8963e;
    --brass-dim:  #8a6529;
    --verdigris:  #4f8f7d;
    --danger:     #b5565c;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    padding-inline: var(--gutter);
    padding-block: 18px 40px;
  }

  .shell { max-width: 1180px; margin: 0 auto; }

  /* ---------- header ---------- */

  header.masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }

  h1 {
    font-family: var(--pixel);
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--bone);
    text-wrap: balance;
  }

  .tagline {
    color: var(--muted);
    font-size: 12px;
    margin: 0;
    flex: 1 1 260px;
    min-width: 0;
  }

  .masthead .mode-switch { margin-left: auto; display: flex; gap: 6px; }

  /* ---------- layout ---------- */

  .workbench {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 360px);
    gap: 18px;
    align-items: start;
  }

  @media (max-width: 880px) {
    .workbench { grid-template-columns: minmax(0, 1fr); }
  }

  /* While playing, the whole editor gets out of the way. */
  body.playing .workbench { grid-template-columns: minmax(0, 1fr); }
  body.playing .rail { display: none; }
  body.playing .stage { position: static; }

  /* ---------- stage ---------- */

  .stage {
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 14px;
  }

  @media (max-width: 880px) { .stage { position: static; } }

  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    max-width: 100%;
    height: auto;
    background: #0b0e14;
    border-radius: 2px;
  }

  /* Shown at their own resolution where there is room, so one art pixel
     lands on one screen pixel. */
  #preview-canvas { width: 100%; max-width: 396px; }
  #world-canvas { width: 100%; max-width: 960px; }

  .stage-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    width: 100%;
  }

  .readout {
    font-family: var(--pixel);
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .readout b { color: var(--brass); font-weight: 400; }

  /* ---------- rail ---------- */

  .rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .tabs {
    display: flex;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .tabs button {
    flex: 1;
    border: 0;
    border-right: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-family: var(--pixel);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 4px;
    cursor: pointer;
  }
  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--brass); }
  .tabs button:hover { color: var(--bone); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel[hidden] { display: none !important; }

  .group { display: flex; flex-direction: column; gap: 9px; }

  .group > h2 {
    font-family: var(--pixel);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .group > h2 span { color: var(--muted); letter-spacing: 0.04em; }

  .field { display: flex; flex-direction: column; gap: 5px; }

  .field > label, .field-label {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .field-label var {
    font-style: normal;
    color: var(--bone);
    font-variant-numeric: tabular-nums;
  }

  input[type="text"], select {
    width: 100%;
    background: var(--panel-2);
    color: var(--bone);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 7px 8px;
    font-family: var(--mono);
    font-size: 13px;
  }
  input[type="text"] { font-family: var(--pixel); font-size: 12px; letter-spacing: 0.04em; }

  select { cursor: pointer; }

  input[type="range"] {
    width: 100%;
    accent-color: var(--brass);
    margin: 0;
    height: 20px;
  }

  :is(button, select, input, [tabindex]):focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 1px;
  }

  /* ---------- buttons ---------- */

  .btn {
    font-family: var(--pixel);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--panel-2);
    color: var(--bone);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 9px 11px;
    cursor: pointer;
    line-height: 1.3;
  }
  .btn:hover { border-color: var(--brass-dim); color: var(--brass); }
  .btn[aria-pressed="true"], .btn.is-active {
    background: var(--brass);
    border-color: var(--brass);
    color: #17130b;
  }
  .btn--primary {
    background: var(--brass);
    border-color: var(--brass);
    color: #17130b;
  }
  .btn--primary:hover { background: var(--brass-dim); border-color: var(--brass-dim); color: #fff; }
  .btn--ghost { background: transparent; }

  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-row > .btn { flex: 1 1 auto; }

  .segmented { display: flex; gap: 0; }
  .segmented .btn { flex: 1; border-radius: 0; border-right-width: 0; }
  .segmented .btn:first-child { border-radius: 2px 0 0 2px; }
  .segmented .btn:last-child { border-radius: 0 2px 2px 0; border-right-width: 1px; }

  /* ---------- swatches ---------- */

  .swatches { display: flex; flex-wrap: wrap; gap: 4px; }
  .swatch {
    width: 22px; height: 22px;
    border: 1px solid var(--line);
    border-radius: 2px;
    cursor: pointer;
    padding: 0;
    position: relative;
  }
  .swatch[aria-pressed="true"] {
    border-color: var(--brass);
    box-shadow: 0 0 0 1px var(--brass);
  }

  /* ---------- direction pad ---------- */

  .dirpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    max-width: 168px;
  }
  .dirpad .btn { padding: 8px 0; font-size: 8px; }
  .dirpad .spacer { visibility: hidden; }

  /* ---------- joints ---------- */

  .joint {
    border: 1px solid var(--line-soft);
    border-radius: 2px;
    padding: 8px 9px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--panel-2);
  }
  .joint > h3 {
    font-family: var(--pixel);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
    color: var(--bone);
  }
  .joint .axis { display: grid; grid-template-columns: 58px 1fr 38px; gap: 6px; align-items: center; }
  .joint .axis span { font-size: 10px; color: var(--muted); }
  .joint .axis var {
    font-style: normal; font-size: 10px; text-align: right;
    color: var(--brass); font-variant-numeric: tabular-nums;
  }

  .keyframes { display: flex; flex-wrap: wrap; gap: 4px; }
  .keyframe {
    font-family: var(--pixel); font-size: 9px;
    border: 1px solid var(--line); background: var(--panel-2);
    color: var(--muted); border-radius: 2px; padding: 6px 8px; cursor: pointer;
  }
  .keyframe:hover { color: var(--danger); border-color: var(--danger); }
  .keyframe b { color: var(--bone); font-weight: 400; }

  .hint {
    font-size: 11px;
    color: var(--muted);
    margin: 0;
    max-width: 62ch;
  }
  .hint kbd {
    font-family: var(--pixel); font-size: 9px;
    border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 2px; padding: 1px 4px; color: var(--bone);
    background: var(--panel-2);
  }

  .empty { color: var(--muted); font-size: 11px; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="shell">
  <header class="masthead">
    <h1>Character Forge</h1>
    <p class="tagline">Procedural pixel villagers &mdash; modelled in 3D, rendered to pixels, animated live.</p>
    <div class="mode-switch">
      <button class="btn is-active" id="mode-forge" type="button">Forge</button>
      <button class="btn" id="mode-world" type="button">World</button>
    </div>
  </header>

  <div class="workbench">
    <section class="stage" aria-label="Viewport">
      <canvas id="preview-canvas" width="396" height="456" aria-label="Character preview"></canvas>
      <canvas id="world-canvas" width="960" height="540" hidden aria-label="Test scene"></canvas>

      <div class="readout" id="readout"></div>

      <div class="stage-foot" id="forge-foot">
        <button class="btn" id="turn-left" type="button">&#8592; Turn</button>
        <button class="btn" id="turn-spin" type="button" aria-pressed="true">Turntable</button>
        <button class="btn" id="turn-right" type="button">Turn &#8594;</button>
      </div>

      <div class="stage-foot" id="world-foot" hidden></div>
    </section>

    <div class="rail">
      <div class="tabs" role="tablist" aria-label="Editor sections">
        <button role="tab" id="tab-identity" aria-selected="true" aria-controls="panel-identity" type="button">Identity</button>
        <button role="tab" id="tab-face" aria-selected="false" aria-controls="panel-face" type="button">Face &amp; hair</button>
        <button role="tab" id="tab-body" aria-selected="false" aria-controls="panel-body" type="button">Body</button>
        <button role="tab" id="tab-anim" aria-selected="false" aria-controls="panel-anim" type="button">Animation</button>
      </div>

      <section class="panel" id="panel-identity" role="tabpanel" aria-labelledby="tab-identity"></section>
      <section class="panel" id="panel-face" role="tabpanel" aria-labelledby="tab-face" hidden></section>
      <section class="panel" id="panel-body" role="tabpanel" aria-labelledby="tab-body" hidden></section>
      <section class="panel" id="panel-anim" role="tabpanel" aria-labelledby="tab-anim" hidden></section>

      <div class="btn-row">
        <button class="btn" id="randomise" type="button">Randomise</button>
        <button class="btn btn--primary" id="enter-world" type="button">Enter the world</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== geometry.js ===== */
/* geometry.js — mesh primitives.
 *
 * Everything used to be an axis-aligned box, which is why heads read as cubes
 * and hair read as slabs. These builders produce general convex meshes, so a
 * spike can taper to a point, a beard can hang and narrow, and a skull can be
 * a rounded solid.
 *
 * A mesh is { verts: [x,y,z, ...], faces: [{ i: [...], n: [x,y,z] }], aabb }.
 * Face normals are computed once at build time from the vertices and the
 * centroid, so every face points outward regardless of winding order.
 */
(function (global) {
  'use strict';

  function finish(verts, faces) {
    // centroid, used only to orient the normals outward
    let cx = 0, cy = 0, cz = 0;
    const n = verts.length / 3;
    let minX = Infinity, minY = Infinity, minZ = Infinity;
    let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
    for (let i = 0; i < n; i++) {
      const x = verts[i * 3], y = verts[i * 3 + 1], z = verts[i * 3 + 2];
      cx += x; cy += y; cz += z;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
    }
    cx /= n; cy /= n; cz /= n;

    const kept = [];
    for (let f = 0; f < faces.length; f++) {
      const idx = faces[f];
      const ax = verts[idx[0] * 3], ay = verts[idx[0] * 3 + 1], az = verts[idx[0] * 3 + 2];
      const bx = verts[idx[1] * 3], by = verts[idx[1] * 3 + 1], bz = verts[idx[1] * 3 + 2];

      // find a third vertex that is not collinear with the first two
      let nx = 0, ny = 0, nz = 0;
      for (let k = 2; k < idx.length; k++) {
        const cx2 = verts[idx[k] * 3], cy2 = verts[idx[k] * 3 + 1], cz2 = verts[idx[k] * 3 + 2];
        const u = [bx - ax, by - ay, bz - az];
        const v = [cx2 - ax, cy2 - ay, cz2 - az];
        nx = u[1] * v[2] - u[2] * v[1];
        ny = u[2] * v[0] - u[0] * v[2];
        nz = u[0] * v[1] - u[1] * v[0];
        if (Math.hypot(nx, ny, nz) > 1e-6) break;
      }
      const len = Math.hypot(nx, ny, nz);
      if (len < 1e-6) continue;   // degenerate face, drop it
      nx /= len; ny /= len; nz /= len;

      // flip to face away from the centroid
      if ((ax - cx) * nx + (ay - cy) * ny + (az - cz) * nz < 0) {
        nx = -nx; ny = -ny; nz = -nz;
      }
      kept.push({ i: idx, n: [nx, ny, nz] });
    }

    return {
      verts: verts,
      faces: kept,
      aabb: { x: minX, y: minY, z: minZ, w: maxX - minX, h: maxY - minY, d: maxZ - minZ }
    };
  }

  /* ---------- box ---------- */

  /* Boxes are grown a hair on every face. Two that merely abut share an exact
   * edge, and rounding on either side of it can leave a one-pixel seam through
   * the model — a pinhole in the clothing that moves as the character turns.
   * Overlapping slightly costs nothing and closes them. */
  const SEAM = 0.012;

  function box(x, y, z, w, h, d) {
    x -= SEAM; y -= SEAM; z -= SEAM;
    w += SEAM * 2; h += SEAM * 2; d += SEAM * 2;
    const x1 = x + w, y1 = y + h, z1 = z + d;
    const verts = [
      x, y, z, x, y, z1, x, y1, z, x, y1, z1,
      x1, y, z, x1, y, z1, x1, y1, z, x1, y1, z1
    ];
    const faces = [
      [0, 1, 3, 2], [4, 6, 7, 5], [0, 4, 5, 1],
      [2, 3, 7, 6], [0, 2, 6, 4], [1, 5, 7, 3]
    ];
    return finish(verts, faces);
  }

  /* ---------- frustum ----------
   *
   * A box whose top face can be shrunk and shifted. Tapering to a small top
   * gives a spike or a lock of hair; tapering to zero gives a cone.
   */
  function taper(x, y, z, w, h, d, topScale, offX, offZ) {
    x -= SEAM; y -= SEAM; z -= SEAM;
    w += SEAM * 2; h += SEAM * 2; d += SEAM * 2;
    const ts = Math.max(0.001, topScale === undefined ? 0.4 : topScale);
    const ox = offX || 0, oz = offZ || 0;
    const cx = x + w / 2, cz = z + d / 2;
    const tw = w * ts, td = d * ts;
    const tx = cx + ox - tw / 2, tz = cz + oz - td / 2;
    const verts = [
      x, y, z, x, y, z + d, x + w, y, z + d, x + w, y, z,
      tx, y + h, tz, tx, y + h, tz + td, tx + tw, y + h, tz + td, tx + tw, y + h, tz
    ];
    const faces = [
      [0, 3, 2, 1], [4, 5, 6, 7],
      [0, 1, 5, 4], [1, 2, 6, 5], [2, 3, 7, 6], [3, 0, 4, 7]
    ];
    return finish(verts, faces);
  }

  /* ---------- pyramid: four triangles to a point ---------- */

  function pyramid(x, y, z, w, h, d, offX, offZ) {
    const ox = offX || 0, oz = offZ || 0;
    const verts = [
      x, y, z, x, y, z + d, x + w, y, z + d, x + w, y, z,
      x + w / 2 + ox, y + h, z + d / 2 + oz
    ];
    const faces = [[0, 3, 2, 1], [0, 1, 4], [1, 2, 4], [2, 3, 4], [3, 0, 4]];
    return finish(verts, faces);
  }

  /* ---------- wedge: a triangular prism ---------- */

  function wedge(x, y, z, w, h, d) {
    // slopes from a full-depth base up to a ridge along the back edge
    const verts = [
      x, y, z, x, y, z + d, x + w, y, z + d, x + w, y, z,
      x, y + h, z, x + w, y + h, z
    ];
    const faces = [[0, 3, 2, 1], [0, 4, 5, 3], [1, 2, 5, 4], [0, 1, 4], [3, 5, 2]];
    return finish(verts, faces);
  }

  /* ---------- superellipsoid ----------
   *
   * One knob between a sphere and a cube. e near 1 is a ball (hair puffs,
   * berries); e near 0.3 is a rounded box, which is what a skull wants — a
   * hard cube head is the single biggest reason a character reads as wrong.
   */
  function superellipsoid(cx, cy, cz, rx, ry, rz, e, rings, segs, u0, u1) {
    rings = rings || 5;
    segs = segs || 8;
    const lo = u0 === undefined ? -Math.PI / 2 : u0;
    const hi = u1 === undefined ? Math.PI / 2 : u1;
    const EPS = 1e-4;
    const poleLo = lo <= -Math.PI / 2 + EPS;
    const poleHi = hi >= Math.PI / 2 - EPS;

    const p = function (v, exp) {
      const s = v < 0 ? -1 : 1;
      return s * Math.pow(Math.abs(v), exp);
    };

    const verts = [];
    const faces = [];
    const index = [];

    for (let i = 0; i <= rings; i++) {
      const u = lo + (i / rings) * (hi - lo);
      const cu = p(Math.cos(u), e), su = p(Math.sin(u), e);
      const atPole = (i === 0 && poleLo) || (i === rings && poleHi);
      const row = [];
      for (let j = 0; j < segs; j++) {
        if (atPole && j > 0) { row.push(row[0]); continue; }
        const v = -Math.PI + (j / segs) * Math.PI * 2;
        row.push(verts.length / 3);
        verts.push(
          cx + rx * cu * p(Math.cos(v), e),
          cy + ry * su,
          cz + rz * cu * p(Math.sin(v), e)
        );
      }
      index.push(row);
    }

    for (let i = 0; i < rings; i++) {
      for (let j = 0; j < segs; j++) {
        const j2 = (j + 1) % segs;
        const a = index[i][j], b = index[i][j2];
        const c = index[i + 1][j2], d = index[i + 1][j];
        const quad = [];
        if (a !== b) quad.push(a);
        if (b !== c) quad.push(b);
        if (c !== d) quad.push(c);
        if (d !== a) quad.push(d);
        if (quad.length >= 3) faces.push(quad);
      }
    }

    // A sliced-off end leaves the solid open, and an open shell shows its own
    // inside once it turns. Close each cut with a flat disc — the rim sits at
    // constant y, so a single planar face is enough.
    if (!poleLo) faces.push(index[0].slice().reverse());
    if (!poleHi) faces.push(index[rings].slice());

    return finish(verts, faces);
  }

  /* Latitude at which a superellipsoid of this shape passes through `y`.
   * Lets a hair dome be cut exactly at the hairline. */

      hairStyle: hair.id,
      hairColour: pick(rng, P.HAIR_COLOURS).id,
      moustache: moustache,
      beard: beard,
      eyeColour: pick(rng, P.EYE_COLOURS).id,
      eyeShape: pick(rng, P.EYE_SHAPES).id,
      brow: pick(rng, P.BROW_SHAPES).id,
      nose: pick(rng, P.NOSE_SHAPES).id,
      mouthWidth: 0.2 + rng() * 0.7,
      height: rng(),
      build: rng(),

    const tunic = hexOf(P.CLOTH_COLOURS, ch.tunicColour);
    const boot = hexOf(P.LEATHER_COLOURS, ch.bootColour);
    return {
      skin: skin,
      skinDark: shade(skin, -0.3),
      skinDeep: shade(skin, -0.48),
      skinLight: shade(skin, 0.16),

      lip: shade(skin, 0.3),
      hair: hair,
      hairDark: shade(hair, -0.2),
      eye: hexOf(P.EYE_COLOURS, ch.eyeColour),
      tunic: tunic,
      tunicDark: shade(tunic, -0.22),
      tunicLight: shade(tunic, 0.1),
      trouser: hexOf(P.CLOTH_COLOURS, ch.trouserColour),
      boot: boot,

      if (g.sleeves === 'wide') {

        d.armW * 0.47, d.armW * 0.47, d.armW * 0.47, 0.6, 3, 7),
        longSleeve ? c.tunic : c.skin));

        // reach well past the joint: a flared cuff that merely touches the

        G.superellipsoid(0, -d.lowerArmH - 0.75, 0,
          d.armW / 2 + 0.15, 0.95, d.armW / 2 + 0.15, 0.6, 3, 7), c.skin));
      upper.children.push(fore);
      torso.children.push(upper);
    }

    for (let s = 0; s < 2; s++) {
      const right = s === 0;
      const sign = right ? -1 : 1;
      const upper = bone(right ? 'legR' : 'legL', [sign * hipX, 0, 0]);
      upper.parts.push(part(
        G.slab(-d.legW / 2, -d.upperLegH, -d.legW / 2, d.legW, d.upperLegH, d.legW, 1, 0.9),

        d.legW * 0.5, d.legW * 0.5, d.legW * 0.5, 0.6, 3, 7), c.trouser));

      shin.parts.push(part(G.superellipsoid(0, 0, 0,
        d.legW * 0.48, d.legW * 0.48, d.legW * 0.48, 0.6, 3, 7), c.trouser));
      shin.parts.push(part(
        G.slab(-shinW / 2, -d.lowerLegH, -shinW / 2, shinW, d.lowerLegH, shinW, 1, 0.82),

    oh: { w: 2.7, h: 2.6 },
    oo: { w: 2.2, h: 2.1 },

    l: 'll', t: 'll', d: 'll', n: 'll',

      out.push(part(B(outerEdge, outerY, front - 0.06, segW, brow.thick, 0.22),
        c.hairDark, { flat: true }));

    const nostrilX = c.nose.w / 2 - 0.42;
    out.push(part(B(-nostrilX, NOSE_BOTTOM + 0.12, noseFront - 0.12, 0.36, 0.34, 0.2),

    out.push(part(B(nostrilX - 0.36, NOSE_BOTTOM + 0.12, noseFront - 0.12, 0.36, 0.34, 0.2),
      c.skinDeep, { flat: true }));

    // A lit lower lip beneath and a shadowed upper lip above. Three bands of
    // real contrast is the least that still reads as a mouth once the head is
    // only about eleven pixels across.
    out.push(part(B(-mw / 2 + 0.1, my - 0.75, front - 0.05, mw - 0.2, 0.7, 0.24),
      c.lip, { flat: true }));
    out.push(part(B(-mw / 2 + 0.2, my + v.h, front - 0.05, mw - 0.4, 0.42, 0.22),

          document.fonts.load(SIZE + 'px Silkscreen')

/* rig.js — posing, animation, knockdowns and drawing the bone tree.
 *
 * Two quantisation rules do most of the visual work here:
 *
 *   1. Poses are sampled at ANIM_FPS, not at the display refresh rate.
 *   2. Yaw is snapped to YAW_STEPS discrete angles before rendering.
 *
 * Without them the model rotates and breathes by fractions of a pixel every
 * frame, so every box edge flickers between two pixel columns at 60Hz. That
 * shimmer is what makes a rendered-to-pixels character read as mush instead of
 * as pixel art, and it destroys the depth cues the shading is trying to give.
 * Real sprite work runs at 8-12fps with a fixed set of facing angles; this
 * reproduces that discipline on a model that is genuinely 3D underneath.
 */
(function (global) {
  'use strict';

  const R = global.Render;
  const CM = global.CharacterModel;

  const ANIM_FPS = 12;
  const YAW_STEPS = 16;
  const YAW_STEP = (Math.PI * 2) / YAW_STEPS;

  function quantiseTime(t) { return Math.floor(t * ANIM_FPS) / ANIM_FPS; }
  function quantiseYaw(y) { return Math.round(y / YAW_STEP) * YAW_STEP; }

  const JOINTS = [
    { name: 'head', label: 'Head', axes: ['Nod', 'Turn', 'Tilt'] },
    { name: 'torso', label: 'Torso', axes: ['Lean', 'Twist', 'Side'] },
    { name: 'armR', label: 'Right arm', axes: ['Swing', 'Rotate', 'Raise'] },
    { name: 'foreR', label: 'Right forearm', axes: ['Bend', 'Twist', 'Side'] },
    { name: 'armL', label: 'Left arm', axes: ['Swing', 'Rotate', 'Raise'] },
    { name: 'foreL', label: 'Left forearm', axes: ['Bend', 'Twist', 'Side'] },
    { name: 'legR', label: 'Right leg', axes: ['Swing', 'Rotate', 'Side'] },
    { name: 'shinR', label: 'Right shin', axes: ['Bend', 'Twist', 'Side'] },
    { name: 'legL', label: 'Left leg', axes: ['Swing', 'Rotate', 'Side'] },
    { name: 'shinL', label: 'Left shin', axes: ['Bend', 'Twist', 'Side'] }
  ];

  function clearPose(model) {
    for (const name in model.bones) {
      const r = model.bones[name].rot;
      r[0] = 0; r[1] = 0; r[2] = 0;
    }
    model.bob = 0;
  }

  function setRot(model, name, x, y, z) {
    const b = model.bones[name];
    if (!b) return;
    b.rot[0] = x; b.rot[1] = y; b.rot[2] = z;
  }

  function addRot(model, name, x, y, z) {
    const b = model.bones[name];

  }

  /* ---------- built-in cycles ----------
   *
   * Sign conventions:
   *   rot[0] on a limb: positive swings it BACKWARD (-Z), negative forward.
   *   rot[0] on the torso: positive leans forward.
   *   rot[2] on an arm: positive pushes the elbow away from the ribs.
   */

  // Deliberately motionless. A breathing cycle at this scale cannot move less
  // than a whole pixel, so every "subtle" sway became a visible crawl across
  // the whole model. Idle characters hold perfectly still; only their eyes and
  // mouth move.
  function poseIdle(model) {
    clearPose(model);
    model.bob = 0;
    setRot(model, 'torso', 0.02, 0, 0);
    setRot(model, 'armR', 0, 0, 0.07);
    setRot(model, 'armL', 0, 0, -0.07);
    setRot(model, 'foreR', -0.1, 0, 0);
    setRot(model, 'foreL', -0.1, 0, 0);
  }

  function poseWalk(model, t, run) {
    clearPose(model);
    const swingScale = model.dims.legSwing;
    const rate = run ? 12.4 : 7.6;
    const p = t * rate;
    const swing = (run ? 1.05 : 0.66) * swingScale;
    const armSwing = run ? 0.9 : 0.48;

    model.bob = Math.abs(Math.sin(p)) * (run ? 0.9 : 0.45) - 0.22;

    setRot(model, 'legR', -Math.sin(p) * swing, 0, 0);
    setRot(model, 'legL', Math.sin(p) * swing, 0, 0);
    setRot(model, 'shinR', Math.max(0, Math.sin(p - 0.55)) * (run ? 1.55 : 0.92), 0, 0);
    setRot(model, 'shinL', Math.max(0, Math.sin(p - 0.55 + Math.PI)) * (run ? 1.55 : 0.92), 0, 0);

    setRot(model, 'armR', Math.sin(p) * armSwing, 0, 0.08);
    setRot(model, 'armL', -Math.sin(p) * armSwing, 0, -0.08);
    const elbow = run ? 1.15 : 0.3;
    setRot(model, 'foreR', -elbow - Math.max(0, Math.sin(p)) * 0.3, 0, 0);
    setRot(model, 'foreL', -elbow - Math.max(0, -Math.sin(p)) * 0.3, 0, 0);

    const lean = run ? 0.26 : 0.05;
    setRot(model, 'torso', lean + Math.abs(Math.sin(p)) * 0.02, Math.sin(p) * 0.08, 0);
    setRot(model, 'head', -lean * 0.8, -Math.sin(p) * 0.045, 0);

  // Speaking is carried entirely by the visemes; the body stays still for the
  // same reason idle does.
  /* ================= attacking ================= *
   *
   * One pose function per swing shape, all driven by the same clock: `k` runs
   * 0 to 1 across wind-up and follow-through, and the blow lands at `hit`.
   * Keeping the landing fraction explicit means the animation and the damage
   * agree about when contact happens, rather than the damage firing on a timer
   * while the arm is still going back.
   */

  const ATTACKS = {
    // a short straight punch
    jab: {
      hit: 0.45,
      pose: function (model, k, side) {
        const wind = Math.min(1, k / 0.45);
        const punch = k < 0.45 ? 0 : Math.min(1, (k - 0.45) / 0.3);
        const back = k < 0.45 ? 0 : Math.max(0, (k - 0.75) / 0.25);
        const reach = punch - back;
        setRot(model, 'arm' + side, -0.5 * wind - 1.05 * reach, 0, side === 'R' ? 0.2 : -0.2);
        setRot(model, 'fore' + side, -1.6 + 1.45 * reach, 0, 0);
        setRot(model, 'arm' + (side === 'R' ? 'L' : 'R'), -0.35, 0, side === 'R' ? -0.3 : 0.3);
        setRot(model, 'fore' + (side === 'R' ? 'L' : 'R'), -1.5, 0, 0);
        setRot(model, 'torso', 0.06, (side === 'R' ? -0.3 : 0.3) * (wind - reach * 1.6), 0);
      }
    },
    // horizontal cut across the body
    slash: {
      hit: 0.52,
      pose: function (model, k, side) {
        const sgn = side === 'R' ? 1 : -1;
        const wind = Math.min(1, k / 0.52);
        const cut = k < 0.52 ? 0 : Math.min(1, (k - 0.52) / 0.34);
        const sweep = -1.15 * wind + 2.5 * cut;
        setRot(model, 'arm' + side, -0.55 - 0.5 * wind + 0.95 * cut, 0, sgn * (0.95 - sweep * 0.42));
        setRot(model, 'fore' + side, -0.55 - 0.8 * wind + 0.7 * cut, 0, 0);
        setRot(model, 'arm' + (side === 'R' ? 'L' : 'R'), -0.3, 0, -sgn * 0.35);
        setRot(model, 'fore' + (side === 'R' ? 'L' : 'R'), -0.9, 0, 0);
        setRot(model, 'torso', 0.08, sgn * (0.55 * wind - 1.05 * cut), 0);
        setRot(model, 'head', 0, sgn * (-0.2 * wind + 0.4 * cut), 0);
        model.bob = -0.25 * cut;
      }
    },
    // raised overhead and brought straight down
    overhead: {
      hit: 0.58,
      pose: function (model, k, side) {
        const sgn = side === 'R' ? 1 : -1;
        const wind = Math.min(1, k / 0.58);
        const fall = k < 0.58 ? 0 : Math.min(1, (k - 0.58) / 0.3);
        setRot(model, 'arm' + side, -2.5 * wind + 3.3 * fall, 0, sgn * 0.3);
        setRot(model, 'fore' + side, -1.5 * wind + 1.4 * fall, 0, 0);
        setRot(model, 'arm' + (side === 'R' ? 'L' : 'R'), -2.1 * wind + 2.8 * fall, 0, -sgn * 0.28);
        setRot(model, 'fore' + (side === 'R' ? 'L' : 'R'), -1.3 * wind + 1.2 * fall, 0, 0);
        setRot(model, 'torso', -0.22 * wind + 0.58 * fall, 0, 0);
        setRot(model, 'head', 0.18 * wind - 0.3 * fall, 0, 0);
        model.bob = 0.5 * wind - 0.9 * fall;
      }
    },
    // short hard stab
    stab: {
      hit: 0.42,
      pose: function (model, k, side) {
        const sgn = side === 'R' ? 1 : -1;
        const wind = Math.min(1, k / 0.42);
        const drive = k < 0.42 ? 0 : Math.min(1, (k - 0.42) / 0.26);
        const back = Math.max(0, (k - 0.72) / 0.28);
        const reach = drive - back;
        setRot(model, 'arm' + side, 0.5 * wind - 1.6 * reach, 0, sgn * (0.5 - reach * 0.4));
        setRot(model, 'fore' + side, -2.0 * wind + 1.9 * reach, 0, 0);
        setRot(model, 'torso', 0.05, sgn * (0.35 * wind - 0.55 * reach), 0);
        setRot(model, 'arm' + (side === 'R' ? 'L' : 'R'), -0.25, 0, -sgn * 0.3);
        setRot(model, 'fore' + (side === 'R' ? 'L' : 'R'), -1.1, 0, 0);

    // two hands driving a shaft forward
    thrust: {
      hit: 0.46,
      pose: function (model, k, side) {
        const sgn = side === 'R' ? 1 : -1;
        const wind = Math.min(1, k / 0.46);
        const drive = k < 0.46 ? 0 : Math.min(1, (k - 0.46) / 0.3);
        const back = Math.max(0, (k - 0.76) / 0.24);
        const reach = drive - back;

        setRot(model, 'foreR', -1.75 + 1.55 * reach, 0, 0);
        setRot(model, 'armL', -0.35 + 0.45 * wind - 1.5 * reach, 0, -0.42 + reach * 0.3);
        setRot(model, 'foreL', -1.75 + 1.55 * reach, 0, 0);

        model.bob = -0.4 * reach;
      }

    // nock, draw, loose
    draw: {
      hit: 0.78,
      pose: function (model, k, side) {
        const sgn = side === 'R' ? 1 : -1;
        const pull = Math.min(1, k / 0.78);
        const loose = k < 0.78 ? 0 : Math.min(1, (k - 0.78) / 0.22);

        setRot(model, 'arm' + (side === 'R' ? 'L' : 'R'), -1.5, 0, -sgn * 0.12);
        setRot(model, 'fore' + (side === 'R' ? 'L' : 'R'), -0.12, 0, 0);
        setRot(model, 'arm' + side, -1.1 - 0.25 * pull, 0, sgn * (0.5 + 0.35 * pull));
        setRot(model, 'fore' + side, -0.7 - 1.5 * pull + 1.7 * loose, 0, 0);
        setRot(model, 'torso', 0.02, sgn * (0.5 + 0.18 * pull - 0.3 * loose), 0);
        setRot(model, 'head', 0, sgn * (-0.45 - 0.1 * pull), 0);

    // crossbow: already spanned, so it is raise, sight, release

      hit: 0.62,
      pose: function (model, k, side) {
        const sgn = side === 'R' ? 1 : -1;
        const up = Math.min(1, k / 0.62);
        const kick = k < 0.62 ? 0 : Math.min(1, (k - 0.62) / 0.2) * (1 - Math.min(1, (k - 0.72) / 0.28));
        setRot(model, 'arm' + side, -1.35 * up + 0.2 * kick, 0, sgn * 0.3);
        setRot(model, 'fore' + side, -0.55 * up - 0.25 * kick, 0, 0);
        setRot(model, 'arm' + (side === 'R' ? 'L' : 'R'), -1.2 * up, 0, -sgn * 0.5);
        setRot(model, 'fore' + (side === 'R' ? 'L' : 'R'), -0.85 * up, 0, 0);
        setRot(model, 'torso', 0.03, sgn * 0.42 * up, 0);
        setRot(model, 'head', 0, sgn * -0.35 * up, 0);
      }
    },
    // a big two-handed swing, for clubs and the like
    swing: {
      hit: 0.5,
      pose: function (model, k, side) {
        const sgn = side === 'R' ? 1 : -1;
        const wind = Math.min(1, k / 0.5);
        const cut = k < 0.5 ? 0 : Math.min(1, (k - 0.5) / 0.35);
        setRot(model, 'arm' + side, -1.9 * wind + 2.5 * cut, 0, sgn * (0.7 - cut * 0.5));
        setRot(model, 'fore' + side, -1.2 * wind + 1.0 * cut, 0, 0);
        setRot(model, 'arm' + (side === 'R' ? 'L' : 'R'), -0.3, 0, -sgn * 0.3);
        setRot(model, 'fore' + (side === 'R' ? 'L' : 'R'), -1.0, 0, 0);
        setRot(model, 'torso', 0.05, sgn * (0.42 * wind - 0.8 * cut), 0);
