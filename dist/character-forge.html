      bodyLen: 33,        // croup to chest, along the spine
      bodyW: 12.0,
      bodyH: 13.2,
      legY: 26,           // height of the shoulder/hip joints
      upperLeg: 13.5,
      lowerLeg: 10.5,
      hoofH: 2.4,
      legW: 3.7,
      neckLen: 12.5,
      neckW: 8.2,
      headLen: 12.5,
      headW: 5.8,
      headH: 7.2,
      tailLen: 13,
      scale: size.scale,
      power: size.power
    };
  }

  /* ---------- the model ---------- */

  function bone(name, origin) {
    return { name: name, origin: origin, rot: [0, 0, 0], parts: [], children: [] };
  }
  function part(mesh, colour) { return { mesh: mesh, colour: colour }; }

  const NECK_ANGLE = 0.95;   // radians up from the spine
  const HEAD_ANGLE = 1.05;   // radians forward off the neck, muzzle a touch low
  const TAIL_ANGLE = 1.95;

  function buildModel(h) {
    const d = dimensionsFor(h);
    const c = resolve(h);
    const root = bone('root', [0, 0, 0]);
    root.scale = d.scale;

    /* ---- barrel: croup at local y=0, chest at y=bodyLen ---- */
    const body = bone('body', [0, d.legY, -d.bodyLen / 2]);
    body.rot[0] = Math.PI / 2;   // local +Y now runs forward along +Z
    const halfW = d.bodyW / 2, halfH = d.bodyH / 2;
    // The barrel is deepest at the girth, just behind the shoulder, and
    // narrows to the loins — one taper each way rather than a single slab.
    body.parts.push(part(G.superellipsoid(0, d.bodyLen * 0.56, 0,
      halfW, d.bodyLen * 0.5, halfH, 0.66, 7, 12), c.body));
    body.parts.push(part(G.superellipsoid(0, d.bodyLen * 0.30, halfH * 0.42,
      halfW * 0.88, d.bodyLen * 0.30, halfH * 0.7, 0.7, 5, 10), c.belly));
    // withers, the ridge where the neck meets the back
    body.parts.push(part(G.superellipsoid(0, d.bodyLen * 0.88, -halfH * 0.52,
      halfW * 0.62, 4.6, halfH * 0.56, 0.7, 5, 9), c.body));
    // chest
    body.parts.push(part(G.superellipsoid(0, d.bodyLen * 0.97, halfH * 0.18,
      halfW * 0.82, 3.8, halfH * 0.82, 0.7, 5, 9), c.body));
    root.children.push(body);

    /* ---- neck and head ---- */
    const neck = bone('neck', [0, d.bodyLen * 0.9, -halfH * 0.5]);
    neck.rot[0] = -NECK_ANGLE;
    neck.parts.push(part(G.taper(-d.neckW / 2, -1.5, -d.neckW / 2 - 0.4,
      d.neckW, d.neckLen + 1.5, d.neckW + 0.8, 0.70), c.body));
    // crest: the mane lies along the top of the neck, not around it
    // throat, filling the hollow under the neck where the taper alone leaves
    // a hard corner
    neck.parts.push(part(G.superellipsoid(0, d.neckLen * 0.45, d.neckW * 0.3,
      d.neckW / 2 - 1.0, d.neckLen * 0.48, 2.0, 0.7, 5, 9), c.body));
    // The mane lies along the crest, and the crest moves inward as the neck
    // tapers. Pinning it at one z offset leaves it hanging off the back of the
    // neck like a fin, so it is laid down in segments that follow the taper.
    const NECK_TOP = 0.70;
    const crestBase = -(d.neckW + 0.8) / 2;
    for (let i = 0; i < 5; i++) {
      const t0 = i / 5, t1 = (i + 1) / 5;
      const zc = crestBase * (1 - t0 * (1 - NECK_TOP));
      const w = 3.6 - t0 * 1.1;
      neck.parts.push(part(G.slab(-w / 2, -1.0 + t0 * (d.neckLen + 1.2), zc - 1.1,
        w, (t1 - t0) * (d.neckLen + 1.2) + 0.5, 2.6, 0.75, 1), c.mane));
    }
    body.children.push(neck);

    const head = bone('head', [0, d.neckLen, 0]);
    head.rot[0] = HEAD_ANGLE;
    // A horse's head is a wedge: deep through the jowl where it meets the
    // neck, narrowing along the face to a blunt muzzle. Built as one rounded
    // mass plus a taper rather than a single box, or it reads as a brick.
    head.parts.push(part(G.superellipsoid(0, d.headLen * 0.22, 0.2,
      d.headW / 2 + 0.5, d.headLen * 0.3, d.headH / 2 + 0.4, 0.62, 6, 10), c.body));
    head.parts.push(part(G.taper(-d.headW / 2, d.headLen * 0.3, -d.headH / 2 + 0.2,
      d.headW, d.headLen * 0.62, d.headH - 0.4, 0.72), c.body));
    // muzzle and nostrils
    head.parts.push(part(G.superellipsoid(0, d.headLen * 0.95, -0.2,
      (d.headW - 1.6) / 2, 1.7, (d.headH - 1.8) / 2, 0.66, 4, 9), c.points));
    // jowl, the round cheek behind the eye
    for (let s2 = -1; s2 <= 1; s2 += 2) {
      head.parts.push(part(G.superellipsoid(s2 * (d.headW / 2 - 0.5), d.headLen * 0.2, 0.6,
        1.5, 2.6, 2.4, 0.7, 4, 8), c.body));
    }
    // forelock, hanging between the ears
    head.parts.push(part(G.slab(-1.8, d.headLen * 0.02, -d.headH / 2 - 0.7,
      3.6, 3.8, 2.2, 0.7, 1), c.mane));
    for (let s2 = -1; s2 <= 1; s2 += 2) {
      // ears, swept back off the poll
      head.parts.push(part(G.pyramid(s2 * 1.7 - 0.8, d.headLen * 0.02, -1.9,
        1.6, 3.2, 1.6), c.points));
      // eyes, set on the sides of the skull the way a prey animal's are
      head.parts.push(part(G.superellipsoid(s2 * (d.headW / 2 + 0.1), d.headLen * 0.3, -0.7,
        0.7, 1.0, 0.9, 0.6, 4, 7), '#17120e'));
    }
    // face white
    if (h.marking === 'blaze' || h.marking === 'stripe') {
      const w = h.marking === 'blaze' ? 2.8 : 1.3;
      head.parts.push(part(G.slab(-w / 2, d.headLen * 0.12, -d.headH / 2 - 0.45,
        w, d.headLen * 0.8, 1.1, 0.9, 1), c.white));
    } else if (h.marking === 'star') {
      head.parts.push(part(G.superellipsoid(0, d.headLen * 0.16, -d.headH / 2 - 0.2,
        1.4, 1.6, 0.8, 0.7, 4, 7), c.white));
    } else if (h.marking === 'snip') {
      head.parts.push(part(G.superellipsoid(0, d.headLen * 0.88, -d.headH / 2 + 0.4,
        1.1, 1.4, 0.8, 0.7, 4, 7), c.white));
    }
    neck.children.push(head);

    /* ---- tail ---- */
    const tail = bone('tail', [0, d.bodyLen * 0.06, -halfH * 0.55]);
    tail.rot[0] = TAIL_ANGLE;
    // dock, then a rope of hair. Narrow — a wide taper seen edge-on at this
    // camera angle reads as a plank nailed to the horse.
    tail.parts.push(part(G.superellipsoid(0, 1.4, 0, 1.7, 2.2, 1.7, 0.7, 4, 8), c.body));
    tail.parts.push(part(G.superellipsoid(0, d.tailLen * 0.42, 0,
      1.5, d.tailLen * 0.34, 1.5, 0.75, 5, 9), c.mane));
    tail.parts.push(part(G.superellipsoid(0, d.tailLen * 0.86, 0,
      1.1, d.tailLen * 0.3, 1.1, 0.75, 5, 9), c.mane));
    body.children.push(tail);

    /* ---- legs ---- */
    const legs = [
      ['legFL', -1, d.bodyLen * 0.34], ['legFR', 1, d.bodyLen * 0.34],
      ['legBL', -1, -d.bodyLen * 0.34], ['legBR', 1, -d.bodyLen * 0.34]
    ];
    for (let i = 0; i < legs.length; i++) {
      const name = legs[i][0], side = legs[i][1], z = legs[i][2];
      const rear = name[3] === 'B';
      const sock = h.socks > i;
      const upper = bone(name, [side * (d.bodyW / 2 - d.legW / 2 + 0.3), d.legY, z]);
      // haunch or shoulder mass at the top of the leg, then the cannon bone
      upper.parts.push(part(G.superellipsoid(0, -3.6, rear ? -1.4 : 0.5,
        d.legW / 2 + 1.1, 5.2, d.legW / 2 + (rear ? 2.4 : 1.2), 0.66, 5, 9), c.body));
      upper.parts.push(part(G.taper(-d.legW / 2, -d.upperLeg, -d.legW / 2,
        d.legW, d.upperLeg, d.legW, 1.18), c.body));
      root.children.push(upper);

      const lower = bone(name.replace('leg', 'shin'), [0, -d.upperLeg, 0]);
      const lw = d.legW * 0.68;
      lower.parts.push(part(G.superellipsoid(0, -0.4, 0,
        d.legW / 2 * 0.9, 1.6, d.legW / 2 * 0.9, 0.5, 3, 7), sock ? c.white : c.body));
      lower.parts.push(part(G.slab(-lw / 2, -d.lowerLeg, -lw / 2,
        lw, d.lowerLeg, lw, 0.9, 1), sock ? c.white : c.points));
      // fetlock and hoof
      lower.parts.push(part(G.superellipsoid(0, -d.lowerLeg + 0.4, 0,
        lw * 0.62, 1.4, lw * 0.62, 0.5, 3, 7), sock ? c.white : c.points));
      lower.parts.push(part(G.taper(-lw / 2 - 0.5, -d.lowerLeg - d.hoofH, -lw / 2 - 0.5,
        lw + 1.0, d.hoofH, lw + 1.0, 1.12), c.hoof));
      upper.children.push(lower);
    }

    /* ---- tack ---- */
    if (h.saddle) {
      const sy = d.legY + halfH * 0.72;
      const sz = d.bodyLen * 0.06;
      body.parts.push(part(G.superellipsoid(0, d.bodyLen * 0.56, -halfH * 0.86,
        halfW * 0.92, 5.2, 2.2, 0.4, 4, 9), c.saddle));
      // cantle and pommel, front and back of the seat
      body.parts.push(part(G.superellipsoid(0, d.bodyLen * 0.56 - 5.0, -halfH * 1.05,
        halfW * 0.7, 1.3, 2.0, 0.45, 3, 7), c.saddle));
      body.parts.push(part(G.superellipsoid(0, d.bodyLen * 0.56 + 5.0, -halfH * 1.02,
        halfW * 0.6, 1.2, 1.8, 0.45, 3, 7), c.saddle));
      // girth around the barrel
      body.parts.push(part(G.slab(-halfW - 0.2, d.bodyLen * 0.54, -halfH - 0.2,
        d.bodyW + 0.4, 2.0, d.bodyH + 0.4, 0.5, 1), c.strap));
      void sy; void sz;
      // stirrups
      for (let s = -1; s <= 1; s += 2) {
        body.parts.push(part(G.slab(s * halfW * 0.95 - 0.5, d.bodyLen * 0.54, -halfH * 0.4,
          1.0, 1.4, 5.6, 1, 1), c.strap));
        body.parts.push(part(G.slab(s * halfW * 0.95 - 1.2, d.bodyLen * 0.52, halfH * 0.22,
          2.4, 2.2, 1.0, 1, 1), c.brass));
      }
    }
    // bridle and reins — the reins are what the rider actually holds
    head.parts.push(part(G.slab(-d.headW / 2 - 0.2, d.headLen * 0.5, -d.headH / 2 - 0.2,
      d.headW + 0.4, 1.1, d.headH + 0.4, 0.6, 1), c.strap));
    head.parts.push(part(G.slab(-d.headW / 2 - 0.2, d.headLen * 0.16, -d.headH / 2 - 0.2,
      d.headW + 0.4, 1.0, d.headH + 0.4, 0.6, 1), c.strap));

    const bones = {};
    (function index(node) {
      bones[node.name] = node;
      for (let i = 0; i < node.children.length; i++) index(node.children[i]);
    })(root);

    return { root: root, bones: bones, dims: d, colours: c, horse: h };
  }

  /* ---------- where the rider sits ---------- */

  // In world units from the horse's own origin, before the model scale.
  function saddlePoint(model) {
    const d = model.dims;
    return {
      x: 0,
      y: (d.legY + d.bodyH * 0.5 + 1.6) * d.scale,
      z: d.bodyLen * 0.06 * d.scale
    };
  }

  function reinPoint(model) {
    const d = model.dims;
    return {
      y: (d.legY + d.bodyH * 0.42 + d.neckLen * 0.55) * d.scale,
      z: (d.bodyLen * 0.4 + 3) * d.scale
    };
  }


  /* ================= gaits ================= */

  const ANIM_FPS = 12;
  const YAW_STEPS = 16;
  const YAW_STEP = (Math.PI * 2) / YAW_STEPS;
  function quantiseTime(t) { return Math.floor(t * ANIM_FPS) / ANIM_FPS; }
  function quantiseYaw(y) { return Math.round(y / YAW_STEP) * YAW_STEP; }

  const LEGS = ['legFL', 'legFR', 'legBL', 'legBR'];
  const SHINS = ['shinFL', 'shinFR', 'shinBL', 'shinBR'];
  // Diagonal pairs: a horse moves front-left with hind-right. Getting this
  // wrong is the difference between a trot and a pantomime horse.
  const PHASE = { legFL: 0, legBR: 0, legFR: 0.5, legBL: 0.5 };

  function setRot(model, name, x, y, z) {
    const b = model.bones[name];
    if (!b) return;
    b.rot[0] = x || 0; b.rot[1] = y || 0; b.rot[2] = z || 0;
  }

  function clearPose(model) {
    for (const k in model.bones) {
      const r = model.bones[k].rot;
      r[0] = 0; r[1] = 0; r[2] = 0;
    }
    setRot(model, 'body', Math.PI / 2, 0, 0);
    setRot(model, 'neck', -NECK_ANGLE, 0, 0);
    setRot(model, 'head', HEAD_ANGLE, 0, 0);
    setRot(model, 'tail', TAIL_ANGLE, 0, 0);
    model.bob = 0;
  }

  const GAITS = {
    idle: { rate: 0.9, swing: 0.0, knee: 0.0, bob: 0.0, lift: 0, neck: 0 },
    walk: { rate: 4.4, swing: 0.30, knee: 0.34, bob: 0.5, lift: 0.10, neck: 0.05 },
    trot: { rate: 7.2, swing: 0.46, knee: 0.62, bob: 1.1, lift: 0.16, neck: 0.09 },
    gallop: { rate: 9.2, swing: 0.78, knee: 1.05, bob: 2.2, lift: 0.26, neck: 0.20 }
  };

  function poseGait(model, t, gait) {
    clearPose(model);
    const g = GAITS[gait] || GAITS.idle;
    const p = t * g.rate;

    if (gait === 'idle') {
      // breathing: the barrel lifts, the head nods, nothing else moves
      const breath = Math.sin(t * 1.5);
      model.bob = breath * 0.16;
      setRot(model, 'neck', -NECK_ANGLE + breath * 0.028, 0, 0);
      setRot(model, 'head', HEAD_ANGLE + Math.sin(t * 1.1) * 0.05, 0, 0);
      setRot(model, 'tail', TAIL_ANGLE + Math.sin(t * 0.7) * 0.09, 0, 0);
      return;
    }

    for (let i = 0; i < LEGS.length; i++) {
      const name = LEGS[i];
      const ph = (p + PHASE[name] * Math.PI * 2) % (Math.PI * 2);
      const swing = Math.sin(ph) * g.swing;
      // the knee only folds on the half of the cycle where the foot is off
      // the ground; a leg bending while it carries weight reads as a limp
      const fold = Math.max(0, Math.cos(ph)) * g.knee;
      const rear = name[3] === 'B';
      setRot(model, name, swing, 0, 0);
      setRot(model, SHINS[i], rear ? -fold * 0.8 : fold, 0, 0);
    }

    // At a gallop the whole animal gathers and extends, so the bob runs at
    // the stride rate rather than at twice it.
    const bobPhase = gait === 'gallop' ? p : p * 2;
    model.bob = Math.sin(bobPhase) * g.bob;
    const reach = Math.sin(p) * g.neck;
    setRot(model, 'neck', -NECK_ANGLE - Math.abs(reach) * 0.5 - g.lift * 0.3, 0, 0);
    setRot(model, 'head', HEAD_ANGLE + reach * 0.6, 0, 0);
    setRot(model, 'tail', TAIL_ANGLE - g.lift * 1.6 - Math.sin(p * 0.7) * 0.12, 0, 0);
  }

  // A horse pulling up short or refusing: front end comes off the ground.
  function poseRear(model, k) {
    clearPose(model);
    const lift = Math.sin(Math.min(1, k) * Math.PI) * 1.05;
    setRot(model, 'body', Math.PI / 2 - lift, 0, 0);
    setRot(model, 'legFL', -1.1 - lift * 0.4, 0, 0);
    setRot(model, 'legFR', -0.8 - lift * 0.5, 0, 0);
    setRot(model, 'shinFL', 1.3, 0, 0);
    setRot(model, 'shinFR', 1.0, 0, 0);
    setRot(model, 'neck', -NECK_ANGLE - lift * 0.3, 0, 0);
    model.bob = lift * 3;
  }

  /* ================= joints ================= */

  const JOINT_NAMES = [
    'croup', 'withers', 'poll', 'muzzle', 'tailTip',
    'rootFL', 'kneeFL', 'hoofFL', 'rootFR', 'kneeFR', 'hoofFR',
    'rootBL', 'kneeBL', 'hoofBL', 'rootBR', 'kneeBR', 'hoofBR'
  ];

  // Which bone each drawn segment runs along, and whether its mesh climbs the
  // bone's local +Y or hangs down -Y. Same contract as the character rig, so
  // the ragdoll can place every part from two points.
  const BONE_SEGMENTS = [
    { bone: 'body', from: 'croup', to: 'withers', axis: 1 },
    { bone: 'neck', from: 'withers', to: 'poll', axis: 1 },
    { bone: 'head', from: 'poll', to: 'muzzle', axis: 1 },
    { bone: 'tail', from: 'croup', to: 'tailTip', axis: 1 },
    { bone: 'legFL', from: 'rootFL', to: 'kneeFL', axis: -1 },
    { bone: 'shinFL', from: 'kneeFL', to: 'hoofFL', axis: -1 },
    { bone: 'legFR', from: 'rootFR', to: 'kneeFR', axis: -1 },
    { bone: 'shinFR', from: 'kneeFR', to: 'hoofFR', axis: -1 },
    { bone: 'legBL', from: 'rootBL', to: 'kneeBL', axis: -1 },
    { bone: 'shinBL', from: 'kneeBL', to: 'hoofBL', axis: -1 },
    { bone: 'legBR', from: 'rootBR', to: 'kneeBR', axis: -1 },
    { bone: 'shinBR', from: 'kneeBR', to: 'hoofBR', axis: -1 }
  ];

  const PARTICLE_R = {
    croup: 5.5, withers: 5.5, poll: 3.2, muzzle: 2.4, tailTip: 1.4,
    rootFL: 3.0, rootFR: 3.0, rootBL: 3.0, rootBR: 3.0,
    kneeFL: 2.0, kneeFR: 2.0, kneeBL: 2.0, kneeBR: 2.0,
    hoofFL: 1.8, hoofFR: 1.8, hoofBL: 1.8, hoofBR: 1.8
  };

  /* Walks the posed tree and reports where each named joint has ended up, in
   * world units with the hooves at y=0. */
  const _jp = [0, 0, 0];
  function jointPositions(model, yaw, tiltPitch, tiltRoll) {
    const d = model.dims;
    const scale = model.root.scale || 1;
    let base = R.rotationY(yaw);
    // Tilt about the hooves, so a get-up can aim at a body that is still on
    // its side rather than at one that is already standing.
    if (tiltPitch) base = R.multiply(base, R.rotationX(tiltPitch));
    if (tiltRoll) base = R.multiply(base, R.rotationZ(tiltRoll));
    base = R.multiply(base, R.scaling(scale));
    base = R.multiply(base, R.translation(0, model.bob || 0, 0));

    (function walk(node, parent) {
      let local = R.translation(node.origin[0], node.origin[1], node.origin[2]);
      if (node.rot[2]) local = R.multiply(local, R.rotationZ(node.rot[2]));
      if (node.rot[1]) local = R.multiply(local, R.rotationY(node.rot[1]));
      if (node.rot[0]) local = R.multiply(local, R.rotationX(node.rot[0]));
      node._m = R.multiply(parent, local);
      for (let i = 0; i < node.children.length; i++) walk(node.children[i], node._m);
    })(model.root, base);

    const out = {};
    function at(boneName, lx, ly, lz, key) {
      const b = model.bones[boneName];
      if (!b) return;
      R.transformPoint(b._m, lx, ly, lz, _jp);
      out[key] = [_jp[0], _jp[1], _jp[2]];
    }

    at('body', 0, 0, 0, 'croup');
    at('body', 0, d.bodyLen * 0.9, -d.bodyH * 0.25, 'withers');
    at('neck', 0, d.neckLen, 0, 'poll');
    at('head', 0, d.headLen, 0, 'muzzle');
    at('tail', 0, d.tailLen, 0, 'tailTip');
    const legs = ['FL', 'FR', 'BL', 'BR'];
    for (let i = 0; i < legs.length; i++) {
      at('leg' + legs[i], 0, 0, 0, 'root' + legs[i]);
      at('leg' + legs[i], 0, -d.upperLeg, 0, 'knee' + legs[i]);
      at('shin' + legs[i], 0, -d.lowerLeg - d.hoofH, 0, 'hoof' + legs[i]);
    }
    return out;
  }

  /* ================= ragdoll ================= */

  const LINKS = [
    ['croup', 'withers', 1], ['withers', 'poll', 1], ['poll', 'muzzle', 1],
    ['croup', 'tailTip', 0.5],
    ['withers', 'rootFL', 1], ['withers', 'rootFR', 1],
    ['croup', 'rootBL', 1], ['croup', 'rootBR', 1],
    ['rootFL', 'rootFR', 0.95], ['rootBL', 'rootBR', 0.95],
    ['rootFL', 'rootBL', 0.8], ['rootFR', 'rootBR', 0.8],
    ['croup', 'rootFL', 0.55], ['croup', 'rootFR', 0.55],
    ['withers', 'rootBL', 0.55], ['withers', 'rootBR', 0.55],
    ['rootFL', 'kneeFL', 1], ['kneeFL', 'hoofFL', 1],
    ['rootFR', 'kneeFR', 1], ['kneeFR', 'hoofFR', 1],
    ['rootBL', 'kneeBL', 1], ['kneeBL', 'hoofBL', 1],
    ['rootBR', 'kneeBR', 1], ['kneeBR', 'hoofBR', 1],
    // loose limits: a leg can fold, it cannot fold through the animal
    ['rootFL', 'hoofFL', 0.12], ['rootFR', 'hoofFR', 0.12],
    ['rootBL', 'hoofBL', 0.12], ['rootBR', 'hoofBR', 0.12],
    ['withers', 'tailTip', 0.1]
  ];

  const GRAVITY = 130;
  const SUBSTEP = 1 / 120;
  const ITERATIONS = 8;
  const MAX_STEP = 1.05;   // model units per 120Hz substep, ~126 units/second
  const STILL_TIME = 1.4;

  function createFall() {
    return { active: false, p: null, links: null, state: 'up', still: 0, rise: 0, timer: 0,
      risePitch: 0, riseRoll: 0, vol: null };
  }

  function knockDown(entity, dirX, dirY, force) {
    const f = entity.fall;
    const model = entity.model;
    poseGait(model, quantiseTime(entity.animTime), entity.gait === 'idle' ? 'idle' : entity.gait);
    const joints = jointPositions(model, entity.yaw);
    const len = Math.hypot(dirX, dirY) || 1;
    const px = dirX / len, pz = dirY / len;
    const p = {};
    const impulse = Math.max(1, Math.min(11, force)) * SUBSTEP * 4.4;

    for (let i = 0; i < JOINT_NAMES.length; i++) {
      const k = JOINT_NAMES[i];
      const j = joints[k];
      if (!j) continue;
      const q = { x: j[0], y: j[1], z: j[2], px: 0, py: 0, pz: 0, r: PARTICLE_R[k] || 2 };
      // The push goes in through the flank and the whole animal rolls with it,
      // so the top of the body travels further than the feet.
      const high = Math.max(0, Math.min(1, j[1] / 34));
      q.px = q.x - px * impulse * (0.5 + high);
      q.pz = q.z - pz * impulse * (0.5 + high);
      q.py = q.y - impulse * 0.12 * high;
      p[k] = q;
    }

    const links = [];
    for (let i = 0; i < LINKS.length; i++) {
      const a = LINKS[i][0], b = LINKS[i][1];
      if (!joints[a] || !joints[b]) continue;
      const dx = joints[a][0] - joints[b][0];
      const dy = joints[a][1] - joints[b][1];
      const dz = joints[a][2] - joints[b][2];
      links.push({ a: a, b: b, len: Math.hypot(dx, dy, dz), stiff: LINKS[i][2] });
    }

    // Centre the body on the entity before anything else. The solver works in
    // a local frame whose origin is the middle of the barrel, and hands back
    // how far that middle moved each step; if it does not start at zero, the
    // very first step hands back the model's own layout as if it were motion.
    recentre(p);

    f.p = p;
    f.links = links;
    f.active = true;
    f.state = 'falling';
    f.still = 0;
    f.rise = 0;
    f.timer = 0;
    entity.gait = 'idle';
    return true;
  }

  /* Midpoint of the barrel, in whatever frame the particles are currently in. */
  function bodyMid(p) {
    const c = p.croup, w = p.withers;
    return { x: (c.x + w.x) * 0.5, z: (c.z + w.z) * 0.5 };
  }

  function recentre(p) {
    const m = bodyMid(p);
    for (const k in p) {
      const q = p[k];
      q.x -= m.x; q.z -= m.z;
      q.px -= m.x; q.pz -= m.z;
    }
    return m;
  }


  /* ---------- solid body ---------- */

  /* The same problem the villagers had: the distance constraints are happy to
   * let a foreleg swing straight through the barrel, and every bone is drawn
   * as a box spanning two particles, so a segment crossing the body is a leg
   * visibly inside the horse. The barrel is an elliptical column along the
   * spine — a horse is far deeper than it is wide — plus a neck capsule, and
   * every limb is sampled along its length rather than only at the joints. */
  function bodyVolumes(d) {
    return {
      barrelW: d.bodyW / 2 + d.legW * 0.44,
      barrelH: d.bodyH / 2 + d.legW * 0.44,
      neckR: d.neckW * 0.5 + d.legW * 0.2,
      legR: d.legW * 0.5
    };
  }

  const LIMB_SEGMENTS = [
    { a: 'rootFL', b: 'kneeFL', root: true }, { a: 'kneeFL', b: 'hoofFL', root: false },
    { a: 'rootFR', b: 'kneeFR', root: true }, { a: 'kneeFR', b: 'hoofFR', root: false },
    { a: 'rootBL', b: 'kneeBL', root: true }, { a: 'kneeBL', b: 'hoofBL', root: false },
    { a: 'rootBR', b: 'kneeBR', root: true }, { a: 'kneeBR', b: 'hoofBR', root: false }
  ];

  const LIMB_PAIRS = [
    [['rootFL', 'kneeFL'], ['rootFR', 'kneeFR']], [['kneeFL', 'hoofFL'], ['kneeFR', 'hoofFR']],
    [['rootBL', 'kneeBL'], ['rootBR', 'kneeBR']], [['kneeBL', 'hoofBL'], ['kneeBR', 'hoofBR']],
    [['kneeFL', 'hoofFL'], ['kneeBL', 'hoofBL']], [['kneeFR', 'hoofFR'], ['kneeBR', 'hoofBR']]
  ];

  const _hf = { ox: 0, oy: 0, oz: 0, len: 1, ax: 0, ay: 0, az: 1,
    lx: 1, ly: 0, lz: 0, ux: 0, uy: 1, uz: 0 };

  /* Barrel frame: the spine runs croup to withers, the lateral axis across
   * the shoulders, and up is their cross product. Without a real frame the
   * barrel can only be a round tube, which either lets legs through at the
   * belly or holds them out at the flanks. */
  function barrelFrame(p) {
    const a = p.croup, b = p.withers;
    if (!a || !b) return null;
    let ax = b.x - a.x, ay = b.y - a.y, az = b.z - a.z;
    const al = Math.hypot(ax, ay, az);
    if (al < 1e-5) return null;
    ax /= al; ay /= al; az /= al;

    let lx = p.rootFL.x - p.rootFR.x, ly = p.rootFL.y - p.rootFR.y, lz = p.rootFL.z - p.rootFR.z;
    const dot = lx * ax + ly * ay + lz * az;
    lx -= ax * dot; ly -= ay * dot; lz -= az * dot;
    let ll = Math.hypot(lx, ly, lz);
    if (ll < 1e-4) {
      lx = Math.abs(ax) < 0.9 ? 1 : 0; ly = 0; lz = Math.abs(ax) < 0.9 ? 0 : 1;
      const d2 = lx * ax + ly * ay + lz * az;
      lx -= ax * d2; ly -= ay * d2; lz -= az * d2;
      ll = Math.hypot(lx, ly, lz) || 1;
    }
    lx /= ll; ly /= ll; lz /= ll;

    _hf.ox = a.x; _hf.oy = a.y; _hf.oz = a.z; _hf.len = al;
    _hf.ax = ax; _hf.ay = ay; _hf.az = az;
    _hf.lx = lx; _hf.ly = ly; _hf.lz = lz;
    _hf.ux = ay * lz - az * ly;
    _hf.uy = az * lx - ax * lz;
    _hf.uz = ax * ly - ay * lx;
    return _hf;
  }

  const _push = { x: 0, y: 0, z: 0 };

  function barrelEscape(fr, v, x, y, z) {
    const dx = x - fr.ox, dy = y - fr.oy, dz = z - fr.oz;
    const s = dx * fr.ax + dy * fr.ay + dz * fr.az;
    // Only the run of the barrel itself. The legs are rooted at its ends, so
    // testing them against those is the solver fighting the skeleton.
    if (s < fr.len * 0.16 || s > fr.len * 0.94) return false;
    const u = dx * fr.lx + dy * fr.ly + dz * fr.lz;
    const w = dx * fr.ux + dy * fr.uy + dz * fr.uz;
    const nu = u / v.barrelW, nw = w / v.barrelH;
    const m = Math.hypot(nu, nw);
    if (m >= 1) return false;
    const k = m < 1e-4 ? 1 : 1 / m;
    const eu = u * k - u, ew = w * k - w;
    _push.x = fr.lx * eu + fr.ux * ew;
    _push.y = fr.ly * eu + fr.uy * ew;
    _push.z = fr.lz * eu + fr.uz * ew;
    return true;
  }

  function capsuleEscape(a, b, r, x, y, z) {
    const bx = b.x - a.x, by = b.y - a.y, bz = b.z - a.z;
    const len2 = bx * bx + by * by + bz * bz || 1e-6;
    let t = ((x - a.x) * bx + (y - a.y) * by + (z - a.z) * bz) / len2;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const cx = a.x + bx * t, cy = a.y + by * t, cz = a.z + bz * t;
    const dx = x - cx, dy = y - cy, dz = z - cz;
    const d = Math.hypot(dx, dy, dz);
    if (d >= r) return false;
    if (d < 1e-4) { _push.x = 0; _push.y = r; _push.z = 0; return true; }
    const k = (r - d) / d;
    _push.x = dx * k; _push.y = dy * k; _push.z = dz * k;
    return true;
  }

  const SAMPLES = [0.22, 0.45, 0.68, 0.86, 1.0];

  function separateLimbs(f, dims) {
    const p = f.p;
    const v = f.vol || (f.vol = bodyVolumes(dims));
    const fr = barrelFrame(p);

    for (let i = 0; i < LIMB_SEGMENTS.length; i++) {
      const seg = LIMB_SEGMENTS[i];
      const a = p[seg.a], b = p[seg.b];
      if (!a || !b) continue;
      let ax = 0, ay = 0, az = 0, bx = 0, by = 0, bz = 0, any = false;
      for (let j = 0; j < SAMPLES.length; j++) {
        const t = SAMPLES[j];
        const x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t, z = a.z + (b.z - a.z) * t;
        let ex = 0, ey = 0, ez = 0, hit = false;
        if (fr && barrelEscape(fr, v, x, y, z)) {
          ex += _push.x; ey += _push.y; ez += _push.z; hit = true;
        }
        if (!seg.root && capsuleEscape(p.withers, p.poll, v.neckR, x, y, z)) {
          ex += _push.x; ey += _push.y; ez += _push.z; hit = true;
        }
        if (!hit) continue;
        any = true;
        // a root end is welded to the body, so it only takes a token share
        const wa = seg.root ? (1 - t) * 0.45 : (1 - t);
        const wb = seg.root ? 1 : t;
        const sum = wa + wb || 1;
        ax += ex * wa / sum; ay += ey * wa / sum; az += ez * wa / sum;
        bx += ex * wb / sum; by += ey * wb / sum; bz += ez * wb / sum;
      }
      if (!any) continue;
      const n = SAMPLES.length;
      if (!seg.root) { a.x += ax / n; a.y += ay / n; a.z += az / n; }
      b.x += bx / n; b.y += by / n; b.z += bz / n;
    }

    // and the legs against each other, so they cannot scissor through
    for (let i = 0; i < LIMB_PAIRS.length; i++) {
      const A = LIMB_PAIRS[i][0], B = LIMB_PAIRS[i][1];
      const a0 = p[A[0]], a1 = p[A[1]], b0 = p[B[0]], b1 = p[B[1]];
      if (!a0 || !a1 || !b0 || !b1) continue;
      const want = v.legR * 2;
      const ux = a1.x - a0.x, uy = a1.y - a0.y, uz = a1.z - a0.z;
      const vx = b1.x - b0.x, vy = b1.y - b0.y, vz = b1.z - b0.z;
      const wx = a0.x - b0.x, wy = a0.y - b0.y, wz = a0.z - b0.z;
      const uu = ux * ux + uy * uy + uz * uz;
      const uv = ux * vx + uy * vy + uz * vz;
      const vv = vx * vx + vy * vy + vz * vz;
      const uw = ux * wx + uy * wy + uz * wz;
      const vw = vx * wx + vy * wy + vz * wz;
      const den = uu * vv - uv * uv;
      let sa, tb;
      if (den < 1e-8) { sa = 0; tb = vv < 1e-8 ? 0 : vw / vv; }
      else { sa = (uv * vw - vv * uw) / den; tb = (uu * vw - uv * uw) / den; }
      sa = sa < 0 ? 0 : sa > 1 ? 1 : sa;
      tb = tb < 0 ? 0 : tb > 1 ? 1 : tb;
      let dx = (a0.x + ux * sa) - (b0.x + vx * tb);
      let dy = (a0.y + uy * sa) - (b0.y + vy * tb);
      let dz = (a0.z + uz * sa) - (b0.z + vz * tb);
      let d = Math.hypot(dx, dy, dz);
      if (d >= want) continue;
      if (d < 1e-4) { dx = 1; dy = 0; dz = 0; d = 1; }
      const k = (want - d) / d * 0.5 * 0.6;
      const px = dx * k, py = dy * k, pz = dz * k;
      a0.x += px * (1 - sa); a0.y += py * (1 - sa); a0.z += pz * (1 - sa);
      a1.x += px * sa; a1.y += py * sa; a1.z += pz * sa;
      b0.x -= px * (1 - tb); b0.y -= py * (1 - tb); b0.z -= pz * (1 - tb);
      b1.x -= px * tb; b1.y -= py * tb; b1.z -= pz * tb;
    }
  }

  function simulate(f, dt, dims) {
    const p = f.p;
    const gStep = GRAVITY * dt * dt;
    for (const k in p) {
      const q = p[k];
      let vx = (q.x - q.px) * 0.992, vy = (q.y - q.py) * 0.992, vz = (q.z - q.pz) * 0.992;
      // A constraint resolving against a hoof the ground is holding can fling
      // a particle a long way in one substep. Capping the step keeps a hard
      // landing from turning into the horse being launched across the map.
      const sp = Math.hypot(vx, vy, vz);
      if (sp > MAX_STEP) { const s2 = MAX_STEP / sp; vx *= s2; vy *= s2; vz *= s2; }
      q.px = q.x; q.py = q.y; q.pz = q.z;
      q.x += vx; q.y += vy - gStep; q.z += vz;
    }
    for (let it = 0; it < ITERATIONS; it++) {
      for (let i = 0; i < f.links.length; i++) {
        const l = f.links[i];
        const a = p[l.a], b = p[l.b];
        const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
        const dist = Math.hypot(dx, dy, dz) || 1e-6;
        if (l.stiff < 0.2 && dist >= l.len) continue;
        const k = ((dist - l.len) / dist) * 0.5 * l.stiff;
        a.x += dx * k; a.y += dy * k; a.z += dz * k;
        b.x -= dx * k; b.y -= dy * k; b.z -= dz * k;
      }
      separateLimbs(f, dims);
      for (const key in p) {
        const q = p[key];
        if (q.y < q.r * 0.34) {
          q.y = q.r * 0.34;
          q.px += (q.x - q.px) * 0.74;
          q.pz += (q.z - q.pz) * 0.74;
        }
      }
    }
  }

  function energy(f) {
    let e = 0;
    for (const k in f.p) {
      const q = f.p[k];
      e += (q.x - q.px) * (q.x - q.px) + (q.y - q.py) * (q.y - q.py) + (q.z - q.pz) * (q.z - q.pz);
    }
    return e;
  }

  const RISE_TIME = 1.9;
  const RISE_DRIFT = 6;    // model units per second a get-up may travel
  const FALL_DRIFT = 130;  // and a crash slide — under its own gallop speed

  /* Reads which way the animal is lying and points the get-up at that, rather
   * than at whatever heading it had before it went down. Dragging a prone
   * horse through a ninety degree turn each frame, against hooves the ground
   * friction is holding, is what made it plough across the field. */
  function beginRise(entity) {
    const f = entity.fall;
    const c = f.p.croup, w = f.p.withers;
    let ax = w.x - c.x, ay = w.y - c.y, az = w.z - c.z;
    const flat = Math.hypot(ax, az);
    if (flat > 0.4) entity.yaw = Math.atan2(ax, az);
    entity.targetYaw = entity.yaw;

    // how far the spine is from level, split into the animal's own pitch and
    // roll so the target starts lying down and eases upright
    const L = Math.hypot(ax, ay, az) || 1;
    ax /= L; ay /= L; az /= L;
    const cy = Math.cos(entity.yaw), sy = Math.sin(entity.yaw);
    const side = ax * cy - az * sy;
    f.risePitch = Math.atan2(ay, flat / L || 1e-6) - Math.PI / 2;
    f.riseRoll = Math.asin(Math.max(-1, Math.min(1, side)));
    const lean = Math.hypot(f.risePitch, f.riseRoll);
    if (lean > Math.PI / 2) {
      const sc = (Math.PI / 2) / lean;
      f.risePitch *= sc;
      f.riseRoll *= sc;
    }
  }

  function updateFall(entity, dt) {
    const f = entity.fall;
    if (!f.active || !f.p) return;

    let acc = Math.min(dt, 0.05);
    while (acc > 0) {
      const step = Math.min(SUBSTEP, acc);
      simulate(f, step, entity.model.dims);
      acc -= step;
    }

    /* Hand the body's drift back to the entity, so the world sees the horse
     * slide across the ground rather than the sprite sliding out of its own
     * position. Rate-limited: a crash can throw a horse a long way, but a horse
     * heaving itself upright travels barely at all, and without a limit the
     * solver's fight with the get-up pose reads as the animal dragging itself
     * across the field. Whatever is held back stays as particle offset and is
     * delivered over the following frames, so a real slide still arrives — it
     * just cannot arrive faster than a horse can move. */
    const m = bodyMid(f.p);
    const cap = (f.state === 'rising' ? RISE_DRIFT : FALL_DRIFT) * dt;
    const travelled = Math.hypot(m.x, m.z);
    let gx = m.x, gz = m.z;
    if (travelled > cap) {
      const scale = cap / travelled;
      gx = m.x * scale; gz = m.z * scale;
    }
    entity.x += gx;
    entity.y += gz;
    for (const key in f.p) {
      const q = f.p[key];
      q.x -= gx; q.z -= gz; q.px -= gx; q.pz -= gz;
    }

    if (f.state === 'falling') {
      // Either it has settled, or it has been thrashing long enough that it
      // is never going to — a horse pinballing off scenery for fifteen
      // seconds is a solver that will not converge, not an animal.
      f.timer += dt;
      f.still = energy(f) < 0.7 ? f.still + dt : 0;
      if (f.still > STILL_TIME || f.timer > 3.6) {
        f.state = 'rising';
        f.rise = 0;
        beginRise(entity);
      }
      return;
    }

    /* Getting up: a horse rolls onto its chest, gets its forelegs under it and
     * heaves. Pull the joints toward the standing pose, fastest at the end. */
    f.rise += dt / RISE_TIME;
    const k = Math.min(1, f.rise);
    const ease = k * k * (3 - 2 * k);
    poseGait(entity.model, 0, 'idle');
    const target = jointPositions(entity.model, entity.yaw,
      f.risePitch * (1 - ease), f.riseRoll * (1 - ease));
    // The standing pose has its own barrel midpoint, nowhere near the origin.
    // Pulling toward it uncentred means every single frame hands that offset
    // back as drift — which is a horse that walks itself across the field
    // while lying on its side.
    const tm = {
      x: (target.croup[0] + target.withers[0]) * 0.5,
      z: (target.croup[2] + target.withers[2]) * 0.5
    };
    for (const key in target) { target[key][0] -= tm.x; target[key][2] -= tm.z; }
    const pull = Math.min(1, dt * (1.6 + 8 * k));
    for (const key in f.p) {
      const q = f.p[key], t = target[key];
      if (!t) continue;
      const ty = Math.max(t[1], q.r * 0.34);
      const dx = (t[0] - q.x) * pull, dy = (ty - q.y) * pull, dz = (t[2] - q.z) * pull;
      q.x += dx; q.y += dy; q.z += dz;
      q.px += dx; q.py += dy; q.pz += dz;
    }
    separateLimbs(f, entity.model.dims);
    if (k >= 1) {
      let worst = 0;
      for (const key in f.p) {
        const q = f.p[key], t = target[key];
        if (!t) continue;
        const e = Math.hypot(t[0] - q.x, t[1] - q.y, t[2] - q.z);
        if (e > worst) worst = e;
      }
      if (worst < 0.8 || f.rise > 2.2) {
        f.active = false;
        f.state = 'up';
        f.p = null;
      }
    }
    void ease;
  }

  function isDown(entity) { return !!(entity.fall && entity.fall.active); }

  function drawRagdoll(target, model, camera, fall) {
    const p = fall.p;
    const scale = model.root.scale || 1;
    const scaleM = R.scaling(scale);
    const l = p.rootFL, r = p.rootFR;
    let lat = [l.x - r.x, l.y - r.y, l.z - r.z];
    const ll = Math.hypot(lat[0], lat[1], lat[2]);
    lat = ll < 1e-4 ? [1, 0, 0] : [lat[0] / ll, lat[1] / ll, lat[2] / ll];

    for (let i = 0; i < BONE_SEGMENTS.length; i++) {
      const seg = BONE_SEGMENTS[i];
      const bone = model.bones[seg.bone];
      const a = p[seg.from], b = p[seg.to];
      if (!bone || !a || !b) continue;
      const m = R.multiply(scaleM,
        Rig.segmentMatrix([a.x, a.y, a.z], [b.x, b.y, b.z], seg.axis, lat));
      for (let k = 0; k < bone.parts.length; k++) {
        const pt = bone.parts[k];
        R.drawMesh(target, m, pt.mesh, R.ramp(pt.colour), camera, pt);
      }
    }
  }

  /* ================= entity ================= */

  function createEntity(h, x, y, seed) {
    const model = buildModel(h);
    // parent links, so jointPositions can walk back up the chain
    (function link(node, parent) {
      node._parent = parent || null;
      for (let i = 0; i < node.children.length; i++) link(node.children[i], node);
    })(model.root, null);
    return {
      isHorse: true,
      horse: h,
      model: model,
      x: x, y: y,
      vx: 0, vy: 0,
      yaw: 0, targetYaw: 0,
      gait: 'idle',
      animTime: Math.random() * 10,
      rider: null,
      cart: null,
      hitCooldown: 0,
      wanderTimer: 1 + Math.random() * 4,
      wanderDir: 0,
      fall: createFall(),
      buffer: null,
      rng: CM.makeRng(seed === undefined ? (Math.random() * 0xffffffff) >>> 0 : seed),
      _key: ''
    };
  }

  // Top speed and shove force both scale with the animal. A draught horse at a
  // gallop is not the same collision as a pony at a trot.
  function topSpeed(h) {
    const size = SIZES[indexOf(SIZES, h.size)];
    return { walk: 46 + h.speed * 18, run: 150 + h.speed * 95 * size.power };
  }

  function power(h) {
    const size = SIZES[indexOf(SIZES, h.size)];
    return size.power * (0.85 + h.speed * 0.3);
  }

  function renderHorse(entity, target, camera, opts) {
    const f = entity.fall;
    const qYaw = quantiseYaw(entity.yaw);
    const qTime = quantiseTime(entity.animTime);
    const key = f.active ? null :
      [qTime, qYaw, entity.gait, entity.rider ? 1 : 0].join('|');
    if (key !== null && key === entity._key && !(opts && opts.force)) return target;
    entity._key = key === null ? '' : key;

    R.clearTarget(target);
    if (f.active && f.p) {
      drawRagdoll(target, entity.model, camera, f);
    } else {
      poseGait(entity.model, qTime, entity.gait);
      Rig.drawModel(target, entity.model, camera, { yaw: qYaw });
    }
    return target;
  }

  global.HorseModel = {
    MAX_NAME_LENGTH, COATS, SIZES, BREEDS, MARKINGS, NAMES, GAITS,
    randomHorse, resolve, dimensionsFor, buildModel, saddlePoint, reinPoint,
    indexOf, pickW, quantiseTime, quantiseYaw,
    clearPose, poseGait, poseRear, jointPositions, JOINT_NAMES, BONE_SEGMENTS,
    createFall, knockDown, updateFall, isDown, drawRagdoll,
    createEntity, topSpeed, power, renderHorse,

/* vehicle.js — carts, the damage they take, and the wreckage they leave.
 *
 * A cart is built from a parts list rather than a finished mesh, so the three
 * damage stages are the same cart with planks removed, tilted or snapped
 * rather than three separately modelled wrecks. That is also what makes the
 * debris honest: a plank that falls off the deck is a plank that was on the
 * deck a moment ago, and the count that hits the ground at the end is the
 * count the cart was built from.

(function (global) {
  'use strict';

  const G = global.Geo;
  const CM = global.CharacterModel;

  /* ---------- the three carts ---------- */

  const TYPES = {
    cart: {
      id: 'cart', label: 'Cart',
      wood: '#7d5c36', woodDark: '#5e441f', iron: '#4a4540',
      hp: 100, mass: 1, length: 30, width: 19, deckY: 11,
      sideH: 6.5, chest: false, cushion: false, frail: 1,
      drops: { plank: 8, wheel: 4 }
    },
    chestCart: {
      id: 'chestCart', label: 'Chest cart',
      wood: '#6f5330', woodDark: '#523b1c', iron: '#4a4540',
      hp: 130, mass: 1.25, length: 32, width: 20, deckY: 11,
      // low sides, so the chest is the thing you see rather than a box
      // peeking over a fence
      sideH: 5.0, chest: true, cushion: false, frail: 0.85,
      // a heavier body, plus whatever was in the chest
      drops: { plank: 12, wheel: 4, wheelLoose: 3 }
    },
    luxuryCart: {
      id: 'luxuryCart', label: 'Luxury carriage',
      wood: '#241f1d', woodDark: '#15110f', iron: '#3a3530', trim: '#a8842f',
      cushion: '#8e2230', cushionDark: '#6a1622',
      hp: 110, mass: 1.15, length: 32, width: 20, deckY: 12,
      // lighter build, finer joinery: it comes apart more readily
      sideH: 10.5, chest: false, cushions: true, frail: 1.25,
      drops: { plank: 8, wheel: 4, leather: 4, feather: 6 }
    }
  };

  /* A wheel is a prism, not an ellipsoid. A superellipsoid squashed along one
   * axis gives a lens — round from the side, pointed at the rim — and at this
   * resolution that reads as a block under the cart rather than as a wheel.
   * Twelve flat faces around the rim is what makes it turn into a circle. */
  function wheelMesh(cx, cy0, cz0, radius, halfWidth, sides) {
    const verts = [];
    const faces = [];
    const n = sides || 12;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const cy = cy0 + Math.cos(a) * radius, cz = cz0 + Math.sin(a) * radius;
      verts.push(cx - halfWidth, cy, cz);
      verts.push(cx + halfWidth, cy, cz);
    }
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      faces.push([i * 2, j * 2, j * 2 + 1, i * 2 + 1]);   // rim
    }
    const left = [], right = [];
    for (let i = 0; i < n; i++) { left.push(i * 2); right.push(i * 2 + 1); }
    faces.push(left);
    faces.push(right.slice().reverse());
    return G.finish(verts, faces);
  }

  /* A cartwheel is an iron tyre over a wooden felloe, spokes, and a hub that
   * stands proud of both faces. Built in that order so the spokes read as
   * spokes: they have to span from the hub out to the rim with daylight
   * between them, not sit as four studs on a disc. */
  function wheelParts(x, y, z, radius, halfWidth, rim, iron) {
    const out = [];
    const hubR = radius * 0.26;
    const rimIn = radius * 0.80;

    // iron tyre, then the felloe just inside it
    out.push({ mesh: ringMesh(x, y, z, radius, radius * 0.90, halfWidth * 0.62, 12),
      colour: iron, tag: 'wheel' });
    out.push({ mesh: ringMesh(x, y, z, radius * 0.92, rimIn, halfWidth, 12),
      colour: rim, tag: 'wheel' });

    // spokes, hub to felloe
    const SPOKES = 8;
    for (let k = 0; k < SPOKES; k++) {
      const a = (k / SPOKES) * Math.PI * 2 + Math.PI / SPOKES;
      const ca = Math.cos(a), sa = Math.sin(a);
      const mid = (hubR + rimIn) * 0.5;
      const len = rimIn - hubR;
      out.push({
        mesh: spokeMesh(x, y + ca * mid, z + sa * mid, halfWidth * 0.52,
          len * 0.5, 0.62, a),
        colour: rim, tag: 'wheel'
      });
    }

    // hub, standing proud of both faces, with an iron band round it
    out.push({ mesh: wheelMesh(x, y, z, hubR, halfWidth * 1.55, 10), colour: rim, tag: 'wheel' });
    out.push({ mesh: wheelMesh(x, y, z, hubR * 0.78, halfWidth * 1.75, 8), colour: iron, tag: 'wheel' });

  }

  /* An annulus: the rim with a hole in it, so you can see through the spokes. */
  function ringMesh(cx, cy0, cz0, outer, inner, halfWidth, sides) {
    const verts = [];
    const faces = [];
    const n = sides || 12;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      verts.push(cx - halfWidth, cy0 + ca * outer, cz0 + sa * outer);
      verts.push(cx + halfWidth, cy0 + ca * outer, cz0 + sa * outer);
      verts.push(cx - halfWidth, cy0 + ca * inner, cz0 + sa * inner);
      verts.push(cx + halfWidth, cy0 + ca * inner, cz0 + sa * inner);
    }
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const a0 = i * 4, b0 = j * 4;
      faces.push([a0, b0, b0 + 1, a0 + 1]);             // outer rim
      faces.push([a0 + 2, a0 + 3, b0 + 3, b0 + 2]);     // inner bore
      faces.push([a0, a0 + 2, b0 + 2, b0]);             // left face
      faces.push([a0 + 1, b0 + 1, b0 + 3, a0 + 3]);     // right face

  /* One spoke, a slim bar lying in the wheel's plane at the given angle. */
  function spokeMesh(cx, cy, cz, halfWidth, halfLen, halfThick, angle) {

    const verts = [];
    const faces = [];
    for (let i = 0; i < 4; i++) {

      const v = (i & 2) ? halfThick : -halfThick;

      const pz = cz + sa * u + ca * v;
      verts.push(cx - halfWidth, py, pz);
      verts.push(cx + halfWidth, py, pz);

    faces.push([q[0], q[1], q[2], q[3]]);

    }

    /* deck planks, laid across the rails */
    const planks = 7;
    for (let i = 0; i < planks; i++) {
      if (gone['d' + i]) continue;
      const z = -halfL + 1.2 + (i + 0.5) * ((L - 2.4) / planks);
      const sag = stage > 1 && (i % 3 === 0) ? -0.9 : 0;
      parts.push(part(G.box(-halfW + 0.6, deck + sag, z - (L - 2.4) / planks / 2 + 0.25,

    const boards = t.cushions ? 3 : 2;

       * curved lid and the ironwork that say chest. */

        parts.push(part(G.box(i * cw * 0.26 - 0.3, y0 + 0.4, cz + cl - 0.12, 0.6, ch - 0.8, 0.4),

          parts.push(part(G.box(sx * (cw / 2 - 0.9) - 0.45, y0, cz + sz * (cl - 0.9) - 0.2,
            0.9, ch, 1.1), band, 'chest'));

      // a bench with padded cushions, and gilt trim along the top rail

        parts.push(part(G.superellipsoid(0, by + 8.2, -halfL + 4.6,
          (W - 6.4) / 2, 3.2, 1.7, 0.42, 4, 8), stage ? t.cushionDark : t.cushion, 'cushion'));
      } else {

        t.woodDark, 'frame'));

  }

  /* ---------- debris ---------- */

  const DEBRIS = {
    plank: { label: 'Plank', colour: '#7d5c36', w: 9, h: 1.1, d: 2.4 },
    wheel: { label: 'Wheel', colour: '#5e441f', r: 6.4 },
    leather: { label: 'Leather', colour: '#6b4526', w: 5.5, h: 0.8, d: 4.2 },
    feather: { label: 'Feathers', colour: '#e0d9c6', w: 2.6, h: 0.7, d: 1.8 }

      return wheelParts(0, 0, 0, d.r, 1.4, d.colour, '#4a4540');
    }
    if (kind === 'feather') {
      return [{ mesh: G.superellipsoid(0, 0, 0, d.w / 2, d.h / 2, d.d / 2, 0.55, 3, 7), colour: d.colour }];
    }
    return [{ mesh: G.box(-d.w / 2, -d.h / 2, -d.d / 2, d.w, d.h, d.d), colour: d.colour }];
  }

  /* What a cart throws out when it finally comes apart. Deliberately a fixed
   * list per type rather than "whatever is left", so breaking a cart always
   * yields the same haul. */
  function wreckage(type) {
    const drops = TYPES[type].drops;
    const out = [];
    for (const kind in drops) {
      const n = drops[kind];
      const k = kind === 'wheelLoose' ? 'wheel' : kind;
      for (let i = 0; i < n; i++) out.push(k);
    }
    return out;
  }

  function stageFor(hp, maxHp) {
    const f = hp / maxHp;
    if (f > 0.66) return 0;
    if (f > 0.33) return 1;
    return 2;
  }

  function create(type, x, y, seed) {
    const t = TYPES[type];
    return {
      type: type,
      def: t,
      x: x, y: y,
      vx: 0, vy: 0,
      yaw: 0,
      hp: t.hp,
      maxHp: t.hp,
      stage: 0,
      hitFlash: 0,
      hitCooldown: 0,
      shedPlanks: 0,      // planks already shaken loose, so each stage sheds once
      broken: false,

      rider: null,

      rng: CM.makeRng(seed === undefined ? (Math.random() * 0xffffffff) >>> 0 : seed),
      seed: seed === undefined ? 1 : seed

/* ===== combat.js ===== */
/* combat.js — weapons, wounds, blood and dying.
 *
 * Nothing here is deterministic. A mace that always killed in one hit would
 * be a rule rather than a fight, so every blow is
 *
 *     damage = weapon power x hit quality x target vulnerability x variation
 *
 * and the same swing can drop one villager and leave another standing. What
 * *is* deterministic is where the wound goes: the blow is resolved against a
 * height on the body, the wound is stitched to the bone it landed on, and it
 * bleeds from there until the bleeding stops — which is either because they
 * were bandaged, or because there is nothing left to bleed.
 */
(function (global) {
  'use strict';

  const G = global.Geo;
  const CM = global.CharacterModel;

  /* ================= weapons ================= */

  const BLOOD = '#6d1119';
  const BLOOD_DARK = '#48070d';
  const STEEL = '#b9bec6';
  const STEEL_DARK = '#7d838c';
  const HAFT = '#6b4a29';
  const HAFT_DARK = '#4a3119';
  const LEATHER = '#4b3320';
  const BRASS = '#a8852f';
  const BONE_COL = '#ddd6c2';

  function part(mesh, colour) { return { mesh: mesh, colour: colour }; }

  /* An axe blade is a crescent, and a crescent is the one shape a stack of
   * boxes cannot fake. This lays a fan of quads from the eye out to a curved
   * edge and closes it into a solid, so the head is one piece of steel that
   * actually meets the haft. */
  function bladeMesh(y0, y1, reach, halfWidth, curve, back) {
    const verts = [];
    const faces = [];
    const N = 7;
    const ring = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      // the edge bows out from the socket and sweeps back at both horns
      const bow = Math.sin(t * Math.PI);
      const y = y0 + (y1 - y0) * t;
      const z = -(back + reach * (0.35 + 0.65 * bow) * curve);
      ring.push([y, z]);
      verts.push(-halfWidth, y, -back);
      verts.push(halfWidth, y, -back);
      verts.push(-halfWidth * (0.45 + 0.3 * bow), y, z);
      verts.push(halfWidth * (0.45 + 0.3 * bow), y, z);
    }
    for (let i = 0; i < N; i++) {
      const a = i * 4, b = (i + 1) * 4;
      faces.push([a, a + 2, b + 2, b]);           // left face
      faces.push([a + 1, b + 1, b + 3, a + 3]);   // right face
      faces.push([a + 2, a + 3, b + 3, b + 2]);   // the edge itself
      faces.push([a, b, b + 1, a + 1]);           // the back, against the haft
    }
    faces.push([0, 1, 3, 2]);
    faces.push([N * 4, N * 4 + 2, N * 4 + 3, N * 4 + 1]);
    return G.finish(verts, faces);
  }

  /* Every weapon is modelled in the hand's own space: the grip sits at the
   * origin and the business end runs along -Y, which is the direction the
   * forearm already points. That way one attachment point serves all of them
   * and a weapon needs no bone of its own. */
  const BUILD = {
    fists: function () { return []; },

    /* Every weapon is laid out from one set of numbers so the pieces meet:
     * the grip runs from GRIP_TOP down to GRIP_BOT, the guard sits exactly at
     * GRIP_TOP, and the blade starts where the guard ends. Eyeballing offsets
     * is what leaves a blade floating a unit clear of its own crossguard. */
    club: function () {
      const p = [];
      const gripBot = 1.6, gripTop = -6.0, headTop = -14.2;
      p.push(part(G.slab(-0.85, gripTop, -0.85, 1.7, gripBot - gripTop, 1.7, 0.9, 1), HAFT_DARK));
      // wrapped grip, in bands
      for (let i = 0; i < 4; i++) {
        p.push(part(G.slab(-0.98, gripBot - 1.0 - i * 1.7, -0.98, 1.96, 1.1, 1.96, 0.85, 1),
          i % 2 ? LEATHER : '#3a2617'));
      }
      /* The head is the point of a club, so it is genuinely fat: a long
       * swelling that starts halfway down the shaft and is nearly three times
       * its width at the crown. */
      p.push(part(G.taper(-0.85, gripTop, -0.85, 1.7, 3.0, 1.7, 1.75), HAFT));
      p.push(part(G.slab(-1.5, gripTop - 3.0, -1.5, 3.0, 2.0, 3.0, 0.8, 1), HAFT));
      p.push(part(G.taper(-1.5, gripTop - 6.4, -1.5, 3.0, 3.4, 3.0, 1.45), HAFT));
      p.push(part(G.slab(-2.2, gripTop - 7.2, -2.2, 4.4, (gripTop - 7.2) - headTop, 4.4, 0.72, 1), HAFT));
      p.push(part(G.superellipsoid(0, headTop + 0.6, 0, 2.2, 1.5, 2.2, 0.55, 4, 9), HAFT));
      // iron bands and studs round the crown
      p.push(part(G.slab(-2.35, gripTop - 8.4, -2.35, 4.7, 0.9, 4.7, 0.85, 1), STEEL_DARK));
      p.push(part(G.slab(-2.35, headTop + 1.6, -2.35, 4.7, 0.9, 4.7, 0.85, 1), STEEL_DARK));
      for (let i = 0; i < 6; i++) {

        p.push(part(G.superellipsoid(Math.cos(a) * 2.1, headTop + 3.4, Math.sin(a) * 2.1,

    },

    dagger: function () {

      const gripTop = -0.9, gripBot = 3.4, guardH = 0.9, bladeLen = 7.4;
      p.push(part(G.slab(-0.62, gripTop, -0.62, 1.24, gripBot - gripTop, 1.24, 0.8, 1), LEATHER));

      for (let i = 0; i < 4; i++) {

    /* A bow is a stave that bends. Segments are placed along a curve and each
     * one is long enough to overlap its neighbour, so the limb reads as one
     * piece of wood rather than as a row of blocks. */
    bow: function () {
      const p = [];
      const N = 9, SPAN = 17.0;
      let prev = null;
      for (let i = 0; i <= N; i++) {
        const t = (i / N) * 2 - 1;
        const y = -t * SPAN;
        const z = -(1 - t * t) * 3.4;
        if (prev) {
          const my = (y + prev.y) / 2, mz = (z + prev.z) / 2;
          const len = Math.hypot(y - prev.y, z - prev.z) * 0.62;
          const thick = 0.62 - Math.abs(t) * 0.22;
          p.push(part(G.slab(-thick, my - len, mz - thick, thick * 2, len * 2, thick * 2, 0.8, 1),
            Math.abs(t) > 0.82 ? HAFT_DARK : HAFT));
        }
        prev = { y: y, z: z };
      }
      // the grip, and horn nocks at the tips
      p.push(part(G.slab(-0.82, -2.4, -0.62 - 0.9, 1.64, 4.8, 1.9, 0.82, 1), LEATHER));
      p.push(part(G.superellipsoid(0, SPAN, 0, 0.55, 0.9, 0.55, 0.5, 3, 7), BONE_COL));
      p.push(part(G.superellipsoid(0, -SPAN, 0, 0.55, 0.9, 0.55, 0.5, 3, 7), BONE_COL));
      // string, straight between the nocks
      p.push(part(G.box(-0.16, -SPAN, -0.16, 0.32, SPAN * 2, 0.32), '#e6e0cc'));
      return p;
    },

    crossbow: function () {
      const p = [];
      const stockTop = -13.0, stockBot = 5.0, prodY = -11.4;
      // stock, tapering to the butt
      p.push(part(G.box(-0.95, stockTop, -1.1, 1.9, stockBot - stockTop, 2.2), HAFT));
      p.push(part(G.taper(-1.05, stockBot - 1.0, -1.35, 2.1, 3.2, 2.7, 0.75), HAFT_DARK));
      // the channel the bolt sits in
      p.push(part(G.box(-0.42, stockTop + 0.4, -1.3, 0.84, 9.0, 0.5), '#3a2617'));
      // prod, curving forward, built as overlapping segments
      const N = 7, SPAN = 8.2;
      for (let i = 0; i < N; i++) {
        const t = ((i + 0.5) / N) * 2 - 1;
        const x = t * SPAN;
        const z = -1.0 - (1 - t * t) * 1.8;
        const thick = 0.68 - Math.abs(t) * 0.2;
        p.push(part(G.slab(x - SPAN / N, prodY - thick, z - thick,
          (SPAN / N) * 2.1, thick * 2, thick * 2, 0.8, 1),
          Math.abs(t) > 0.8 ? STEEL_DARK : HAFT_DARK));
      }
      p.push(part(G.box(-1.5, prodY - 0.9, -1.4, 3.0, 1.8, 2.8), STEEL_DARK));
      // string across the tips, and the nut and trigger
      p.push(part(G.box(-SPAN, prodY - 0.18, -0.9, SPAN * 2, 0.36, 0.36), '#e6e0cc'));
      p.push(part(G.superellipsoid(0, stockTop + 5.4, -0.7, 0.85, 0.85, 0.7, 0.5, 3, 8), BONE_COL));
      p.push(part(G.box(-0.35, stockTop + 5.0, 0.2, 0.7, 2.6, 0.7), STEEL_DARK));
      p.push(part(G.box(-0.5, stockTop + 7.2, -0.4, 1.0, 0.8, 1.6), STEEL_DARK));
      return p;
    }

  /* power        — the base of the damage roll
   * reach        — how far in front the blow lands, in model units
   * swing        — seconds from the start of the attack to the moment it lands
   * recover      — seconds after that before you can swing again
   * kind         — blunt staggers and knocks down; edged and pierce bleed
   * bleed        — how much a wound from this weapon bleeds, per second
   * arc          — how wide a cone it covers, in radians either side
   * gore         — whether a hit leaves a slash across the body */
  const WEAPONS = {

      swing: 0.17, recover: 0.16, bleed: 0.0, arc: 0.6, stamina: 2, anim: 'jab',
      gore: 0, knock: 0.35, twoHanded: false },
    club: { id: 'club', label: 'Club', kind: 'blunt', power: 17, reach: 19,
      swing: 0.24, recover: 0.30, bleed: 0.02, arc: 0.75, stamina: 5, anim: 'swing',
      gore: 0, knock: 0.85, twoHanded: false },
    dagger: { id: 'dagger', label: 'Dagger', kind: 'pierce', power: 23, reach: 14,
      swing: 0.13, recover: 0.16, bleed: 0.85, arc: 0.5, stamina: 3, anim: 'stab',
      gore: 0.4, knock: 0.15, twoHanded: false },
    sword: { id: 'sword', label: 'Sword', kind: 'edged', power: 31, reach: 27,

      gore: 0, knock: 1.25, twoHanded: false },
    spear: { id: 'spear', label: 'Spear', kind: 'pierce', power: 34, reach: 40,
      swing: 0.22, recover: 0.34, bleed: 0.95, arc: 0.4, stamina: 6, anim: 'thrust',
      gore: 0.5, knock: 0.5, twoHanded: true },
    greatsword: { id: 'greatsword', label: 'Greatsword', kind: 'edged', power: 49,
      reach: 35, swing: 0.42, recover: 0.52, bleed: 1.5, arc: 1.25, stamina: 12,
      anim: 'slash', gore: 1, knock: 1.1, twoHanded: true },
    poleaxe: { id: 'poleaxe', label: 'Poleaxe', kind: 'edged', power: 52, reach: 42,
      swing: 0.48, recover: 0.58, bleed: 1.4, arc: 0.9, stamina: 13, anim: 'overhead',
      gore: 1, knock: 1.35, twoHanded: true },
    bow: { id: 'bow', label: 'Bow', kind: 'pierce', power: 29, reach: 0,
      swing: 0.52, recover: 0.45, bleed: 0.8, arc: 0, stamina: 5, anim: 'draw',
      gore: 0.3, knock: 0.2, twoHanded: true, ranged: 340, range: 260 },
    crossbow: { id: 'crossbow', label: 'Crossbow', kind: 'pierce', power: 45, reach: 0,
      swing: 0.36, recover: 1.5, bleed: 1.0, arc: 0, stamina: 6, anim: 'aim',
      gore: 0.4, knock: 0.35, twoHanded: true, ranged: 430, range: 300 }
  };

  const MELEE_IDS = ['club', 'dagger', 'sword', 'axe', 'mace', 'spear', 'greatsword', 'poleaxe'];
  const ALL_IDS = MELEE_IDS.concat(['bow', 'crossbow']);

  const _cache = {};
  function weaponParts(id) {
    if (!BUILD[id]) return [];
    if (!_cache[id]) _cache[id] = BUILD[id]();
    return _cache[id];
  }

  function weapon(id) { return WEAPONS[id] || WEAPONS.fists; }

  /* ================= the damage roll ================= */

  const MAX_HP = 100;

  /* Where on the body a blow landed, as a fraction of standing height, and
   * how badly that place takes it. Deciding this before the damage is what
   * lets the wound be stitched to the right bone afterwards. */
  const ZONES = [
    { id: 'head', bone: 'head', from: 0.82, to: 1.0, quality: 1.85, lethal: 2.2 },
    { id: 'chest', bone: 'torso', from: 0.58, to: 0.82, quality: 1.25, lethal: 1.5 },
    { id: 'gut', bone: 'torso', from: 0.44, to: 0.58, quality: 1.1, lethal: 1.25 },
    { id: 'arm', bone: 'armR', from: 0.60, to: 0.78, quality: 0.65, lethal: 0.5 },
    { id: 'leg', bone: 'legR', from: 0.0, to: 0.44, quality: 0.7, lethal: 0.45 }
  ];

  function zoneFor(id) {
    for (let i = 0; i < ZONES.length; i++) if (ZONES[i].id === id) return ZONES[i];
    return ZONES[1];
  }

  /* Rolls where a blow lands. Most blows go to the body; a careful attacker
   * (standing still, close, facing them) lands higher and better. */
  function rollZone(rng, aim) {
    const r = rng();
    const good = aim === undefined ? 0.5 : aim;
    if (r < 0.06 + good * 0.14) return zoneFor('head');
    if (r < 0.52 + good * 0.12) return zoneFor('chest');
    if (r < 0.70) return zoneFor('gut');
    if (r < 0.86) return zoneFor('arm');
    return zoneFor('leg');
  }

  /* damage = power x hit quality x vulnerability x variation.
   *
   * Hit quality folds in where it landed and how well it was thrown. Being
   * already hurt makes the next blow worse, which is what produces fights
   * that turn rather than fights that grind. */
  function rollDamage(w, target, opts) {
    const o = opts || {};
    const rng = o.rng || Math.random;
    const zone = o.zone || rollZone(rng, o.aim);
    // the health lives on the body, not on the actor that owns it
    const body = target.body || target;
    const hp = typeof body.hp === 'number' ? body.hp : MAX_HP;
    const hurt = 1 - Math.max(0, Math.min(1, hp / MAX_HP));
    const vulnerable = 1 + hurt * 0.75 + (o.defenceless ? 0.4 : 0)
      + (body.blocking ? -0.55 : 0);
    const variation = 0.72 + rng() * 0.62;
    const quality = zone.quality * (0.75 + (o.aim === undefined ? 0.5 : o.aim) * 0.5)
      * (o.charge || 1);
    const amount = w.power * quality * Math.max(0.15, vulnerable) * variation;
    return {
      amount: amount,
      zone: zone,
      // bleeding scales with how deep it went, not just how hard
      bleed: w.bleed * (0.6 + variation * 0.7) * zone.lethal * 0.7,
      knock: w.knock * variation * (zone.id === 'leg' ? 1.3 : 1),
      kind: w.kind,
      gore: w.gore
    };
  }

  /* ================= wounds ================= */

  /* A wound is a mark stitched to a bone, at a spot on that bone. It is drawn
   * with the body, so it turns with them, swings with the limb it is on, and
   * stays where the blow landed rather than floating at chest height. */
  function makeWound(model, zone, dirLocal, kind, gore, rng) {
    const d = model.dims;
    const bone = model.bones[zone.bone] ? zone.bone : 'torso';
    // a spot on the front-ish surface of that bone, offset by where the blow
    // came from, so a hit from the left lands on the left
    const spreadX = (zone.id === 'head' ? d.headW : d.torsoW) * 0.34;
    const x = (dirLocal[0] * 0.55 + (rng() - 0.5) * 0.5) * spreadX;
    const z = (dirLocal[1] * 0.5 + (rng() - 0.5) * 0.4)
      * (zone.id === 'head' ? d.headD : d.torsoD) * 0.52;
    let y;
    if (zone.bone === 'head') y = 1.5 + rng() * 4.5;
    else if (zone.bone === 'torso') y = zone.id === 'gut' ? 1.0 + rng() * 3.0 : 4.5 + rng() * 5.5;
    else if (zone.bone === 'armR') y = -1.0 - rng() * 3.5;
    else y = -1.5 - rng() * 4.0;

    const slash = kind === 'edged' && gore >= 1;
    return {
      bone: bone,
      x: x, y: y, z: z,
      // a slash is a long cut across the body; a stab or a bruise is a patch
      w: slash ? 5.5 + rng() * 4.5 : 1.6 + rng() * 1.6,
      h: slash ? 0.9 + rng() * 0.5 : 1.5 + rng() * 1.3,

      R.fillRect(target, plateX, plateY, 1, 1, 0);
      R.fillRect(target, plateX + nameW - 1, plateY, 1, 1, 0);
      T.draw(target, box.speaker, plateX + 6 * S, plateY + 2 * S, COLOURS.plateText);
    }

    const page = currentPage(box);
    const shown = page.slice(0, Math.floor(box.revealed));
    const lines = T.wrap(page, w - 22 * S);

    // Wrap the full page once, then reveal per line, so text never re-flows
    // mid-reveal — re-flowing is the classic typewriter bug.
    let remaining = shown.length;
    let ty = y + 9 * S;
    for (let i = 0; i < lines.length && i < 3; i++) {
      const line = lines[i];
      const take = Math.max(0, Math.min(line.length, remaining));
      if (take > 0) T.draw(target, line.slice(0, take), x + 10 * S, ty, COLOURS.text);
      remaining -= line.length + 1; // +1 for the space the wrap consumed
      ty += T.LINE_H + 3 * S;
    }

    if (pageComplete(box)) {
      const bob = Math.round(Math.sin(box.time * 5.0) * 1.5) * S;
      drawArrow(target, x + w - 13 * S, y + h - 12 * S + bob, S);
    }

    // page pips, so you can see how much is left
    const pips = box.pages.length;
    if (pips > 1) {
      for (let i = 0; i < pips; i++) {
        const px = x + w - 10 * S - (pips - 1 - i) * 5 * S;
        const on = i <= box.pageIndex;
        R.fillRect(target, px, y + 5 * S, 3 * S, 3 * S, on ? COLOURS.arrow : COLOURS.panelShade);
      }
    }
  }

  // A downward chevron, drawn as explicit pixel rows.
  function drawArrow(target, x, y, s) {
    for (let i = 0; i < 4; i++) {
      R.fillRect(target, x + i * s, y + i * s, (7 - i * 2) * s, s, COLOURS.arrow);
    }
  }

  global.Dialogue = {
    create, start, update, advance, close, draw,
    currentPage, pageComplete, COLOURS
  };
})(window);

/* ===== world.js ===== */
/* world.js — the test scene.
 *
 * Movement is velocity-based rather than position-based: input steers a
 * velocity, friction bleeds it off, and a hard direction change at speed costs
 * control instead of turning on a pin. Obstacles and villagers are solid, and
 * running into a villager fast enough puts them on the ground.
 */
(function (global) {
  'use strict';

  const R = global.Render;
  const T = global.Text;
  const CM = global.CharacterModel;
  const Rig = global.Rig;
  const D = global.Dialogue;
  const HM = global.HorseModel;
  const V = global.Vehicle;
  const CB = global.Combat;
  const I = global.Items;

  // The field of view in world units, and how many art pixels each unit gets.
  // Raising PIXEL makes the pixels smaller and more numerous — finer pixel
  // art, same amount of world on screen.
  const VIEW_W = 320, VIEW_H = 180;
  const PIXEL = 3;
  const RENDER_W = VIEW_W * PIXEL, RENDER_H = VIEW_H * PIXEL;
  // Large enough that the camera can stay locked to the player without ever
  // running off the edge of the generated ground.
  // Room to run. A chase that ends at the edge of the map after four seconds
  // is not a chase, so the field is far larger than the village needs.
  const WORLD_W = 2600, WORLD_H = 1800;
  const GROUND_W = WORLD_W * PIXEL, GROUND_H = WORLD_H * PIXEL;

  // The same camera pitch as the forge preview at a fraction of its scale, so
  // a villager in the world is the forge model sized down rather than a
  // differently-proportioned one.
  const ACTOR_BUF = {
    w: 112 * PIXEL, h: 104 * PIXEL, ox: 56 * PIXEL, oy: 80 * PIXEL
  };
  const CAM_PITCH = 0.26;
  const CAM_SCALE = 1.35 * PIXEL;

  const SPEED = { walk: 52, run: 112, npc: 26 };
  const ACCEL = 520;           // px/s^2 while steering
  const SKID_ACCEL = 165;      // reduced authority through a hard turn
  const FRICTION = 680;        // px/s^2 once input stops
  const SKID_FRICTION = 380;   // a short slide, not a long one

  const PLAYER_R = 6.5;
  const NUDGE_SPEED = 30;      // above this, a bump visibly jostles you
  const TRIP_SPEED = 62;       // above this, an obstacle trips you
  const FALL_SPEED = 104;      // scenery at nearly full sprint floors you
  const CHEST_H = 20;          // contact heights, in model units
  const TALK_RANGE = 40;
  const CHAT_NOTICE = 110;     // far enough to catch someone's eye
  const CHAT_CLOSE = 20;       // how close they actually stand to talk
  const CHAT_BREAK = 54;       // drift further apart than this and it is over
  const GREET_RANGE = 70;
  const COMFORT_RANGE = 24;

  /* ---------- mounted play ---------- */

  const MOUNT_RANGE = 26;      // how close you have to be to swing up
  const MOUNT_TIME = 0.42;     // how long the swing takes
  const HORSE_BUF = { w: 176 * PIXEL, h: 152 * PIXEL, ox: 88 * PIXEL, oy: 128 * PIXEL };
  const CART_BUF = { w: 192 * PIXEL, h: 136 * PIXEL, ox: 96 * PIXEL, oy: 112 * PIXEL };
  const DEBRIS_BUF = { w: 40 * PIXEL, h: 40 * PIXEL, ox: 20 * PIXEL, oy: 26 * PIXEL };
  const HORSE_R = 11;
  const CART_R = 12;
  // A galloping horse hits far harder than a sprinting man, so scenery that
  // only trips you on foot puts a horse down.
  const HORSE_FALL_SPEED = 150;
  const HITCH_RANGE = 34;

  const TEST_PAGES = ['test123 test123', 'test123 test123', 'test123 test123'];

  /* ---------- ground ---------- */

  const GRASS = ['#4a6b3a', '#53743f', '#456535', '#5c7d46', '#3f5c32'];
  const DIRT = ['#7d6844', '#8a7450', '#6f5c3c', '#937d57'];

  // One flat palette so the ground can be stored as one byte per pixel. At
  // three pixels per world unit a full-colour buffer would be 34MB.
  const GROUND_PALETTE = GRASS.concat(DIRT).map(function (h) {
    const c = R.hexToRgb(h);
    return R.pack(c[0], c[1], c[2]);
  });
  const DIRT0 = GRASS.length;

  function pathCentre(x) {
    return WORLD_H * 0.6 + Math.sin(x * 0.008) * 48 + Math.sin(x * 0.028) * 9;
  }

  function buildGround(seed) {
    const rng = CM.makeRng(seed);
    const buf = new Uint8Array(GROUND_W * GROUND_H);
    const inv = 1 / PIXEL;

    /* The field noise varies over world units, not over art pixels, so it is
     * evaluated once per world unit and filled into the PIXEL x PIXEL block —
     * nine times fewer trig calls for an identical result. The speckle stays
     * per pixel, because that is the grass texture. */
    for (let wy = 0; wy < WORLD_H; wy++) {
      const y = wy;
      const cosY = Math.cos(y * 0.11);
      for (let wx = 0; wx < WORLD_W; wx++) {
        const n = Math.sin(wx * 0.09) * cosY + Math.sin((wx + y) * 0.05) * 0.6;
        const base = n > 0.8 ? 3 : n > 0.15 ? 1 : n > -0.5 ? 0 : 2;
        for (let sy = 0; sy < PIXEL; sy++) {
          const row = (wy * PIXEL + sy) * GROUND_W + wx * PIXEL;
          for (let sx = 0; sx < PIXEL; sx++) {
            buf[row + sx] = rng() < 0.05 ? 4 : base;
          }
        }
      }
    }

    // the road, and the track running north off it
    for (let px = 0; px < GROUND_W; px++) {
      const x = px * inv;
      const centre = pathCentre(x);
      const halfWidth = 14 + Math.sin(x * 0.02) * 3;
      const from = Math.floor((centre - halfWidth) * PIXEL);
      const to = Math.ceil((centre + halfWidth) * PIXEL);
      for (let py = from; py < to; py++) {
        if (py < 0 || py >= GROUND_H) continue;
        const edge = Math.abs(py * inv - centre) / halfWidth;
        if (edge > 0.86 && rng() < 0.55) continue;
        buf[py * GROUND_W + px] = DIRT0 + (edge > 0.6 ? 2 : (rng() < 0.25 ? 1 : 0));
      }
    }
    for (let py = 0; py < GROUND_H * 0.62; py++) {
      const y = py * inv;
      const centre = WORLD_W * 0.38 + Math.sin(y * 0.014) * 20;
      const from = Math.floor((centre - 10) * PIXEL), to = Math.ceil((centre + 10) * PIXEL);
      for (let px = from; px < to; px++) {
        if (px < 0 || px >= GROUND_W) continue;
        const edge = Math.abs(px * inv - centre) / 10;
        if (edge > 0.8 && rng() < 0.5) continue;
        buf[py * GROUND_W + px] = DIRT0 + (edge > 0.6 ? 2 : 0);
      }
    }

    // tufts and pebbles, now at the finer pixel size
    for (let i = 0; i < 2600 * PIXEL; i++) {
      const px = Math.floor(rng() * GROUND_W), py = Math.floor(rng() * GROUND_H);
      const on = buf[py * GROUND_W + px];
      const c = on >= DIRT0 ? DIRT0 + 3 : (rng() < 0.5 ? 3 : 4);
      const len = 1 + Math.floor(rng() * 2 * PIXEL);
      for (let k = 0; k < len; k++) {
        const yy = py - k;
        if (yy >= 0) buf[yy * GROUND_W + px] = c;
      }
    }
    return buf;
  }

  /* ---------- props ---------- */

  const G = global.Geo;

  function renderBoxes(boxes, bufW, bufH, ox, oy, scale) {
    const target = R.createTarget(bufW, bufH);
    target.footY = oy;   // where the ground line sits inside the sprite
    R.clearTarget(target);
    const camera = R.makeCamera(CAM_PITCH, scale, ox, oy);
    const identity = R.identity();
    for (let i = 0; i < boxes.length; i++) {
      R.drawMesh(target, identity, boxes[i].mesh, R.ramp(boxes[i].colour), camera, {});
    }
    R.traceOutline(target, Rig.OUTLINE);
    return target;
  }

  function makeTree(rng) {
    const boxes = [];
    // Roughly three times a person, so running into one is obviously running
    // into something you cannot go over.
    const trunkH = 34 + rng() * 13;
    const tw = 7.6 + rng() * 1.6;                 // a trunk you clearly cannot pass
    boxes.push({ mesh: G.slab(-tw / 2, 0, -tw / 2, tw, trunkH, tw, 0.62, 1), colour: '#4d3726' });
    // a flare at the base so it meets the ground like a tree, not a post
    boxes.push({
      mesh: G.taper(-(tw + 2.6) / 2, 0, -(tw + 2.6) / 2, tw + 2.6, 5.5, tw + 2.6, 0.72),
      colour: '#42301f'
    });

    /* Canopy: two rings of clumps plus a crown, so the top reads as a mass of
     * leaves rather than a handful of separate blobs. The lower ring is
     * pushed out and down to give the silhouette a wide, heavy skirt. */
    const dark = ['#2f4a28', '#274123', '#345127'];
    const light = ['#3d5f31', '#446a36', '#39572f'];
    function clump(x, y, z, s, lit) {
      boxes.push({
        mesh: G.superellipsoid(x, y, z, s / 2, s / 2 * 0.86, s / 2, 0.78, 5, 10),
        colour: (lit ? light : dark)[Math.floor(rng() * 3)]
      });
    }
    // Each clump is wider than the gap to its neighbour, so the ring reads as
    // one mass of foliage. Spaced any further and you just see the individual
    // balls the canopy is built from.
    const base = trunkH - 3;
    const lower = 7 + Math.floor(rng() * 2);
    for (let i = 0; i < lower; i++) {
      const a = (i / lower) * Math.PI * 2 + rng() * 0.4;
      const rad = 8.5 + rng() * 1.8;
      const s = 15 + rng() * 4;
      clump(Math.cos(a) * rad, base + 1 + rng() * 2, Math.sin(a) * rad, s, false);
    }
    const upper = 6;
    for (let i = 0; i < upper; i++) {
      const a = (i / upper) * Math.PI * 2 + rng() * 0.4 + 0.5;
      const rad = 5 + rng() * 1.8;
      const s = 14 + rng() * 4;
      clump(Math.cos(a) * rad, base + 8 + rng() * 2.5, Math.sin(a) * rad, s, rng() < 0.65);
    }
    // crown, and a filler under it so the two rings never show daylight
    clump(0, base + 5, 0, 16 + rng() * 2, false);
    clump(rng() * 2 - 1, base + 14 + rng() * 2, rng() * 2 - 1, 14 + rng() * 3, true);
    return renderBoxes(boxes, 128 * PIXEL, 168 * PIXEL, 64 * PIXEL, 158 * PIXEL, CAM_SCALE);
  }

  function makeRock(rng) {
    const B = global.Parts.box;
    const boxes = [];
    const n = 2 + Math.floor(rng() * 3);
    for (let i = 0; i < n; i++) {
      const s = 3.5 + rng() * 4;
      boxes.push({
        mesh: G.superellipsoid((rng() - 0.5) * 4, rng() * 2 + s * 0.4, (rng() - 0.5) * 4,
          s / 2, s * 0.42, s / 2, 0.55, 4, 8),
        colour: rng() < 0.5 ? '#6d6a63' : '#5a5750'
      });
    }
    return renderBoxes(boxes, 44 * PIXEL, 44 * PIXEL, 22 * PIXEL, 36 * PIXEL, CAM_SCALE);
  }

  function makeBarrel() {
    const B = global.Parts.box;
    const boxes = [];
    // barrels bulge in the middle
    boxes.push({ mesh: G.superellipsoid(0, 4.2, 0, 3.6, 4.3, 3.6, 0.45, 5, 10), colour: '#6b4a2c' });
    boxes.push({ mesh: G.superellipsoid(0, 2.0, 0, 3.7, 0.55, 3.7, 0.4, 3, 10), colour: '#4a4038' });
    boxes.push({ mesh: G.superellipsoid(0, 6.4, 0, 3.7, 0.55, 3.7, 0.4, 3, 10), colour: '#4a4038' });
    return renderBoxes(boxes, 40 * PIXEL, 48 * PIXEL, 20 * PIXEL, 40 * PIXEL, CAM_SCALE);
  }

  function makeCart() {
    const B = global.Parts.box;
    const boxes = [];
    boxes.push({ mesh: B(-9, 4.5, -5, 18, 3.5, 10), colour: '#6b4f31' });
    boxes.push({ mesh: B(-9, 8, -5, 18, 2.5, 1), colour: '#5a4128' });
    boxes.push({ mesh: B(-9, 8, 4, 18, 2.5, 1), colour: '#5a4128' });
    for (let i = 0; i < 2; i++) {
      const z = i === 0 ? -5.5 : 5.5;
      // round cartwheels
      boxes.push({ mesh: G.superellipsoid(-9, 4.4, z, 0.9, 4.4, 4.4, 0.95, 4, 10), colour: '#43301e' });
      boxes.push({ mesh: G.superellipsoid(9, 4.4, z, 0.9, 4.4, 4.4, 0.95, 4, 10), colour: '#43301e' });
    }
    return renderBoxes(boxes, 72 * PIXEL, 60 * PIXEL, 36 * PIXEL, 48 * PIXEL, CAM_SCALE);
  }

  /* ---------- world construction ---------- */

  function createWorld(playerCharacter, seed) {
    seed = seed === undefined ? 20260913 : seed;
    const rng = CM.makeRng(seed);

    const world = {
      w: WORLD_W, h: WORLD_H,
      ground: buildGround(seed),
      props: [],
      actors: [],
      horses: [],
      carts: [],
      debris: [],
      arrows: [],
      blood: [],
      loot: [],            // items lying on the grass
      container: null,      // the chest you have open, if any
      ui: { open: false, hover: null, drag: null, mx: 0, my: 0 },
      time: 0,
      wanted: 0,
      reputation: 0,
      reputationCriminal: 0,
      lastSeenAt: -999,
      camX: 0, camY: 0,
      box: D.create(),
      talkingTo: null,
      prompt: null,
      input: { dx: 0, dy: 0, sprint: false },
      seed: seed
    };

    const treeSprites = [makeTree(rng), makeTree(rng), makeTree(rng), makeTree(rng)];
    const rockSprites = [makeRock(rng), makeRock(rng)];
    const barrelSprite = makeBarrel();
    const cartSprite = makeCart();

    // `tall` decides what happens when you hit it at speed: you go over a low
    // obstacle, you bounce off a tall one.
    /* `hardness` is how much of an impact the object gives back. A trunk does
     * not move, so all of it goes into the cart; a barrel tips over and takes
     * most of it with it. */
    function addProp(sprite, x, y, r, tall, hardness) {
      world.props.push({
        sprite: sprite, x: x, y: y, footY: sprite.footY, r: r,
        shadowR: r * 1.5, tall: !!tall,
        hardness: hardness === undefined ? 1 : hardness
      });
    }

    for (let i = 0; i < 34; i++) {
      const x = 40 + rng() * (WORLD_W - 80);
      const y = 40 + rng() * (WORLD_H - 80);
      if (Math.abs(y - pathCentre(x)) < 36) continue; // keep the road clear
      addProp(treeSprites[Math.floor(rng() * treeSprites.length)], x, y, 7.5, true, 1.0);
    }
    for (let i = 0; i < 22; i++) {
      addProp(rockSprites[Math.floor(rng() * rockSprites.length)],
        40 + rng() * (WORLD_W - 80), 40 + rng() * (WORLD_H - 80), 4.5, false, 0.8);
    }
    addProp(cartSprite, WORLD_W * 0.46, pathCentre(WORLD_W * 0.46) - 26, 10, false, 0.55);
    addProp(barrelSprite, WORLD_W * 0.42, WORLD_H * 0.5, 4, false, 0.35);
    addProp(barrelSprite, WORLD_W * 0.435, WORLD_H * 0.52, 4, false, 0.35);
    addProp(barrelSprite, WORLD_W * 0.415, WORLD_H * 0.535, 4, false, 0.35);

    /* player */
    const player = Rig.createActor(playerCharacter, WORLD_W * 0.4, WORLD_H * 0.55, 1);
    player.isPlayer = true;
    player._id = 'player';
    player.leftHanded = !!playerCharacter.leftHanded;
    // You start with nothing. Everything you carry, you took from somewhere.
    player.buffer = R.createTarget(ACTOR_BUF.w, ACTOR_BUF.h);
    world.actors.push(player);
    world.player = player;

    /* villagers, and among them the watch */
    const GUARD_KIT = ['sword', 'club', 'spear', 'sword', 'bow'];
    for (let i = 0; i < 16; i++) {
      const ch = CM.randomCharacter(rng);
      const guard = i < 5;
      if (guard) {
        // the livery: a guard off duty is just a person, but on duty they are
        // unmistakably one of them
        ch.tunic = 'slate';
        ch.trouser = 'charcoal';
        ch.garment = 'surcoat';
      }
      const a = Rig.createActor(ch,
        player.x + (rng() - 0.5) * 640, player.y + (rng() - 0.5) * 460,
        (seed + i * 977) >>> 0);
      a._id = 'v' + i;
      a.buffer = R.createTarget(ACTOR_BUF.w, ACTOR_BUF.h);
      a.leftHanded = rng() < 0.12;
      a.brain = { state: 'pause', timer: 0.5 + rng() * 2.5, dirIndex: Math.floor(rng() * 8),
        gestureCooldown: rng() * 5, partner: null, chatCooldown: rng() * 8,
        guard: guard, guardState: 'patrol' };
      if (guard) {
        const kit = GUARD_KIT[i % GUARD_KIT.length];
        a.inv[I.HAND] = I.stack(kit, 1);
        if (kit === 'bow') I.add(a.inv, 'arrow', 18);
        else a.inv[I.SHIELD] = I.stack('shield', 1);
        // A guard always keeps a slot free. It is what lets them put the
        // weapon away and deal with something without killing anybody.
        a.stowed = undefined;
        a.alert = true;
      }
      // Villagers are not armed. A town where every baker is carrying a club
      // turns any incident into a brawl, and it makes the watch meaningless.
      if (rng() < 0.6) I.add(a.inv, 'coin', 3 + Math.floor(rng() * 30));
      world.actors.push(a);
    }

    /* horses, loose on the grass near where the player starts */
    for (let i = 0; i < 9; i++) {
      const hr = CM.makeRng((seed + 4001 + i * 733) >>> 0);
      const h = HM.createEntity(HM.randomHorse(hr),
        player.x + (rng() - 0.5) * 300, player.y + 60 + (rng() - 0.5) * 260,
        (seed + 4001 + i * 733) >>> 0);
      h.yaw = Math.floor(rng() * 4) * (Math.PI / 2);
      h.targetYaw = h.yaw;
      h.buffer = R.createTarget(HORSE_BUF.w, HORSE_BUF.h);
      world.horses.push(h);
    }

    /* A couple of villagers are out riding. The road is not only for guards. */
    for (let i = 0; i < 2; i++) {
      const rider = world.actors[3 + i];
      const h = world.horses[i];
      if (!rider || !h) continue;
      rider.mount = h; h.rider = rider;
      rider.mountTime = MOUNT_TIME;
      rider.x = h.x; rider.y = h.y;
      rider.brain.rides = true;
      rider.brain.rideTimer = 2 + rng() * 5;
    }

    /* one of each cart, parked where you can get to them */
    const cartTypes = ['cart', 'chestCart', 'luxuryCart'];
    for (let i = 0; i < cartTypes.length; i++) {
      const c = V.create(cartTypes[i],
        player.x - 90 + i * 78, player.y - 66 + (i % 2) * 26,
        (seed + 9001 + i * 311) >>> 0);
      c.yaw = Math.PI / 2;
      c.buffer = R.createTarget(CART_BUF.w, CART_BUF.h);
      if (c.def.chest) {
        // something to actually find, so the container is worth opening
        c.store = I.createInventory(I.CHEST_SLOTS, false);
        const loot = ['sword', 'axe', 'mace', 'dagger', 'club', 'spear',
          'greatsword', 'poleaxe', 'bow', 'crossbow', 'shield', 'buckler'];
        for (let k = 0; k < loot.length; k++) I.add(c.store, loot[k], 1);
        I.add(c.store, 'arrow', 40);
        I.add(c.store, 'bolt', 25);
        I.add(c.store, 'bandage', 4);
      }
      world.carts.push(c);
    }

    return world;
