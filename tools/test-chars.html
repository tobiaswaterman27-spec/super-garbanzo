<!doctype html><meta charset="utf-8"><body style="background:#5a7a4a;margin:0">
<canvas id="c"></canvas>
<script src="../src/core/base.js"></script>
<script src="../src/art/palette.js"></script>
<script src="../src/art/raster.js"></script>
<script src="../src/art/character.js"></script>
<script>
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'grid', S = +(q.get('s') || 4);
const c = document.getElementById('c'), ctx = c.getContext('2d');
if (mode === 'grid') {
  const roles = ['villager','blacksmith','baker','farmer','guard','innkeeper','merchant','noble','outlaw','doctor','priest','woodcutter'];
  const n = 12; c.width = n*32*S; c.height = 4*48*S; ctx.imageSmoothingEnabled=false;
  for (let i=0;i<n;i++) { const a = O.Char.makeAppearance(1000+i*7, {role: roles[i%roles.length], age: 20+((i*13)%50)});
    for (let d=0; d<4; d++) ctx.drawImage(O.Char.frame(a,d,'idle',0), i*32*S, d*48*S, 32*S, 48*S); }
} else if (mode === 'anim') {
  const a = O.Char.makeAppearance(+(q.get('seed')||42), {role: q.get('role')||'blacksmith', sex: q.get('sex')||undefined, age: +(q.get('age')||30)});
  const anims = (q.get('anims')||'idle,walk,run,work').split(',');
  c.width = 6*32*S; c.height = anims.length*4*48*S; ctx.imageSmoothingEnabled=false;
  let r=0; for (const an of anims) for (let d=0; d<4; d++,r++) for (let f=0; f<O.Char.ANIMS[an].frames; f++) ctx.drawImage(O.Char.frame(a,d,an,f), f*32*S, r*48*S, 32*S, 48*S);
} else if (mode === 'crowd') {
  c.width = 1200; c.height = 900; ctx.imageSmoothingEnabled=false;
  for (let i=0;i<100;i++){ const age = [5,10,15,22,35,50,70][i%7]; const a=O.Char.makeAppearance(5000+i,{age}); ctx.drawImage(O.Char.frame(a,i%4===3?0:i%4,'idle',0),(i%12)*96,Math.floor(i/12)*100,64,96);}
}
</script>
