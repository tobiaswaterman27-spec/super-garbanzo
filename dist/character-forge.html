<title>Character Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root {
    --ink:        #151a22;
    --stage:      #0f131a;
    --panel:      #1d242e;
    --panel-2:    #232b37;
    --line:       #2f3846;
    --line-soft:  #262e3a;
    --bone:       #e7e2d4;
    --muted:      #8d97a6;
    --brass:      #c8963e;
    --brass-dim:  #8a6529;
    --verdigris:  #4f8f7d;
    --danger:     #b5565c;

    --pixel: "Silkscreen", "Courier New", monospace;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --gutter: 20px;
    --radius: 3px;
  }

  /* Light theme is the un-stamped default only when the OS asks for it. */
  :root {
    --ink:        #e3e1d8;
    --stage:      #141920;
    --panel:      #f1efe8;
    --panel-2:    #e7e4da;
    --line:       #c7c3b7;
    --line-soft:  #d5d1c6;
    --bone:       #24272d;
    --muted:      #5e656f;
    --brass:      #8c621d;
    --brass-dim:  #b08a3e;
    --verdigris:  #3b6f60;
    --danger:     #973f45;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink:        #151a22;
      --stage:      #0f131a;
      --panel:      #1d242e;
      --panel-2:    #232b37;
      --line:       #2f3846;
      --line-soft:  #262e3a;
      --bone:       #e7e2d4;
      --muted:      #8d97a6;
      --brass:      #c8963e;
      --brass-dim:  #8a6529;
      --verdigris:  #4f8f7d;
      --danger:     #b5565c;
    }
  }

  :root[data-theme="dark"] {
    --ink:        #151a22;
    --stage:      #0f131a;
    --panel:      #1d242e;
    --panel-2:    #232b37;
    --line:       #2f3846;
    --line-soft:  #262e3a;
    --bone:       #e7e2d4;
    --muted:      #8d97a6;
    --brass:      #c8963e;
    --brass-dim:  #8a6529;
    --verdigris:  #4f8f7d;
    --danger:     #b5565c;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    padding-inline: var(--gutter);
    padding-block: 18px 40px;
  }

  .shell { max-width: 1180px; margin: 0 auto; }

  /* ---------- header ---------- */

  header.masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }

  h1 {
    font-family: var(--pixel);
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--bone);
    text-wrap: balance;
  }

  .tagline {
    color: var(--muted);
    font-size: 12px;
    margin: 0;
    flex: 1 1 260px;
    min-width: 0;
  }

  .masthead .mode-switch { margin-left: auto; display: flex; gap: 6px; }

  /* ---------- layout ---------- */

  .workbench {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 360px);
    gap: 18px;
    align-items: start;
  }

  @media (max-width: 880px) {
    .workbench { grid-template-columns: minmax(0, 1fr); }
  }

  /* While playing, the whole editor gets out of the way. */
  body.playing .workbench { grid-template-columns: minmax(0, 1fr); }
  body.playing .rail { display: none; }
  body.playing .stage { position: static; }

  /* ---------- stage ---------- */

  .stage {
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 14px;
  }

  @media (max-width: 880px) { .stage { position: static; } }

  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    max-width: 100%;
    height: auto;
    background: #0b0e14;
    border-radius: 2px;
  }

  /* Shown at their own resolution where there is room, so one art pixel
     lands on one screen pixel. */
  #preview-canvas { width: 100%; max-width: 396px; }
  #world-canvas { width: 100%; max-width: 960px; }

  .stage-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    width: 100%;
  }

  .readout {
    font-family: var(--pixel);
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .readout b { color: var(--brass); font-weight: 400; }

  /* ---------- rail ---------- */

  .rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .tabs {
    display: flex;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .tabs button {
    flex: 1;
    border: 0;
    border-right: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-family: var(--pixel);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 4px;
    cursor: pointer;
  }
  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--brass); }
  .tabs button:hover { color: var(--bone); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel[hidden] { display: none !important; }

  .group { display: flex; flex-direction: column; gap: 9px; }

  .group > h2 {
    font-family: var(--pixel);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .group > h2 span { color: var(--muted); letter-spacing: 0.04em; }

  .field { display: flex; flex-direction: column; gap: 5px; }

  .field > label, .field-label {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .field-label var {
    font-style: normal;
    color: var(--bone);
    font-variant-numeric: tabular-nums;
  }

  input[type="text"], select {
    width: 100%;
    background: var(--panel-2);
    color: var(--bone);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 7px 8px;
    font-family: var(--mono);
    font-size: 13px;
  }
  input[type="text"] { font-family: var(--pixel); font-size: 12px; letter-spacing: 0.04em; }

  select { cursor: pointer; }

  input[type="range"] {
    width: 100%;
    accent-color: var(--brass);
    margin: 0;
    height: 20px;
  }

  :is(button, select, input, [tabindex]):focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 1px;
  }

  /* ---------- buttons ---------- */

  .btn {
    font-family: var(--pixel);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--panel-2);
    color: var(--bone);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 9px 11px;
    cursor: pointer;
    line-height: 1.3;
  }
  .btn:hover { border-color: var(--brass-dim); color: var(--brass); }
  .btn[aria-pressed="true"], .btn.is-active {
    background: var(--brass);
    border-color: var(--brass);
    color: #17130b;
  }
  .btn--primary {
    background: var(--brass);
    border-color: var(--brass);
    color: #17130b;
  }
  .btn--primary:hover { background: var(--brass-dim); border-color: var(--brass-dim); color: #fff; }
  .btn--ghost { background: transparent; }

  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-row > .btn { flex: 1 1 auto; }

  .segmented { display: flex; gap: 0; }
  .segmented .btn { flex: 1; border-radius: 0; border-right-width: 0; }
  .segmented .btn:first-child { border-radius: 2px 0 0 2px; }
  .segmented .btn:last-child { border-radius: 0 2px 2px 0; border-right-width: 1px; }

  /* ---------- swatches ---------- */

  .swatches { display: flex; flex-wrap: wrap; gap: 4px; }
  .swatch {
    width: 22px; height: 22px;
    border: 1px solid var(--line);
    border-radius: 2px;
    cursor: pointer;
    padding: 0;
    position: relative;
  }
  .swatch[aria-pressed="true"] {
    border-color: var(--brass);
    box-shadow: 0 0 0 1px var(--brass);
  }

  /* ---------- direction pad ---------- */

  .dirpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    max-width: 168px;
  }
  .dirpad .btn { padding: 8px 0; font-size: 8px; }
  .dirpad .spacer { visibility: hidden; }

  /* ---------- joints ---------- */

  .joint {
    border: 1px solid var(--line-soft);
    border-radius: 2px;
    padding: 8px 9px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--panel-2);
  }
  .joint > h3 {
    font-family: var(--pixel);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
    color: var(--bone);
  }
  .joint .axis { display: grid; grid-template-columns: 58px 1fr 38px; gap: 6px; align-items: center; }
  .joint .axis span { font-size: 10px; color: var(--muted); }
  .joint .axis var {
    font-style: normal; font-size: 10px; text-align: right;
    color: var(--brass); font-variant-numeric: tabular-nums;
  }

  .keyframes { display: flex; flex-wrap: wrap; gap: 4px; }
  .keyframe {
    font-family: var(--pixel); font-size: 9px;
    border: 1px solid var(--line); background: var(--panel-2);
    color: var(--muted); border-radius: 2px; padding: 6px 8px; cursor: pointer;
  }
  .keyframe:hover { color: var(--danger); border-color: var(--danger); }
  .keyframe b { color: var(--bone); font-weight: 400; }

  .hint {
    font-size: 11px;
    color: var(--muted);
    margin: 0;
    max-width: 62ch;
  }
  .hint kbd {
    font-family: var(--pixel); font-size: 9px;
    border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 2px; padding: 1px 4px; color: var(--bone);
    background: var(--panel-2);
  }

  .empty { color: var(--muted); font-size: 11px; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="shell">
  <header class="masthead">
    <h1>Character Forge</h1>
    <p class="tagline">Procedural pixel villagers &mdash; modelled in 3D, rendered to pixels, animated live.</p>
    <div class="mode-switch">
      <button class="btn is-active" id="mode-forge" type="button">Forge</button>
      <button class="btn" id="mode-world" type="button">World</button>
    </div>
  </header>

  <div class="workbench">
    <section class="stage" aria-label="Viewport">
      <canvas id="preview-canvas" width="396" height="456" aria-label="Character preview"></canvas>
      <canvas id="world-canvas" width="960" height="540" hidden aria-label="Test scene"></canvas>

      <div class="readout" id="readout"></div>

      <div class="stage-foot" id="forge-foot">
        <button class="btn" id="turn-left" type="button">&#8592; Turn</button>
        <button class="btn" id="turn-spin" type="button" aria-pressed="true">Turntable</button>
        <button class="btn" id="turn-right" type="button">Turn &#8594;</button>
      </div>

      <div class="stage-foot" id="world-foot" hidden></div>
    </section>

    <div class="rail">
      <div class="tabs" role="tablist" aria-label="Editor sections">
        <button role="tab" id="tab-identity" aria-selected="true" aria-controls="panel-identity" type="button">Identity</button>
        <button role="tab" id="tab-face" aria-selected="false" aria-controls="panel-face" type="button">Face &amp; hair</button>
        <button role="tab" id="tab-body" aria-selected="false" aria-controls="panel-body" type="button">Body</button>
        <button role="tab" id="tab-anim" aria-selected="false" aria-controls="panel-anim" type="button">Animation</button>
      </div>

      <section class="panel" id="panel-identity" role="tabpanel" aria-labelledby="tab-identity"></section>
      <section class="panel" id="panel-face" role="tabpanel" aria-labelledby="tab-face" hidden></section>
      <section class="panel" id="panel-body" role="tabpanel" aria-labelledby="tab-body" hidden></section>
      <section class="panel" id="panel-anim" role="tabpanel" aria-labelledby="tab-anim" hidden></section>

      <div class="btn-row">
        <button class="btn" id="randomise" type="button">Randomise</button>
        <button class="btn btn--primary" id="enter-world" type="button">Enter the world</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== geometry.js ===== */
/* geometry.js — mesh primitives.
 *
 * Everything used to be an axis-aligned box, which is why heads read as cubes
 * and hair read as slabs. These builders produce general convex meshes, so a
 * spike can taper to a point, a beard can hang and narrow, and a skull can be
 * a rounded solid.
 *
 * A mesh is { verts: [x,y,z, ...], faces: [{ i: [...], n: [x,y,z] }], aabb }.
 * Face normals are computed once at build time from the vertices and the
 * centroid, so every face points outward regardless of winding order.
 */
(function (global) {
  'use strict';

  function finish(verts, faces) {
    // centroid, used only to orient the normals outward
    let cx = 0, cy = 0, cz = 0;
    const n = verts.length / 3;
    let minX = Infinity, minY = Infinity, minZ = Infinity;
    let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
    for (let i = 0; i < n; i++) {
      const x = verts[i * 3], y = verts[i * 3 + 1], z = verts[i * 3 + 2];
      cx += x; cy += y; cz += z;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
    }
    cx /= n; cy /= n; cz /= n;

    const kept = [];
    for (let f = 0; f < faces.length; f++) {
      const idx = faces[f];
      const ax = verts[idx[0] * 3], ay = verts[idx[0] * 3 + 1], az = verts[idx[0] * 3 + 2];
      const bx = verts[idx[1] * 3], by = verts[idx[1] * 3 + 1], bz = verts[idx[1] * 3 + 2];

      // find a third vertex that is not collinear with the first two
      let nx = 0, ny = 0, nz = 0;
      for (let k = 2; k < idx.length; k++) {
        const cx2 = verts[idx[k] * 3], cy2 = verts[idx[k] * 3 + 1], cz2 = verts[idx[k] * 3 + 2];
        const u = [bx - ax, by - ay, bz - az];
        const v = [cx2 - ax, cy2 - ay, cz2 - az];
        nx = u[1] * v[2] - u[2] * v[1];
        ny = u[2] * v[0] - u[0] * v[2];
        nz = u[0] * v[1] - u[1] * v[0];
        if (Math.hypot(nx, ny, nz) > 1e-6) break;
      }
      const len = Math.hypot(nx, ny, nz);
      if (len < 1e-6) continue;   // degenerate face, drop it
      nx /= len; ny /= len; nz /= len;

      // flip to face away from the centroid
      if ((ax - cx) * nx + (ay - cy) * ny + (az - cz) * nz < 0) {
        nx = -nx; ny = -ny; nz = -nz;
      }
      kept.push({ i: idx, n: [nx, ny, nz] });
    }

    return {
      verts: verts,
      faces: kept,
      aabb: { x: minX, y: minY, z: minZ, w: maxX - minX, h: maxY - minY, d: maxZ - minZ }
    };
  }

  /* ---------- box ---------- */

  /* Boxes are grown a hair on every face. Two that merely abut share an exact
   * edge, and rounding on either side of it can leave a one-pixel seam through
   * the model — a pinhole in the clothing that moves as the character turns.
   * Overlapping slightly costs nothing and closes them. */
  const SEAM = 0.012;

  function box(x, y, z, w, h, d) {
    x -= SEAM; y -= SEAM; z -= SEAM;
    w += SEAM * 2; h += SEAM * 2; d += SEAM * 2;
    const x1 = x + w, y1 = y + h, z1 = z + d;
    const verts = [
      x, y, z, x, y, z1, x, y1, z, x, y1, z1,
      x1, y, z, x1, y, z1, x1, y1, z, x1, y1, z1
    ];
    const faces = [
      [0, 1, 3, 2], [4, 6, 7, 5], [0, 4, 5, 1],
      [2, 3, 7, 6], [0, 2, 6, 4], [1, 5, 7, 3]
    ];
    return finish(verts, faces);
  }

  /* ---------- frustum ----------
   *
   * A box whose top face can be shrunk and shifted. Tapering to a small top
   * gives a spike or a lock of hair; tapering to zero gives a cone.
   */
  function taper(x, y, z, w, h, d, topScale, offX, offZ) {
    x -= SEAM; y -= SEAM; z -= SEAM;
    w += SEAM * 2; h += SEAM * 2; d += SEAM * 2;
    const ts = Math.max(0.001, topScale === undefined ? 0.4 : topScale);
    const ox = offX || 0, oz = offZ || 0;
    const cx = x + w / 2, cz = z + d / 2;
    const tw = w * ts, td = d * ts;
    const tx = cx + ox - tw / 2, tz = cz + oz - td / 2;
    const verts = [
      x, y, z, x, y, z + d, x + w, y, z + d, x + w, y, z,
      tx, y + h, tz, tx, y + h, tz + td, tx + tw, y + h, tz + td, tx + tw, y + h, tz
    ];
    const faces = [
      [0, 3, 2, 1], [4, 5, 6, 7],
      [0, 1, 5, 4], [1, 2, 6, 5], [2, 3, 7, 6], [3, 0, 4, 7]
    ];
    return finish(verts, faces);
  }

  /* ---------- pyramid: four triangles to a point ---------- */

  function pyramid(x, y, z, w, h, d, offX, offZ) {
    const ox = offX || 0, oz = offZ || 0;
    const verts = [
      x, y, z, x, y, z + d, x + w, y, z + d, x + w, y, z,
      x + w / 2 + ox, y + h, z + d / 2 + oz
    ];
    const faces = [[0, 3, 2, 1], [0, 1, 4], [1, 2, 4], [2, 3, 4], [3, 0, 4]];
    return finish(verts, faces);
  }

  /* ---------- wedge: a triangular prism ---------- */

  function wedge(x, y, z, w, h, d) {
    // slopes from a full-depth base up to a ridge along the back edge
    const verts = [
      x, y, z, x, y, z + d, x + w, y, z + d, x + w, y, z,
      x, y + h, z, x + w, y + h, z
    ];
    const faces = [[0, 3, 2, 1], [0, 4, 5, 3], [1, 2, 5, 4], [0, 1, 4], [3, 5, 2]];
    return finish(verts, faces);
  }

  /* ---------- superellipsoid ----------
   *
   * One knob between a sphere and a cube. e near 1 is a ball (hair puffs,
   * berries); e near 0.3 is a rounded box, which is what a skull wants — a
   * hard cube head is the single biggest reason a character reads as wrong.
   */
  function superellipsoid(cx, cy, cz, rx, ry, rz, e, rings, segs, u0, u1) {
    rings = rings || 5;
    segs = segs || 8;
    const lo = u0 === undefined ? -Math.PI / 2 : u0;
    const hi = u1 === undefined ? Math.PI / 2 : u1;
    const EPS = 1e-4;
    const poleLo = lo <= -Math.PI / 2 + EPS;
    const poleHi = hi >= Math.PI / 2 - EPS;

    const p = function (v, exp) {
      const s = v < 0 ? -1 : 1;
      return s * Math.pow(Math.abs(v), exp);
    };

    const verts = [];
    const faces = [];
    const index = [];

    for (let i = 0; i <= rings; i++) {
      const u = lo + (i / rings) * (hi - lo);
      const cu = p(Math.cos(u), e), su = p(Math.sin(u), e);
      const atPole = (i === 0 && poleLo) || (i === rings && poleHi);
      const row = [];
      for (let j = 0; j < segs; j++) {
        if (atPole && j > 0) { row.push(row[0]); continue; }
        const v = -Math.PI + (j / segs) * Math.PI * 2;
        row.push(verts.length / 3);
        verts.push(
          cx + rx * cu * p(Math.cos(v), e),
          cy + ry * su,
          cz + rz * cu * p(Math.sin(v), e)
        );
      }
      index.push(row);
    }

    for (let i = 0; i < rings; i++) {
      for (let j = 0; j < segs; j++) {
        const j2 = (j + 1) % segs;
        const a = index[i][j], b = index[i][j2];
        const c = index[i + 1][j2], d = index[i + 1][j];
        const quad = [];
        if (a !== b) quad.push(a);
        if (b !== c) quad.push(b);
        if (c !== d) quad.push(c);
        if (d !== a) quad.push(d);
        if (quad.length >= 3) faces.push(quad);
      }
    }

    // A sliced-off end leaves the solid open, and an open shell shows its own
    // inside once it turns. Close each cut with a flat disc — the rim sits at
    // constant y, so a single planar face is enough.
    if (!poleLo) faces.push(index[0].slice().reverse());
    if (!poleHi) faces.push(index[rings].slice());

    return finish(verts, faces);
  }

  /* Latitude at which a superellipsoid of this shape passes through `y`.
   * Lets a hair dome be cut exactly at the hairline. */

    const boot = hexOf(P.LEATHER_COLOURS, ch.bootColour);

    out.push(part(B(-mw / 2 + 0.1, my - 0.75, front - 0.05, mw - 0.2, 0.7, 0.24),

    ['legR', 'legL'], ['legR', 'shinL'], ['shinR', 'legL'], ['shinR', 'shinL'],
    ['foreR', 'legR'], ['foreR', 'legL'], ['foreL', 'legL'], ['foreL', 'legR'],
    ['foreR', 'shinR'], ['foreL', 'shinL']
  ];

  const LIMB_BONES = {
    armR: ['shoulderR', 'elbowR', 'armR'], foreR: ['elbowR', 'handR', 'armR'],
    armL: ['shoulderL', 'elbowL', 'armR'], foreL: ['elbowL', 'handL', 'armR'],
    legR: ['hipR', 'kneeR', 'legR'], shinR: ['kneeR', 'footR', 'legR'],
    legL: ['hipL', 'kneeL', 'legR'], shinL: ['kneeL', 'footL', 'legR']
  };

  // Scratch frame, reused every iteration — this runs 8 times per substep.
  const _fr = {
    ox: 0, oy: 0, oz: 0, len: 1,
    ux: 0, uy: 1, uz: 0, lx: 1, ly: 0, lz: 0, fx: 0, fy: 0, fz: 1
  };

  /* Builds the torso's own axes: up along pelvis->neck, lateral across the
   * shoulders, forward as the cross product. Without a real frame the torso
   * can only be a round column, and a round column either lets arms through
   * at the front or holds them out at the sides. */
  function torsoFrame(p) {
    const a = p.pelvis, b = p.neck || p.chest;
    if (!a || !b) return null;
    let ux = b.x - a.x, uy = b.y - a.y, uz = b.z - a.z;
    const ul = Math.hypot(ux, uy, uz);
    if (ul < 1e-5) return null;
    ux /= ul; uy /= ul; uz /= ul;

    let lx, ly, lz;
    const sr = p.shoulderR, sl = p.shoulderL;
    if (sr && sl) { lx = sr.x - sl.x; ly = sr.y - sl.y; lz = sr.z - sl.z; }
    else { lx = 1; ly = 0; lz = 0; }
    const dot = lx * ux + ly * uy + lz * uz;
    lx -= ux * dot; ly -= uy * dot; lz -= uz * dot;
    let ll = Math.hypot(lx, ly, lz);
    if (ll < 1e-4) {
      // shoulders collapsed onto the spine: any perpendicular will do
      lx = Math.abs(ux) < 0.9 ? 1 : 0; ly = 0; lz = Math.abs(ux) < 0.9 ? 0 : 1;
      const d2 = lx * ux + ly * uy + lz * uz;
      lx -= ux * d2; ly -= uy * d2; lz -= uz * d2;
      ll = Math.hypot(lx, ly, lz) || 1;
    }
    lx /= ll; ly /= ll; lz /= ll;

    _fr.ox = a.x; _fr.oy = a.y; _fr.oz = a.z;
    _fr.len = ul;
    _fr.ux = ux; _fr.uy = uy; _fr.uz = uz;
    _fr.lx = lx; _fr.ly = ly; _fr.lz = lz;
    _fr.fx = uy * lz - uz * ly;
    _fr.fy = uz * lx - ux * lz;
    _fr.fz = ux * ly - uy * lx;
    return _fr;
  }

  // Push accumulator: a sample point can be pushed by torso and head in the
  // same pass, and both ends of a segment share what their samples ask for.
  const _push = { x: 0, y: 0, z: 0, hit: false };

  /* How far this point has to move to sit outside the torso column. */
  function torsoEscape(fr, body, x, y, z) {
    const dx = x - fr.ox, dy = y - fr.oy, dz = z - fr.oz;
    const s = dx * fr.ux + dy * fr.uy + dz * fr.uz;
    // The column starts above the hip block, not at the pelvis: the thighs
    // are *rooted* inside the pelvis, so testing them against it has the
    // solver fighting the skeleton's own geometry forever.
    if (s < fr.len * 0.3 || s > fr.len + 0.4) return false;
    const u = dx * fr.lx + dy * fr.ly + dz * fr.lz;
    const v = dx * fr.fx + dy * fr.fy + dz * fr.fz;
    const nu = u / body.torsoX, nv = v / body.torsoZ;
    const m = Math.hypot(nu, nv);
    if (m >= 1) return false;
    // scale out to the ellipse surface along the ray through the axis
    const k = m < 1e-4 ? 1 : 1 / m;
    const tu = u * k, tv = v * k;
    const eu = tu - u, ev = tv - v;
    _push.x = fr.lx * eu + fr.fx * ev;
    _push.y = fr.ly * eu + fr.fy * ev;
    _push.z = fr.lz * eu + fr.fz * ev;
    return true;
  }

  function headEscape(p, body, x, y, z) {
    const h = p.headTop, n = p.neck;
    if (!h || !n) return false;
    // the skull sits between the neck and the crown particle
    const cx = (h.x + n.x) * 0.5, cy = (h.y + n.y) * 0.5, cz = (h.z + n.z) * 0.5;
    const dx = x - cx, dy = y - cy, dz = z - cz;
    const d = Math.hypot(dx, dy, dz);
    if (d >= body.headR) return false;
    const k = d < 1e-4 ? 0 : (body.headR - d) / d;
    if (d < 1e-4) { _push.x = 0; _push.y = body.headR; _push.z = 0; return true; }
    _push.x = dx * k; _push.y = dy * k; _push.z = dz * k;
    return true;
  }

  const SAMPLES = [0.25, 0.55, 0.8, 1.0];

  /* Samples each limb segment along its length rather than only at the
   * joints. Testing endpoints alone is what let a forearm lie across the
   * chest with both the elbow and the hand clear of it. */
  function separateLimbs(f) {
    const p = f.p;
    const body = f.body || DEFAULT_BODY;
    const fr = torsoFrame(p);

    for (let i = 0; i < LIMB_SEGMENTS.length; i++) {
      const seg = LIMB_SEGMENTS[i];
      const a = p[seg.a], b = p[seg.b];
      if (!a || !b) continue;
      let ax = 0, ay = 0, az = 0, bx = 0, by = 0, bz = 0, any = false;

      for (let j = 0; j < SAMPLES.length; j++) {
        const t = SAMPLES[j];
        const x = a.x + (b.x - a.x) * t;
        const y = a.y + (b.y - a.y) * t;
        const z = a.z + (b.z - a.z) * t;
        let ex = 0, ey = 0, ez = 0, hit = false;
        if (fr && torsoEscape(fr, body, x, y, z)) {
          ex += _push.x; ey += _push.y; ez += _push.z; hit = true;
        }
        if (seg.vsHead && headEscape(p, body, x, y, z)) {
          ex += _push.x; ey += _push.y; ez += _push.z; hit = true;
        }
        if (!hit) continue;
        any = true;
        // Share the correction between the ends by how close the sample is to
        // each. A root end is welded to the torso, so it only takes a token
        // share — but not none: you cannot get a thigh out of your own chest
        // without your hips moving, and pushing only the knee leaves the
        // middle of the limb buried.
        const wa = seg.rootA ? (1 - t) * 0.3 : (1 - t);
        const wb = seg.rootA ? 1 : t;
        const sum = wa + wb || 1;
        ax += ex * wa / sum; ay += ey * wa / sum; az += ez * wa / sum;
        bx += ex * wb / sum; by += ey * wb / sum; bz += ez * wb / sum;
      }

      if (!any) continue;
      const n = SAMPLES.length;
      if (!seg.rootA) { a.x += ax / n; a.y += ay / n; a.z += az / n; }
      b.x += bx / n; b.y += by / n; b.z += bz / n;
    }

    separateLimbPairs(p, body);
  }

  // Closest points between two segments, then push them apart along that line.
  function separateLimbPairs(p, body) {
    for (let i = 0; i < LIMB_PAIRS.length; i++) {
      const A = LIMB_BONES[LIMB_PAIRS[i][0]], B = LIMB_BONES[LIMB_PAIRS[i][1]];
      const a0 = p[A[0]], a1 = p[A[1]], b0 = p[B[0]], b1 = p[B[1]];
      if (!a0 || !a1 || !b0 || !b1) continue;
      const want = body[A[2]] + body[B[2]];

      const ux = a1.x - a0.x, uy = a1.y - a0.y, uz = a1.z - a0.z;
      const vx = b1.x - b0.x, vy = b1.y - b0.y, vz = b1.z - b0.z;
      const wx = a0.x - b0.x, wy = a0.y - b0.y, wz = a0.z - b0.z;
      const uu = ux * ux + uy * uy + uz * uz;
      const uv = ux * vx + uy * vy + uz * vz;
      const vv = vx * vx + vy * vy + vz * vz;
      const uw = ux * wx + uy * wy + uz * wz;
      const vw = vx * wx + vy * wy + vz * wz;
      const den = uu * vv - uv * uv;
      let s, t;
      if (den < 1e-8) { s = 0; t = vv < 1e-8 ? 0 : vw / vv; }
      else { s = (uv * vw - vv * uw) / den; t = (uu * vw - uv * uw) / den; }
      s = s < 0 ? 0 : s > 1 ? 1 : s;
      t = t < 0 ? 0 : t > 1 ? 1 : t;

      const cax = a0.x + ux * s, cay = a0.y + uy * s, caz = a0.z + uz * s;
      const cbx = b0.x + vx * t, cby = b0.y + vy * t, cbz = b0.z + vz * t;
      let dx = cax - cbx, dy = cay - cby, dz = caz - cbz;
      let d = Math.hypot(dx, dy, dz);
      if (d >= want) continue;
      if (d < 1e-4) { dx = 1; dy = 0; dz = 0; d = 1; }
      // half each, softened — limbs are flesh, they can graze
      const k = (want - d) / d * 0.5 * 0.6;
      const px = dx * k, py = dy * k, pz = dz * k;
      a0.x += px * (1 - s); a0.y += py * (1 - s); a0.z += pz * (1 - s);
      a1.x += px * s; a1.y += py * s; a1.z += pz * s;
      b0.x -= px * (1 - t); b0.y -= py * (1 - t); b0.z -= pz * (1 - t);
      b1.x -= px * t; b1.y -= py * t; b1.z -= pz * t;
    }
  }

  function kineticEnergy(f) {
    let e = 0;
    for (const k in f.p) {
      const q = f.p[k];
      e += (q.x - q.px) * (q.x - q.px) + (q.y - q.py) * (q.y - q.py) + (q.z - q.pz) * (q.z - q.pz);
    }
    return e;
  }

  // Drags every particle toward where a given pose says the joint belongs.
  // Moving the previous position by the same amount makes this a pure
  // correction, so it repositions the body without wiping out its momentum —
  // which is what leaves the wobble in.
  function pullToward(f, target, strength, perJoint, damp) {
    for (const key in f.p) {
      const q = f.p[key];
      const t = target[key];
      if (!t) continue;
      // A weight of 1 in an explicit table means pinned: put the joint exactly
      // on the pose and stop it dead. Only ever from a table — treating a
      // missing table as "pin everything" turned the get-up and the settle
      // into instant snaps, which is what made characters teleport upright.
      const weight = perJoint
        ? (perJoint[key] === undefined ? 0.3 : perJoint[key])
        : 1;

      if (perJoint && weight >= 1) {
        q.x = t[0]; q.y = t[1]; q.z = t[2];
        q.px = t[0]; q.py = t[1]; q.pz = t[2];
        continue;
      }

      const k = Math.min(1, strength * weight);
      const dx = (t[0] - q.x) * k, dy = (t[1] - q.y) * k, dz = (t[2] - q.z) * k;
      q.x += dx; q.y += dy; q.z += dz;
      // Moving the previous position by the same amount makes this a pure
      // correction, leaving the body's momentum — and so its wobble — intact.
      q.px += dx; q.py += dy; q.pz += dz;
      if (damp) {
        q.px += (q.x - q.px) * damp;
        q.py += (q.y - q.py) * damp;
        q.pz += (q.z - q.pz) * damp;
      }
    }
  }

  // Blends the last of the way back onto the animated pose with gravity out of
  // the picture and the motion damped, so it always converges. Returns true
  // once every joint has arrived.
  function settleOntoPose(f, target, dt) {
    pullToward(f, target, Math.min(1, dt * 16), null, 0.45);
    separateLimbs(f);
    return worstError(f, target) < SETTLE_EPSILON;
  }

  function standingTarget(actor) {
    poseActor(actor, quantiseTime(actor.animTime));
    return jointPositions(actor.model, actor.yaw);
  }

  // Furthest any joint currently sits from where the animation wants it.
  function worstError(f, target) {
    let worst = 0;
    for (const key in f.p) {
      const q = f.p[key], t = target[key];
      if (!t) continue;
      const d = Math.hypot(t[0] - q.x, t[1] - q.y, t[2] - q.z);
      if (d > worst) worst = d;
    }
    return worst;
  }

  function updateFall(actor, dt) {
    const f = actor.fall;
    if (!f.active || !f.p) return;

    /* ---- jostled: the arms swing, nothing else moves ---- */
    if (f.mode !== 'full') {
      const target = standingTarget(actor);

      if (f.timer > 0) {
        let acc = Math.min(dt, 0.05);
        while (acc > 0) {
          const step = Math.min(SUBSTEP, acc);
          simulate(f, step, 0.25);
          acc -= step;
        }
        pullToward(f, target, Math.min(1, dt * 16), SOFT_PULL);
        separateLimbs(f);
        f.timer -= dt;
        return;
      }

      f.settle = (f.settle || 0) + dt;
      if (settleOntoPose(f, target, dt) || f.settle > 1.5) {
        f.active = false;
        f.state = 'up';
        f.settle = 0;
        f.p = null;
      }
      return;
    }

    /* ---- getting back up, under its own power ---- */
    if (f.state === 'rising') {
      if (!f.riseReady) {
        // Read which way the body is actually lying, so the get-up starts from
        // there. Pulling a prone body toward an upright pose is the teleport:
        // the very first target is already standing.
        const pel = f.p.pelvis, ch = f.p.chest;
        let ux = ch.x - pel.x, uy = ch.y - pel.y, uz = ch.z - pel.z;
        const L = Math.hypot(ux, uy, uz) || 1;
        ux /= L; uy /= L; uz /= L;
        const cy = Math.cos(actor.yaw), sy = Math.sin(actor.yaw);
        const side = ux * cy - uz * sy;
        const fwd = ux * sy + uz * cy;
        f.riseRoll = Math.asin(Math.max(-1, Math.min(1, -side)));
        f.risePitch = Math.atan2(fwd, uy);
        // Never tilt past flat. Someone who landed chest-down has their chest
        // below their pelvis, which reads as a tilt beyond ninety degrees, and
        // the get-up target then points the whole body into the ground.
        const lean = Math.hypot(f.risePitch, f.riseRoll);
        if (lean > Math.PI / 2) {
          const s = (Math.PI / 2) / lean;
          f.risePitch *= s;
          f.riseRoll *= s;
        }
        f.riseReady = true;
      }

      f.rise += dt / RISE_TIME;
      const k = Math.min(1, f.rise);
      const ease = k * k * (3 - 2 * k);

      let acc = Math.min(dt, 0.05);
      while (acc > 0) {
        const step = Math.min(SUBSTEP, acc);
        simulate(f, step, 0.55);
        acc -= step;
      }

      // walk the get-up keyframes, with the whole body righting itself from
      // however it landed toward vertical as the sequence plays
      const seg = k * (GETUP_KEYS.length - 1);
      const i = Math.min(GETUP_KEYS.length - 2, Math.floor(seg));
      const pose = lerpPose(GETUP_KEYS[i], GETUP_KEYS[i + 1], seg - i);
      applyPose(actor.model, pose, 0);
      const target = jointPositions(actor.model, actor.yaw,
        f.risePitch * (1 - ease), f.riseRoll * (1 - ease));

      // Lift the target itself off the floor before pulling toward it. The
      // keyframe's own forward lean adds to the body's tilt, which can aim a
      // joint well under the ground; correcting afterwards just moved the
      // snap somewhere else.
      for (const key in target) {
        const q = f.p[key];
        if (q && target[key][1] < q.r) target[key][1] = q.r;
      }
      pullToward(f, target, Math.min(1, dt * (2.5 + 9 * k)));
      // The pull aims at a keyframe, and a keyframe can put an arm where the
      // body is. Separate again afterwards or the last word each frame is the
      // pose, not the solid.
      separateLimbs(f);

      if (k >= 1) {
        // Blend the last of the way onto the pose rather than cutting over on
        // the clock, which is what made the model jump at the end.
        f.settle = (f.settle || 0) + dt;
        if (settleOntoPose(f, target, dt) || f.settle > 1.5) {
          f.active = false;
          f.state = 'up';
          f.settle = 0;
          f.p = null;
        }
      }
      return;
    }

    /* ---- going down ---- */
    let acc = Math.min(dt, 0.05);
    while (acc > 0) {
      const step = Math.min(SUBSTEP, acc);
      simulate(f, step, 1);
      acc -= step;
    }

    // hand the pelvis drift back to the actor so a tumbling body travels
    const pelvis = f.p.pelvis;
    const dx = pelvis.x, dz = pelvis.z;
    if (dx || dz) {
      for (const k in f.p) {
        const q = f.p[k];
        q.x -= dx; q.z -= dz;
        q.px -= dx; q.pz -= dz;
      }
      actor.x += dx;
      actor.y += dz;
    }

    if (f.state === 'falling') {
      if (kineticEnergy(f) < 0.05) {
        f.still += dt;
        if (f.still > 0.15) { f.state = 'down'; f.timer = 0.18 + actor.rng() * 0.28; }
      } else {
        f.still = 0;
      }
    } else if (f.state === 'down') {
      f.timer -= dt;
      if (f.timer <= 0) { f.state = 'rising'; f.rise = 0; f.riseReady = false; }
    }
  }

  // Down on the ground, as opposed to merely jostled.
  function isDown(actor) { return actor.fall.active && actor.fall.mode === 'full'; }

  /* ---------- drawing a ragdoll ---------- */

  // Builds a bone matrix that runs from `from` to `to`, with `refLateral`
  // pinning the roll so knees and elbows keep pointing somewhere sensible.
  function segmentMatrix(from, to, axisSign, refLateral) {
    let ax = (to[0] - from[0]) * axisSign;
    let ay = (to[1] - from[1]) * axisSign;
    let az = (to[2] - from[2]) * axisSign;
    const alen = Math.hypot(ax, ay, az) || 1e-6;
    ax /= alen; ay /= alen; az /= alen;

    let rx = refLateral[0], ry = refLateral[1], rz = refLateral[2];
    const dot = rx * ax + ry * ay + rz * az;
    rx -= ax * dot; ry -= ay * dot; rz -= az * dot;
    let rlen = Math.hypot(rx, ry, rz);
    if (rlen < 1e-4) {
      // reference ran parallel to the bone; pick any perpendicular
      rx = Math.abs(ay) < 0.9 ? 0 : 1; ry = Math.abs(ay) < 0.9 ? 1 : 0; rz = 0;
      const d2 = rx * ax + ry * ay + rz * az;
      rx -= ax * d2; ry -= ay * d2; rz -= az * d2;
      rlen = Math.hypot(rx, ry, rz) || 1e-6;
    }
    rx /= rlen; ry /= rlen; rz /= rlen;

    // Z = X cross Y, giving a right-handed basis so normals are not mirrored
    const fx = ry * az - rz * ay;
    const fy = rz * ax - rx * az;
    const fz = rx * ay - ry * ax;

    const m = R.identity();
    m[0] = rx; m[1] = ax; m[2] = fx; m[3] = from[0];
    m[4] = ry; m[5] = ay; m[6] = fy; m[7] = from[1];
    m[8] = rz; m[9] = az; m[10] = fz; m[11] = from[2];
    return m;
  }

  function drawRagdoll(target, model, camera, fall, faceParts) {
    const p = fall.p;
    const scale = model.root.scale || 1;
    const scaleM = R.scaling(scale);

    const sr = p.shoulderR, sl = p.shoulderL;
    let lateral = [sl.x - sr.x, sl.y - sr.y, sl.z - sr.z];
    const ll = Math.hypot(lateral[0], lateral[1], lateral[2]);
    if (ll < 1e-4) lateral = [1, 0, 0];
    else { lateral = [lateral[0] / ll, lateral[1] / ll, lateral[2] / ll]; }

    for (let i = 0; i < BONE_SEGMENTS.length; i++) {
      const seg = BONE_SEGMENTS[i];
      const bone = model.bones[seg.bone];
      if (!bone) continue;
      const a = p[seg.from], b = p[seg.to];
      if (!a || !b) continue;

      const m = R.multiply(scaleM,
        segmentMatrix([a.x, a.y, a.z], [b.x, b.y, b.z], seg.axis, lateral));

      for (let k = 0; k < bone.parts.length; k++) {
        const part = bone.parts[k];
        R.drawMesh(target, m, part.mesh, R.ramp(part.colour), camera, part);
      }
      if (faceParts && seg.bone === 'head') {
        for (let k = 0; k < faceParts.length; k++) {
          const part = faceParts[k];
          R.drawMesh(target, m, part.mesh, R.ramp(part.colour), camera, part);
        }
      }
    }
  }

  /* ---------- gestures ----------
   *
   * Deliberate, occasional actions layered over the still idle pose. They are
   * the one thing besides eyes and mouth allowed to move a standing character,
   * because they read as someone doing something rather than as drift.
   *
   * Each returns bone rotations to add to the idle pose; an envelope eases
   * them in and out so nothing snaps.
   */

  const TWO_PI = Math.PI * 2;

  const GESTURES = {
    wave: {
      duration: 2.1,
      label: 'Wave',
      pose: function (t) {
        return {
          armR: [-0.25, 0, -2.35],
          foreR: [0, 0, Math.sin(t * TWO_PI * 3) * 0.45 - 0.6],
          head: [0, 0.16, 0],
          torso: [0, 0.05, 0]
        };
      }
    },
    fear: {
      duration: 1.7,
      label: 'Alarm',
      pose: function (t) {
        const flinch = 1 - Math.min(1, t * 3);
        return {
          armR: [-1.45, 0, -0.42], foreR: [-1.35, 0, 0],
          armL: [-1.45, 0, 0.42], foreL: [-1.35, 0, 0],
          torso: [-0.26 - flinch * 0.1, 0, 0],
          head: [0.22, 0, 0]
        };
      }
    },
    laugh: {
      duration: 2.2,
      label: 'Laugh',
      pose: function (t) {
        const rock = Math.sin(t * TWO_PI * 3.2);
        return {
          torso: [0.2 + rock * 0.15, 0, 0],
          head: [-0.3 + rock * 0.1, 0, 0],
          armR: [-0.85, 0, 0.7], foreR: [-1.6, 0, 0],
          armL: [0.15, 0, -0.2]
        };
      }
    },
    ponder: {
      duration: 2.6,
      label: 'Ponder',
      pose: function (t) {
        return {
          armR: [-1.25, 0, 0.5], foreR: [-1.95, 0, 0.15],
          head: [0.08, 0.12, 0.14],
          torso: [0.04, 0.06, 0]
        };
      }
    },
    carry: {
      duration: 3.2,
      label: 'Carry',
      pose: function (t) {
        const sway = Math.sin(t * TWO_PI) * 0.05;
        return {
          armR: [-0.28, 0, 0.16], foreR: [-1.5 + sway, 0, 0.1],
          armL: [-0.28, 0, -0.16], foreL: [-1.5 - sway, 0, -0.1]

      duration: 1.6,

    if (!g) return;
    const t = Math.min(gesture.duration, quantiseTime(gesture.t));
    const phase = t / gesture.duration;
    // ease in and out so a gesture never starts or ends on a jump
    const env = Math.min(1, phase / 0.14) * Math.min(1, (1 - phase) / 0.18);
    const offs = g.pose(phase);

        va[0] + (vb[0] - va[0]) * t,
        va[1] + (vb[1] - va[1]) * t,

    const i = Math.min(frames.length - 1, Math.floor(wrapped / step));

  function shove(actor, dirX, dirY, speed) {

    // One reaction per contact. Bodies stay overlapped for many frames while
    // they are pushed apart, and re-reacting on each of those frames stacks
    // into a shove several times the size of the one that was intended.
    if (actor.hitCooldown > 0) actor.hitCooldown = Math.max(0, actor.hitCooldown - dt);

    actor.y += actor.shoveY * dt;

    if (Math.abs(diff) <= maxStep) actor.yaw = actor.targetYaw;
    else actor.yaw += Math.sign(diff) * maxStep;

      if (p >= 1) {

  function drawModel(target, model, camera, opts) {

    const faceParts = opts && opts.faceParts;

    // Yaw, then scale, then the bob — and the bob is rounded to a whole screen
    // pixel. A sub-pixel bob does nothing except flip an edge row on and off as
    // it crosses a boundary, which reads as the model quietly crawling.
    const pixel = scale * camera.scale;

    let base = R.multiply(R.rotationY(yaw), R.scaling(scale));
    base = R.multiply(base, R.translation(0, bob, 0));

      if (node.rot[1]) local = R.multiply(local, R.rotationY(node.rot[1]));

        R.drawMesh(target, m, p.mesh, R.ramp(p.colour), camera, p);

  const OUTLINE = R.pack(17, 19, 27);

      actor.viseme, actor.customPose ? 'p' + actor.animTime : '',

    if (key !== null && key === actor._key && !(opts && opts.force)) return target;
    actor._key = key === null ? '' : key;

    R.clearTarget(target);
    const face = CM.buildFaceParts(actor.model, {
      blink: actor.blink,
      viseme: actor.viseme,
      gaze: actor.gaze
    });

    } else {
      poseActor(actor, qTime);
      drawModel(target, actor.model, camera, { yaw: qYaw, faceParts: face });
    }

    return target;
  }

/* ===== dialogue.js ===== */
/* dialogue.js — the paged text box.
 *
 * Typewriter reveal, a name plate, and a bobbing arrow in the bottom-right that
 * only appears once the page has finished revealing. Click or press space to
 * advance; advancing past the last page closes the box.
 */
(function (global) {
  'use strict';

  const R = global.Render;
  const T = global.Text;
  const CM = global.CharacterModel;

  const CHARS_PER_SECOND = 34;

  const COLOURS = {
    panel: R.pack(243, 236, 217),
    panelShade: R.pack(214, 202, 175),
    border: R.pack(58, 46, 38),
    inner: R.pack(255, 251, 240),
    text: R.pack(48, 38, 32),
    plate: R.pack(200, 150, 62),
    plateText: R.pack(36, 28, 22),
    arrow: R.pack(122, 78, 40)
  };

  function create() {
    return {
      open: false,
      pages: [],
      pageIndex: 0,
      revealed: 0,
      speaker: '',
      time: 0,
      lastLetter: '',
      onLetter: null,
      onClose: null,
      justClosed: false
    };
  }

  function start(box, pages, speaker, opts) {
    box.open = true;
    box.pages = pages.slice();
    box.pageIndex = 0;
    box.revealed = 0;
    box.speaker = speaker || '';
    box.time = 0;
    box.lastLetter = '';
    box.onLetter = (opts && opts.onLetter) || null;
    box.onClose = (opts && opts.onClose) || null;
  }

  function currentPage(box) { return box.pages[box.pageIndex] || ''; }

  function pageComplete(box) { return box.revealed >= currentPage(box).length; }

  function update(box, dt) {
    if (!box.open) return;
    box.time += dt;
    const page = currentPage(box);
    if (box.revealed < page.length) {
      const before = Math.floor(box.revealed);
      box.revealed = Math.min(page.length, box.revealed + CHARS_PER_SECOND * dt);
      const after = Math.floor(box.revealed);
      for (let i = before; i < after; i++) {
        const ch = page[i];
        if (ch && ch !== ' ') {
          box.lastLetter = ch;
          if (box.onLetter) box.onLetter(ch);
        }
      }
      if (box.revealed >= page.length && box.onLetter) box.onLetter(null);
    }
  }

  // Returns true if the box consumed the input.
  function advance(box) {
    if (!box.open) return false;
    if (!pageComplete(box)) {
      box.revealed = currentPage(box).length; // first click completes the page
      if (box.onLetter) box.onLetter(null);
      return true;
    }
    if (box.pageIndex < box.pages.length - 1) {
      box.pageIndex++;
      box.revealed = 0;
      box.time = 0;
      return true;
    }
    close(box);
    return true;
  }

  function close(box) {
    box.open = false;
    box.pages = [];
    box.revealed = 0;
    box.justClosed = true;
    if (box.onLetter) box.onLetter(null);
    if (box.onClose) box.onClose();
  }

  /* ---------- drawing ---------- */

  function panel(target, x, y, w, h) {
    R.fillRect(target, x, y, w, h, COLOURS.panel);
    // notch the corners so the box reads as rounded at this scale
    for (let i = 0; i < 2; i++) {
      const n = 2 - i;
      R.fillRect(target, x + i, y + i, n, 1, 0);
      R.fillRect(target, x + w - i - n, y + i, n, 1, 0);
      R.fillRect(target, x + i, y + h - i - 1, n, 1, 0);
      R.fillRect(target, x + w - i - n, y + h - i - 1, n, 1, 0);
    }
    R.strokeRect(target, x, y, w, h, COLOURS.border);
    // clip the border's own corner pixels to match the notch
    R.fillRect(target, x, y, 1, 1, 0);
    R.fillRect(target, x + w - 1, y, 1, 1, 0);
    R.fillRect(target, x, y + h - 1, 1, 1, 0);
    R.fillRect(target, x + w - 1, y + h - 1, 1, 1, 0);
    // inner bevel
    R.fillRect(target, x + 2, y + 1, w - 4, 1, COLOURS.inner);
    R.fillRect(target, x + 1, y + 2, 1, h - 4, COLOURS.inner);
    R.fillRect(target, x + 2, y + h - 2, w - 4, 1, COLOURS.panelShade);
    R.fillRect(target, x + w - 2, y + 2, 1, h - 4, COLOURS.panelShade);
  }

  function draw(box, target) {
    if (!box.open) return;

    const S = T.SCALE;
    const margin = 10 * S;
    const h = 62 * S;
    const w = target.w - margin * 2;
    const x = margin;
    const y = target.h - h - 6 * S;

    panel(target, x, y, w, h);

    if (box.speaker) {
      const plateH = T.CELL_H + 4;
      const nameW = T.measure(box.speaker) + 12 * S;
      const plateX = x + 6 * S;
      const plateY = y - plateH + 1;
      R.fillRect(target, plateX, plateY, nameW, plateH, COLOURS.plate);
      R.strokeRect(target, plateX, plateY, nameW, plateH, COLOURS.border);
      R.fillRect(target, plateX, plateY, 1, 1, 0);
      R.fillRect(target, plateX + nameW - 1, plateY, 1, 1, 0);
      T.draw(target, box.speaker, plateX + 6 * S, plateY + 2 * S, COLOURS.plateText);
    }

    const page = currentPage(box);
    const shown = page.slice(0, Math.floor(box.revealed));
    const lines = T.wrap(page, w - 22 * S);

    // Wrap the full page once, then reveal per line, so text never re-flows
    // mid-reveal — re-flowing is the classic typewriter bug.
    let remaining = shown.length;
    let ty = y + 9 * S;
    for (let i = 0; i < lines.length && i < 3; i++) {
      const line = lines[i];
      const take = Math.max(0, Math.min(line.length, remaining));
      if (take > 0) T.draw(target, line.slice(0, take), x + 10 * S, ty, COLOURS.text);
      remaining -= line.length + 1; // +1 for the space the wrap consumed
      ty += T.LINE_H + 3 * S;
    }

    if (pageComplete(box)) {
      const bob = Math.round(Math.sin(box.time * 5.0) * 1.5) * S;
      drawArrow(target, x + w - 13 * S, y + h - 12 * S + bob, S);
    }

    // page pips, so you can see how much is left
    const pips = box.pages.length;
    if (pips > 1) {
      for (let i = 0; i < pips; i++) {
        const px = x + w - 10 * S - (pips - 1 - i) * 5 * S;
        const on = i <= box.pageIndex;
        R.fillRect(target, px, y + 5 * S, 3 * S, 3 * S, on ? COLOURS.arrow : COLOURS.panelShade);
      }
    }
  }

  // A downward chevron, drawn as explicit pixel rows.
  function drawArrow(target, x, y, s) {
    for (let i = 0; i < 4; i++) {
      R.fillRect(target, x + i * s, y + i * s, (7 - i * 2) * s, s, COLOURS.arrow);
    }
  }

  global.Dialogue = {
    create, start, update, advance, close, draw,
    currentPage, pageComplete, COLOURS
  };
})(window);
