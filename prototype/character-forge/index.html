<title>Character Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root {
    --ink:        #151a22;
    --stage:      #0f131a;
    --panel:      #1d242e;
    --panel-2:    #232b37;
    --line:       #2f3846;
    --line-soft:  #262e3a;
    --bone:       #e7e2d4;
    --muted:      #8d97a6;
    --brass:      #c8963e;
    --brass-dim:  #8a6529;
    --verdigris:  #4f8f7d;
    --danger:     #b5565c;

    --pixel: "Silkscreen", "Courier New", monospace;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --gutter: 20px;
    --radius: 3px;
  }

  /* Light theme is the un-stamped default only when the OS asks for it. */
  :root {
    --ink:        #e3e1d8;
    --stage:      #141920;
    --panel:      #f1efe8;
    --panel-2:    #e7e4da;
    --line:       #c7c3b7;
    --line-soft:  #d5d1c6;
    --bone:       #24272d;
    --muted:      #5e656f;
    --brass:      #8c621d;
    --brass-dim:  #b08a3e;
    --verdigris:  #3b6f60;
    --danger:     #973f45;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink:        #151a22;
      --stage:      #0f131a;
      --panel:      #1d242e;
      --panel-2:    #232b37;
      --line:       #2f3846;
      --line-soft:  #262e3a;
      --bone:       #e7e2d4;
      --muted:      #8d97a6;
      --brass:      #c8963e;
      --brass-dim:  #8a6529;
      --verdigris:  #4f8f7d;
      --danger:     #b5565c;
    }
  }

  :root[data-theme="dark"] {
    --ink:        #151a22;
    --stage:      #0f131a;
    --panel:      #1d242e;
    --panel-2:    #232b37;
    --line:       #2f3846;
    --line-soft:  #262e3a;
    --bone:       #e7e2d4;
    --muted:      #8d97a6;
    --brass:      #c8963e;
    --brass-dim:  #8a6529;
    --verdigris:  #4f8f7d;
    --danger:     #b5565c;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    padding-inline: var(--gutter);
    padding-block: 18px 40px;
  }

  .shell { max-width: 1180px; margin: 0 auto; }

  /* ---------- header ---------- */

  header.masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }

  h1 {
    font-family: var(--pixel);
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--bone);
    text-wrap: balance;
  }

  .tagline {
    color: var(--muted);
    font-size: 12px;
    margin: 0;
    flex: 1 1 260px;
    min-width: 0;
  }

  .masthead .mode-switch { margin-left: auto; display: flex; gap: 6px; }

  /* ---------- layout ---------- */

  .workbench {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 360px);
    gap: 18px;
    align-items: start;
  }

  @media (max-width: 880px) {
    .workbench { grid-template-columns: minmax(0, 1fr); }
  }

  /* While playing, the whole editor gets out of the way. */
  body.playing .workbench { grid-template-columns: minmax(0, 1fr); }
  body.playing .rail { display: none; }
  body.playing .stage { position: static; }

  /* ---------- stage ---------- */

  .stage {
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 14px;
  }

  @media (max-width: 880px) { .stage { position: static; } }

  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    max-width: 100%;
    height: auto;
    background: #0b0e14;
    border-radius: 2px;
  }

  #preview-canvas { width: 100%; max-width: 340px; }
  #world-canvas { width: 100%; max-width: 820px; }

  .stage-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    width: 100%;
  }

  .readout {
    font-family: var(--pixel);
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .readout b { color: var(--brass); font-weight: 400; }

  /* ---------- rail ---------- */

  .rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .tabs {
    display: flex;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .tabs button {
    flex: 1;
    border: 0;
    border-right: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-family: var(--pixel);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 4px;
    cursor: pointer;
  }
  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--brass); }
  .tabs button:hover { color: var(--bone); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel[hidden] { display: none !important; }

  .group { display: flex; flex-direction: column; gap: 9px; }

  .group > h2 {
    font-family: var(--pixel);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .group > h2 span { color: var(--muted); letter-spacing: 0.04em; }

  .field { display: flex; flex-direction: column; gap: 5px; }

  .field > label, .field-label {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .field-label var {
    font-style: normal;
    color: var(--bone);
    font-variant-numeric: tabular-nums;
  }

  input[type="text"], select {
    width: 100%;
    background: var(--panel-2);
    color: var(--bone);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 7px 8px;
    font-family: var(--mono);
    font-size: 13px;
  }
  input[type="text"] { font-family: var(--pixel); font-size: 12px; letter-spacing: 0.04em; }

  select { cursor: pointer; }

  input[type="range"] {
    width: 100%;
    accent-color: var(--brass);
    margin: 0;
    height: 20px;
  }

  :is(button, select, input, [tabindex]):focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 1px;
  }

  /* ---------- buttons ---------- */

  .btn {
    font-family: var(--pixel);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--panel-2);
    color: var(--bone);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 9px 11px;
    cursor: pointer;
    line-height: 1.3;
  }
  .btn:hover { border-color: var(--brass-dim); color: var(--brass); }
  .btn[aria-pressed="true"], .btn.is-active {
    background: var(--brass);
    border-color: var(--brass);
    color: #17130b;
  }
  .btn--primary {
    background: var(--brass);
    border-color: var(--brass);
    color: #17130b;
  }
  .btn--primary:hover { background: var(--brass-dim); border-color: var(--brass-dim); color: #fff; }
  .btn--ghost { background: transparent; }

  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-row > .btn { flex: 1 1 auto; }

  .segmented { display: flex; gap: 0; }
  .segmented .btn { flex: 1; border-radius: 0; border-right-width: 0; }
  .segmented .btn:first-child { border-radius: 2px 0 0 2px; }
  .segmented .btn:last-child { border-radius: 0 2px 2px 0; border-right-width: 1px; }

  /* ---------- swatches ---------- */

  .swatches { display: flex; flex-wrap: wrap; gap: 4px; }
  .swatch {
    width: 22px; height: 22px;
    border: 1px solid var(--line);
    border-radius: 2px;
    cursor: pointer;
    padding: 0;
    position: relative;
  }
  .swatch[aria-pressed="true"] {
    border-color: var(--brass);
    box-shadow: 0 0 0 1px var(--brass);
  }

  /* ---------- direction pad ---------- */

  .dirpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    max-width: 168px;
  }
  .dirpad .btn { padding: 8px 0; font-size: 8px; }
  .dirpad .spacer { visibility: hidden; }

  /* ---------- joints ---------- */

  .joint {
    border: 1px solid var(--line-soft);
    border-radius: 2px;
    padding: 8px 9px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--panel-2);
  }
  .joint > h3 {
    font-family: var(--pixel);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
    color: var(--bone);
  }
  .joint .axis { display: grid; grid-template-columns: 58px 1fr 38px; gap: 6px; align-items: center; }
  .joint .axis span { font-size: 10px; color: var(--muted); }
  .joint .axis var {
    font-style: normal; font-size: 10px; text-align: right;
    color: var(--brass); font-variant-numeric: tabular-nums;
  }

  .keyframes { display: flex; flex-wrap: wrap; gap: 4px; }
  .keyframe {
    font-family: var(--pixel); font-size: 9px;
    border: 1px solid var(--line); background: var(--panel-2);
    color: var(--muted); border-radius: 2px; padding: 6px 8px; cursor: pointer;
  }
  .keyframe:hover { color: var(--danger); border-color: var(--danger); }
  .keyframe b { color: var(--bone); font-weight: 400; }

  .hint {
    font-size: 11px;
    color: var(--muted);
    margin: 0;
    max-width: 62ch;
  }
  .hint kbd {
    font-family: var(--pixel); font-size: 9px;
    border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 2px; padding: 1px 4px; color: var(--bone);
    background: var(--panel-2);
  }

  .empty { color: var(--muted); font-size: 11px; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="shell">
  <header class="masthead">
    <h1>Character Forge</h1>
    <p class="tagline">Procedural pixel villagers &mdash; modelled in 3D, rendered to pixels, animated live.</p>
    <div class="mode-switch">
      <button class="btn is-active" id="mode-forge" type="button">Forge</button>
      <button class="btn" id="mode-world" type="button">World</button>
    </div>
  </header>

  <div class="workbench">
    <section class="stage" aria-label="Viewport">
      <canvas id="preview-canvas" width="396" height="456" aria-label="Character preview"></canvas>
      <canvas id="world-canvas" width="960" height="540" hidden aria-label="Test scene"></canvas>

      <div class="readout" id="readout"></div>

      <div class="stage-foot" id="forge-foot">
        <button class="btn" id="turn-left" type="button">&#8592; Turn</button>
        <button class="btn" id="turn-spin" type="button" aria-pressed="true">Turntable</button>
        <button class="btn" id="turn-right" type="button">Turn &#8594;</button>
      </div>

      <div class="stage-foot" id="world-foot" hidden>
        <p class="hint">
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to walk &middot;
          double-tap <kbd>W</kbd> to sprint &middot;
          <kbd>E</kbd> to talk when close &middot;
          <kbd>E</kbd> or click to turn the page &middot;
          sprint into someone to knock them over
        </p>
      </div>
    </section>

    <div class="rail">
      <div class="tabs" role="tablist" aria-label="Editor sections">
        <button role="tab" id="tab-identity" aria-selected="true" aria-controls="panel-identity" type="button">Identity</button>
        <button role="tab" id="tab-face" aria-selected="false" aria-controls="panel-face" type="button">Face &amp; hair</button>
        <button role="tab" id="tab-body" aria-selected="false" aria-controls="panel-body" type="button">Body</button>
        <button role="tab" id="tab-anim" aria-selected="false" aria-controls="panel-anim" type="button">Animation</button>
      </div>

      <section class="panel" id="panel-identity" role="tabpanel" aria-labelledby="tab-identity"></section>
      <section class="panel" id="panel-face" role="tabpanel" aria-labelledby="tab-face" hidden></section>
      <section class="panel" id="panel-body" role="tabpanel" aria-labelledby="tab-body" hidden></section>
      <section class="panel" id="panel-anim" role="tabpanel" aria-labelledby="tab-anim" hidden></section>

      <div class="btn-row">
        <button class="btn" id="randomise" type="button">Randomise</button>
        <button class="btn btn--primary" id="enter-world" type="button">Enter the world</button>
      </div>
    </div>
  </div>
</div>

<script src="geometry.js"></script>
<script src="render.js"></script>
<script src="parts.js"></script>
<script src="character.js"></script>
<script src="font.js"></script>
<script src="rig.js"></script>
<script src="dialogue.js"></script>
<script src="world.js"></script>
<script src="app.js"></script>
