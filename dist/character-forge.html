<title>Character Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root {
    --ink:        #151a22;
    --stage:      #0f131a;
    --panel:      #1d242e;
    --panel-2:    #232b37;
    --line:       #2f3846;
    --line-soft:  #262e3a;
    --bone:       #e7e2d4;
    --muted:      #8d97a6;
    --brass:      #c8963e;
    --brass-dim:  #8a6529;
    --verdigris:  #4f8f7d;
    --danger:     #b5565c;

    --pixel: "Silkscreen", "Courier New", monospace;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --gutter: 20px;
    --radius: 3px;
  }

  /* Light theme is the un-stamped default only when the OS asks for it. */
  :root {
    --ink:        #e3e1d8;
    --stage:      #141920;
    --panel:      #f1efe8;
    --panel-2:    #e7e4da;
    --line:       #c7c3b7;
    --line-soft:  #d5d1c6;
    --bone:       #24272d;
    --muted:      #5e656f;
    --brass:      #8c621d;
    --brass-dim:  #b08a3e;
    --verdigris:  #3b6f60;
    --danger:     #973f45;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink:        #151a22;
      --stage:      #0f131a;
      --panel:      #1d242e;
      --panel-2:    #232b37;
      --line:       #2f3846;
      --line-soft:  #262e3a;
      --bone:       #e7e2d4;
      --muted:      #8d97a6;
      --brass:      #c8963e;
      --brass-dim:  #8a6529;
      --verdigris:  #4f8f7d;
      --danger:     #b5565c;
    }
  }

  :root[data-theme="dark"] {
    --ink:        #151a22;
    --stage:      #0f131a;
    --panel:      #1d242e;
    --panel-2:    #232b37;
    --line:       #2f3846;
    --line-soft:  #262e3a;
    --bone:       #e7e2d4;
    --muted:      #8d97a6;
    --brass:      #c8963e;
    --brass-dim:  #8a6529;
    --verdigris:  #4f8f7d;
    --danger:     #b5565c;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    padding-inline: var(--gutter);
    padding-block: 18px 40px;
  }

  .shell { max-width: 1180px; margin: 0 auto; }

  /* ---------- header ---------- */

  header.masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }

  h1 {
    font-family: var(--pixel);
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--bone);
    text-wrap: balance;
  }

  .tagline {
    color: var(--muted);
    font-size: 12px;
    margin: 0;
    flex: 1 1 260px;
    min-width: 0;
  }

  .masthead .mode-switch { margin-left: auto; display: flex; gap: 6px; }

  /* ---------- layout ---------- */

  .workbench {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 360px);
    gap: 18px;
    align-items: start;
  }

  @media (max-width: 880px) {
    .workbench { grid-template-columns: minmax(0, 1fr); }
  }

  /* While playing, the whole editor gets out of the way. */
  body.playing .workbench { grid-template-columns: minmax(0, 1fr); }
  body.playing .rail { display: none; }
  body.playing .stage { position: static; }

  /* ---------- stage ---------- */

  .stage {
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 14px;
  }

  @media (max-width: 880px) { .stage { position: static; } }

  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    max-width: 100%;
    height: auto;
    background: #0b0e14;
    border-radius: 2px;
  }

  /* Shown at their own resolution where there is room, so one art pixel
     lands on one screen pixel. */
  #preview-canvas { width: 100%; max-width: 396px; }
  #world-canvas { width: 100%; max-width: 960px; display: block; }

  /* ---- touch controls ----
   * Overlaid on the viewport rather than below it, because a phone has no
   * room to spare and a thumb has to reach them without leaving the screen.
   * Everything is sized in vmin so it stays thumb-sized on any handset. */
  #world-wrap { position: relative; width: 100%; max-width: 960px; }

  #touch {
    position: absolute;
    inset: 0;
    pointer-events: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Sized against the viewport rather than the screen. The world is a
   * letterbox on a phone held upright, and a stick measured in vmin ended up
   * half as tall as the picture it was sitting on. */
  #stick {
    position: absolute;
    left: 3%;
    bottom: 7%;
    height: 46%;
    aspect-ratio: 1 / 1;
    min-height: 68px;
    max-height: 150px;
    border-radius: 50%;
    background: rgba(24, 21, 19, 0.42);
    border: 2px solid rgba(232, 214, 176, 0.35);
    pointer-events: auto;
    touch-action: none;
  }
  #stick-knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 42%;
    height: 42%;
    margin: -21% 0 0 -21%;
    border-radius: 50%;
    background: rgba(226, 208, 168, 0.72);
    border: 2px solid rgba(40, 33, 26, 0.6);
    pointer-events: none;
  }

  #pads {
    position: absolute;
    right: 3%;
    bottom: 6%;
    width: 36%;
    min-width: 124px;
    max-width: 230px;
    height: 68%;
    max-height: 216px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    /* bag, then the two it sits above, then the swing across the bottom
     * where the thumb already is */
    grid-template-rows: 0.8fr 1fr 1.3fr;
    gap: 5%;
    pointer-events: none;
  }
  .pad {
    pointer-events: auto;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    min-width: 0;
    padding: 0;
    border-radius: 12px;
    border: 2px solid rgba(232, 214, 176, 0.4);
    background: rgba(28, 24, 21, 0.58);
    color: #efe6d2;
    font: inherit;
    font-size: clamp(10px, 2.6vmin, 15px);
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .pad:active, .pad[aria-pressed="true"] {
    background: rgba(150, 112, 44, 0.85);
    border-color: rgba(246, 230, 190, 0.85);
  }
  .pad-wide { grid-column: 1 / -1; }
  .pad-act { background: rgba(46, 74, 46, 0.62); }
  .pad-hit { grid-column: 1 / -1; background: rgba(96, 36, 32, 0.66); }

  /* The attack pad doubles as an aim pad: press and drag to point the shot. */
  #pad-attack.aiming { background: rgba(160, 60, 48, 0.9); }

  /* With the bag open the screen belongs to the bag. Only the button that
   * closes it again stays put, so nothing sits over a slot you are reaching
   * for. */
  #touch.inv-open #stick,
  #touch.inv-open #pad-sprint,
  #touch.inv-open #pad-action,
  #touch.inv-open #pad-attack { display: none; }
  #touch.inv-open #pad-bag { background: rgba(96, 36, 32, 0.72); }

  @media (pointer: coarse) {
    #world-canvas { max-width: none; touch-action: none; }
    #world-wrap { max-width: none; }
    /* Every pixel of a phone screen belongs to the picture while playing. */
    body.playing { padding-inline: 0; padding-block: 8px 0; }
    body.playing .stage {
      padding: 0;
      border: 0;
      border-radius: 0;
      /* The picture sits in the middle of the handset rather than clinging to
       * the top with a screenful of nothing under it. */
      justify-content: center;
      min-height: calc(100svh - 74px);
    }
    body.playing .workbench { gap: 0; }
  }

  .stage-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    width: 100%;
  }

  .readout {
    font-family: var(--pixel);
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .readout b { color: var(--brass); font-weight: 400; }

  /* ---------- rail ---------- */

  .rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .tabs {
    display: flex;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .tabs button {
    flex: 1;
    border: 0;
    border-right: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-family: var(--pixel);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 4px;
    cursor: pointer;
  }
  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--brass); }
  .tabs button:hover { color: var(--bone); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel[hidden] { display: none !important; }

  .group { display: flex; flex-direction: column; gap: 9px; }

  .group > h2 {
    font-family: var(--pixel);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .group > h2 span { color: var(--muted); letter-spacing: 0.04em; }

  .field { display: flex; flex-direction: column; gap: 5px; }

  .field > label, .field-label {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .field-label var {
    font-style: normal;
    color: var(--bone);
    font-variant-numeric: tabular-nums;
  }

  input[type="text"], select {
    width: 100%;
    background: var(--panel-2);
    color: var(--bone);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 7px 8px;
    font-family: var(--mono);
    font-size: 13px;
  }
  input[type="text"] { font-family: var(--pixel); font-size: 12px; letter-spacing: 0.04em; }

  select { cursor: pointer; }

  input[type="range"] {
    width: 100%;
    accent-color: var(--brass);
    margin: 0;
    height: 20px;
  }

  :is(button, select, input, [tabindex]):focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 1px;
  }

  /* ---------- buttons ---------- */

  .btn {
    font-family: var(--pixel);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--panel-2);
    color: var(--bone);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 9px 11px;
    cursor: pointer;
    line-height: 1.3;
  }
  .btn:hover { border-color: var(--brass-dim); color: var(--brass); }
  .btn[aria-pressed="true"], .btn.is-active {
    background: var(--brass);
    border-color: var(--brass);
    color: #17130b;
  }
  .btn--primary {
    background: var(--brass);
    border-color: var(--brass);
    color: #17130b;
  }
  .btn--primary:hover { background: var(--brass-dim); border-color: var(--brass-dim); color: #fff; }
  .btn--ghost { background: transparent; }

  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-row > .btn { flex: 1 1 auto; }

  .segmented { display: flex; gap: 0; }
  .segmented .btn { flex: 1; border-radius: 0; border-right-width: 0; }
  .segmented .btn:first-child { border-radius: 2px 0 0 2px; }
  .segmented .btn:last-child { border-radius: 0 2px 2px 0; border-right-width: 1px; }

  /* ---------- swatches ---------- */

  .swatches { display: flex; flex-wrap: wrap; gap: 4px; }
  .swatch {
    width: 22px; height: 22px;
    border: 1px solid var(--line);
    border-radius: 2px;
    cursor: pointer;
    padding: 0;
    position: relative;
  }
  .swatch[aria-pressed="true"] {
    border-color: var(--brass);
    box-shadow: 0 0 0 1px var(--brass);
  }

  /* ---------- direction pad ---------- */

  .dirpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    max-width: 168px;
  }
  .dirpad .btn { padding: 8px 0; font-size: 8px; }
  .dirpad .spacer { visibility: hidden; }

  /* ---------- joints ---------- */

  .joint {
    border: 1px solid var(--line-soft);
    border-radius: 2px;
    padding: 8px 9px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--panel-2);
  }
  .joint > h3 {
    font-family: var(--pixel);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
    color: var(--bone);
  }
  .joint .axis { display: grid; grid-template-columns: 58px 1fr 38px; gap: 6px; align-items: center; }
  .joint .axis span { font-size: 10px; color: var(--muted); }
  .joint .axis var {
    font-style: normal; font-size: 10px; text-align: right;
    color: var(--brass); font-variant-numeric: tabular-nums;
  }

  .keyframes { display: flex; flex-wrap: wrap; gap: 4px; }
  .keyframe {
    font-family: var(--pixel); font-size: 9px;
    border: 1px solid var(--line); background: var(--panel-2);
    color: var(--muted); border-radius: 2px; padding: 6px 8px; cursor: pointer;
  }
  .keyframe:hover { color: var(--danger); border-color: var(--danger); }
  .keyframe b { color: var(--bone); font-weight: 400; }

  .hint {
    font-size: 11px;
    color: var(--muted);
    margin: 0;
    max-width: 62ch;
  }
  .hint kbd {
    font-family: var(--pixel); font-size: 9px;
    border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 2px; padding: 1px 4px; color: var(--bone);
    background: var(--panel-2);
  }

  .empty { color: var(--muted); font-size: 11px; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="shell">
  <header class="masthead">
    <h1>Character Forge</h1>
    <p class="tagline">Procedural pixel villagers &mdash; modelled in 3D, rendered to pixels, animated live.</p>
    <div class="mode-switch">
      <button class="btn is-active" id="mode-forge" type="button">Forge</button>
      <button class="btn" id="mode-world" type="button">World</button>
    </div>
  </header>

  <div class="workbench">
    <section class="stage" aria-label="Viewport">
      <canvas id="preview-canvas" width="396" height="456" aria-label="Character preview"></canvas>
      <div id="world-wrap" hidden>
        <canvas id="world-canvas" width="960" height="540" aria-label="Test scene"></canvas>
        <div id="touch" hidden aria-hidden="true">
          <div id="stick"><div id="stick-knob"></div></div>
          <div id="pads">
            <button class="pad pad-wide" id="pad-bag" type="button">BAG</button>
            <button class="pad" id="pad-sprint" type="button">RUN</button>
            <button class="pad pad-act" id="pad-action" type="button">E</button>
            <button class="pad pad-hit" id="pad-attack" type="button">HIT</button>
          </div>
        </div>
      </div>

      <div class="readout" id="readout"></div>

      <div class="stage-foot" id="forge-foot">
        <button class="btn" id="turn-left" type="button">&#8592; Turn</button>
        <button class="btn" id="turn-spin" type="button" aria-pressed="true">Turntable</button>
        <button class="btn" id="turn-right" type="button">Turn &#8594;</button>
      </div>

      <div class="stage-foot" id="world-foot" hidden></div>
    </section>

    <div class="rail">
      <div class="tabs" role="tablist" aria-label="Editor sections">
        <button role="tab" id="tab-identity" aria-selected="true" aria-controls="panel-identity" type="button">Identity</button>
        <button role="tab" id="tab-face" aria-selected="false" aria-controls="panel-face" type="button">Face &amp; hair</button>
        <button role="tab" id="tab-body" aria-selected="false" aria-controls="panel-body" type="button">Body</button>
        <button role="tab" id="tab-anim" aria-selected="false" aria-controls="panel-anim" type="button">Animation</button>
      </div>

      <section class="panel" id="panel-identity" role="tabpanel" aria-labelledby="tab-identity"></section>
      <section class="panel" id="panel-face" role="tabpanel" aria-labelledby="tab-face" hidden></section>
      <section class="panel" id="panel-body" role="tabpanel" aria-labelledby="tab-body" hidden></section>
      <section class="panel" id="panel-anim" role="tabpanel" aria-labelledby="tab-anim" hidden></section>

      <div class="btn-row">
        <button class="btn" id="randomise" type="button">Randomise</button>
        <button class="btn btn--primary" id="enter-world" type="button">Enter the world</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== geometry.js ===== */
/* geometry.js — mesh primitives.
 *
 * Everything used to be an axis-aligned box, which is why heads read as cubes
 * and hair read as slabs. These builders produce general convex meshes, so a
 * spike can taper to a point, a beard can hang and narrow, and a skull can be
 * a rounded solid.
 *
 * A mesh is { verts: [x,y,z, ...], faces: [{ i: [...], n: [x,y,z] }], aabb }.
 * Face normals are computed once at build time from the vertices and the
 * centroid, so every face points outward regardless of winding order.
 */
(function (global) {
  'use strict';

  function finish(verts, faces) {
    // centroid, used only to orient the normals outward
    let cx = 0, cy = 0, cz = 0;
    const n = verts.length / 3;
    let minX = Infinity, minY = Infinity, minZ = Infinity;
    let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
    for (let i = 0; i < n; i++) {
      const x = verts[i * 3], y = verts[i * 3 + 1], z = verts[i * 3 + 2];
      cx += x; cy += y; cz += z;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
    }
    cx /= n; cy /= n; cz /= n;

    const kept = [];
    for (let f = 0; f < faces.length; f++) {
      const idx = faces[f];
      const ax = verts[idx[0] * 3], ay = verts[idx[0] * 3 + 1], az = verts[idx[0] * 3 + 2];
      const bx = verts[idx[1] * 3], by = verts[idx[1] * 3 + 1], bz = verts[idx[1] * 3 + 2];

      // find a third vertex that is not collinear with the first two
      let nx = 0, ny = 0, nz = 0;
      for (let k = 2; k < idx.length; k++) {
        const cx2 = verts[idx[k] * 3], cy2 = verts[idx[k] * 3 + 1], cz2 = verts[idx[k] * 3 + 2];
        const u = [bx - ax, by - ay, bz - az];
        const v = [cx2 - ax, cy2 - ay, cz2 - az];
        nx = u[1] * v[2] - u[2] * v[1];
        ny = u[2] * v[0] - u[0] * v[2];
        nz = u[0] * v[1] - u[1] * v[0];
        if (Math.hypot(nx, ny, nz) > 1e-6) break;
      }
      const len = Math.hypot(nx, ny, nz);
      if (len < 1e-6) continue;   // degenerate face, drop it
      nx /= len; ny /= len; nz /= len;

      // flip to face away from the centroid
      if ((ax - cx) * nx + (ay - cy) * ny + (az - cz) * nz < 0) {
        nx = -nx; ny = -ny; nz = -nz;
      }
      kept.push({ i: idx, n: [nx, ny, nz] });
    }

    return {
      verts: verts,
      faces: kept,
      aabb: { x: minX, y: minY, z: minZ, w: maxX - minX, h: maxY - minY, d: maxZ - minZ }
    };
  }

  /* ---------- box ---------- */

  /* Boxes are grown a hair on every face. Two that merely abut share an exact
   * edge, and rounding on either side of it can leave a one-pixel seam through
   * the model — a pinhole in the clothing that moves as the character turns.
   * Overlapping slightly costs nothing and closes them. */
  const SEAM = 0.012;

  function box(x, y, z, w, h, d) {
    x -= SEAM; y -= SEAM; z -= SEAM;
    w += SEAM * 2; h += SEAM * 2; d += SEAM * 2;
    const x1 = x + w, y1 = y + h, z1 = z + d;
    const verts = [
      x, y, z, x, y, z1, x, y1, z, x, y1, z1,
      x1, y, z, x1, y, z1, x1, y1, z, x1, y1, z1
    ];
    const faces = [
      [0, 1, 3, 2], [4, 6, 7, 5], [0, 4, 5, 1],
      [2, 3, 7, 6], [0, 2, 6, 4], [1, 5, 7, 3]
    ];
    return finish(verts, faces);
  }

  /* ---------- frustum ----------
   *
   * A box whose top face can be shrunk and shifted. Tapering to a small top
   * gives a spike or a lock of hair; tapering to zero gives a cone.
   */
  function taper(x, y, z, w, h, d, topScale, offX, offZ) {
    x -= SEAM; y -= SEAM; z -= SEAM;
    w += SEAM * 2; h += SEAM * 2; d += SEAM * 2;
    const ts = Math.max(0.001, topScale === undefined ? 0.4 : topScale);
    const ox = offX || 0, oz = offZ || 0;

        setRot(model, 'arm' + side, 0.45 * wind - 1.75 * reach, 0, sgn * (0.30 - 0.22 * reach));
        setRot(model, 'fore' + side, -2.25 * wind + 2.05 * reach, 0, 0);
        // guard hand, up by the cheek
        setRot(model, 'arm' + off, -0.70 - 0.2 * reach, 0, -sgn * 0.30);
        setRot(model, 'fore' + off, -2.0, 0, 0);
        // the hips do the work: coiled away, then through and past
        setRot(model, 'torso', 0.10 * wind + 0.12 * reach, sgn * (0.62 * wind - 1.05 * reach), 0);
        setRot(model, 'head', -0.05, sgn * (-0.30 * wind + 0.42 * reach), 0);
        stance(model, reach, wind, side);
        model.bob = -0.25 * wind - 0.55 * reach;
      }
    },

    /* A horizontal cut. The blade goes back over the far shoulder, the body
     * winds up behind it, and then the whole lot unwinds together and carries
     * through to the other side. The travel here is enormous compared to what
     * was there before, and that is the entire point — a sword that moves
     * four inches is a sword being waved. */
    slash: {
      hit: 0.66,
      pose: function (model, k, side) {
        const sgn = side === 'R' ? 1 : -1;
        const off = side === 'R' ? 'L' : 'R';
        const wind = ease(k / 0.52);
        const cut = k < 0.52 ? 0 : snap((k - 0.52) / 0.30);
        const settle = k < 0.82 ? 0 : ease((k - 0.82) / 0.18);

        // arm: cocked high and across, then sweeping down and round
        setRot(model, 'arm' + side, -0.35 - 1.25 * wind + 1.95 * cut - 0.45 * settle, 0,
          sgn * (0.30 - 1.30 * wind + 2.25 * cut - 0.55 * settle));
        setRot(model, 'fore' + side, -0.40 - 1.35 * wind + 1.55 * cut - 0.2 * settle, 0, 0);
        // the free arm counterbalances, out the other way
        setRot(model, 'arm' + off, -0.25 - 0.35 * wind + 0.9 * cut, 0,
          -sgn * (0.30 + 0.55 * wind - 0.75 * cut));
        setRot(model, 'fore' + off, -0.85 - 0.3 * wind, 0, 0);
        // torso leads it and keeps going after the blade has passed
        setRot(model, 'torso', 0.06 + 0.16 * cut - 0.1 * settle,
          sgn * (0.72 * wind - 1.55 * cut + 0.3 * settle), sgn * 0.14 * cut);
        setRot(model, 'head', -0.04, sgn * (-0.35 * wind + 0.70 * cut), 0);
        stance(model, cut - settle * 0.4, wind, side);
        model.bob = 0.3 * wind - 0.95 * cut + 0.3 * settle;
      }
    },

    /* Straight up and straight down, with the whole body behind it. They rise
     * onto the toes at the top of the lift and drop through the blow. */
    overhead: {
      hit: 0.73,
      pose: function (model, k, side) {
        const sgn = side === 'R' ? 1 : -1;
        const off = side === 'R' ? 'L' : 'R';
        const wind = ease(k / 0.58);
        const fall = k < 0.58 ? 0 : snap((k - 0.58) / 0.26);
        const settle = k < 0.84 ? 0 : ease((k - 0.84) / 0.16);

        setRot(model, 'arm' + side, -2.75 * wind + 3.65 * fall - 0.5 * settle, 0, sgn * 0.26);
        setRot(model, 'fore' + side, -1.70 * wind + 1.65 * fall, 0, 0);
        setRot(model, 'arm' + off, -2.40 * wind + 3.25 * fall - 0.5 * settle, 0, -sgn * 0.24);
        setRot(model, 'fore' + off, -1.50 * wind + 1.45 * fall, 0, 0);
        // arched back at the top, folded forward at the bottom
        setRot(model, 'torso', -0.38 * wind + 0.95 * fall - 0.25 * settle, 0, 0);
        setRot(model, 'head', 0.30 * wind - 0.48 * fall, 0, 0);
        // up on the toes, then everything drops
        setRot(model, 'legR', -0.1 * wind + 0.22 * fall, 0, 0.08 * fall);
        setRot(model, 'legL', -0.1 * wind - 0.30 * fall, 0, -0.08 * fall);
        setRot(model, 'shinR', 0.12 * wind + 0.55 * fall, 0, 0);
        setRot(model, 'shinL', 0.12 * wind + 0.25 * fall, 0, 0);
        model.bob = 0.95 * wind - 1.9 * fall + 0.6 * settle;
      }
    },

    /* A knife. Drawn back to the hip with the body coiled right round, then
     * everything goes forward at once and the hand travels a long way. */
    stab: {
      hit: 0.56,
      pose: function (model, k, side) {
        const sgn = side === 'R' ? 1 : -1;
        const off = side === 'R' ? 'L' : 'R';
        const wind = ease(k / 0.42);
        const drive = k < 0.42 ? 0 : snap((k - 0.42) / 0.24);
        const back = k < 0.66 ? 0 : ease((k - 0.66) / 0.34);
        const reach = drive - back * 0.9;

        setRot(model, 'arm' + side, 0.80 * wind - 2.15 * reach, 0,
          sgn * (0.45 - 0.35 * reach));
        setRot(model, 'fore' + side, -2.30 * wind + 2.25 * reach, 0, 0);
        setRot(model, 'arm' + off, -0.55, 0, -sgn * 0.35);
        setRot(model, 'fore' + off, -1.55, 0, 0);
        setRot(model, 'torso', 0.08 * wind + 0.18 * reach,
          sgn * (0.70 * wind - 1.10 * reach), 0);
        setRot(model, 'head', -0.06, sgn * (-0.35 * wind + 0.45 * reach), 0);
        stance(model, reach * 1.15, wind, side);
        model.bob = -0.2 * wind - 0.7 * reach;
      }
    },

    /* Two hands on a shaft. The spear is pulled back along the side, and then
     * they lunge — this one is a step as much as a thrust. */
    thrust: {
      hit: 0.61,
      pose: function (model, k, side) {
        const sgn = side === 'R' ? 1 : -1;
        const wind = ease(k / 0.46);
        const drive = k < 0.46 ? 0 : snap((k - 0.46) / 0.26);
        const back = k < 0.72 ? 0 : ease((k - 0.72) / 0.28);
        const reach = drive - back * 0.88;

        setRot(model, 'armR', 0.30 * wind - 1.85 * reach, 0, 0.40 - 0.28 * reach);
        setRot(model, 'foreR', -2.15 * wind + 2.00 * reach, 0, 0);
        setRot(model, 'armL', 0.10 * wind - 1.70 * reach, 0, -0.40 + 0.26 * reach);
        setRot(model, 'foreL', -1.85 * wind + 1.75 * reach, 0, 0);
        setRot(model, 'torso', 0.10 * wind + 0.24 * reach,
          sgn * (0.48 * wind - 0.72 * reach), 0);
        setRot(model, 'head', -0.05, sgn * (-0.22 * wind + 0.32 * reach), 0);
        // a real lunge: the leading leg goes right out
        stance(model, reach * 1.6, wind, side);
        model.bob = -0.15 * wind - 1.15 * reach;
      }
    },

    /* A bow. The bow arm goes out straight at the target and stays there —
     * everything that moves is the string hand, which comes back past the
     * cheek and flies off it on the loose. The bow itself is turned upright
     * in the grip; see handMatrix. */
    draw: {
      hit: 0.82,
      pose: function (model, k, side) {
        const sgn = side === 'R' ? 1 : -1;
        const off = side === 'R' ? 'L' : 'R';
        const raise = ease(Math.min(1, k / 0.26));
        const pull = ease(Math.max(0, (k - 0.2) / 0.58));
        const loose = k < 0.78 ? 0 : snap((k - 0.78) / 0.22);

        // bow arm: straight out at the mark, locked
        setRot(model, 'arm' + off, -1.62 * raise, 0, -sgn * (0.06 + 0.10 * raise));
        setRot(model, 'fore' + off, -0.08 * raise, 0, 0);
        // string hand: from the bow, back past the cheek, then flung away
        setRot(model, 'arm' + side, -1.50 * raise + 0.10 * pull + 0.25 * loose, 0,
          sgn * (0.10 + 0.95 * pull + 0.45 * loose));
        setRot(model, 'fore' + side, -0.15 * raise - 2.10 * pull + 1.15 * loose, 0, 0);
        // squared up to the shot, opening a little as the string comes back
        setRot(model, 'torso', 0.02, sgn * (0.60 + 0.22 * pull - 0.34 * loose), 0);
        setRot(model, 'head', 0, sgn * (-0.55 - 0.08 * pull), 0);
        // feet apart and planted, side on
        setRot(model, 'legR', -0.16 * raise, 0, 0.12 * raise);
        setRot(model, 'legL', 0.16 * raise, 0, -0.12 * raise);
        model.bob = -0.15 * pull;
      }
    },

    /* A crossbow is already spanned, so all there is to do is bring it up,
     * hold it level and take the kick. */
    aim: {
      hit: 0.65,
      pose: function (model, k, side) {
        const sgn = side === 'R' ? 1 : -1;
        const off = side === 'R' ? 'L' : 'R';
        const up = ease(k / 0.62);
        const kick = k < 0.62 ? 0
          : snap((k - 0.62) / 0.1) * (1 - ease(Math.max(0, (k - 0.72) / 0.28)));

        setRot(model, 'arm' + side, -1.42 * up + 0.30 * kick, 0, sgn * (0.26 + 0.1 * kick));
        setRot(model, 'fore' + side, -0.60 * up - 0.35 * kick, 0, 0);
        setRot(model, 'arm' + off, -1.34 * up + 0.18 * kick, 0, -sgn * 0.44);
        setRot(model, 'fore' + off, -0.72 * up, 0, 0);
        setRot(model, 'torso', 0.03 + 0.08 * kick, sgn * (0.46 * up - 0.1 * kick), 0);
        setRot(model, 'head', 0, sgn * -0.38 * up, 0);
        setRot(model, 'legR', -0.12 * up, 0, 0.1 * up);
        setRot(model, 'legL', 0.12 * up, 0, -0.1 * up);
        model.bob = -0.1 * up - 0.3 * kick;
      }
    },

    /* A heavy round swing, for a club or a mace. Slower and lower than a
     * sword cut, and it takes the body further round with it. */
    swing: {
      hit: 0.66,
      pose: function (model, k, side) {
        const sgn = side === 'R' ? 1 : -1;
        const off = side === 'R' ? 'L' : 'R';
        const wind = ease(k / 0.5);
        const cut = k < 0.5 ? 0 : snap((k - 0.5) / 0.32);
        const settle = k < 0.82 ? 0 : ease((k - 0.82) / 0.18);

        setRot(model, 'arm' + side, -0.2 - 1.75 * wind + 2.55 * cut - 0.5 * settle, 0,
          sgn * (0.35 - 0.95 * wind + 1.75 * cut - 0.45 * settle));
        setRot(model, 'fore' + side, -0.5 - 1.15 * wind + 1.30 * cut, 0, 0);
        setRot(model, 'arm' + off, -0.25 - 0.3 * wind + 0.8 * cut, 0,
          -sgn * (0.28 + 0.45 * wind - 0.6 * cut));
        setRot(model, 'fore' + off, -0.95, 0, 0);
        setRot(model, 'torso', 0.08 + 0.2 * cut - 0.12 * settle,
          sgn * (0.66 * wind - 1.35 * cut + 0.25 * settle), sgn * 0.1 * cut);
        setRot(model, 'head', -0.04, sgn * (-0.3 * wind + 0.6 * cut), 0);
        stance(model, cut - settle * 0.4, wind, side);
        model.bob = 0.2 * wind - 1.05 * cut + 0.35 * settle;
      }
    }
  };

  /* Where the blow lands, as a fraction through the animation. */
  function attackHitFraction(anim) {
    const a = ATTACKS[anim] || ATTACKS.slash;
    return a.hit;
  }

  function poseAttack(model, anim, k, side, gait, t) {
    clearPose(model);
    // feet keep doing whatever the legs were doing; you can swing while walking
    if (gait === 'walk' || gait === 'run') {
      const swingScale = model.dims.legSwing;
      const rate = gait === 'run' ? 12.4 : 7.6;
      const pp = t * rate;
      const amount = (gait === 'run' ? 1.05 : 0.66) * swingScale;
      setRot(model, 'legR', -Math.sin(pp) * amount, 0, 0);
      setRot(model, 'legL', Math.sin(pp) * amount, 0, 0);
      setRot(model, 'shinR', Math.max(0, Math.sin(pp - 0.55)) * 0.92, 0, 0);
      setRot(model, 'shinL', Math.max(0, Math.sin(pp - 0.55 + Math.PI)) * 0.92, 0, 0);
    } else {
      // braced: front foot forward, weight through it
      setRot(model, 'leg' + side, -0.22, 0, 0);
      setRot(model, 'leg' + (side === 'R' ? 'L' : 'R'), 0.26, 0, 0);
      setRot(model, 'shin' + (side === 'R' ? 'L' : 'R'), 0.2, 0, 0);
    }
    const a = ATTACKS[anim] || ATTACKS.slash;
    a.pose(model, Math.max(0, Math.min(1, k)), side);
  }

  /* Both hands up over the head, the thing every frightened person does. */
  function poseGuard(model, k, side) {
    clearPose(model);
    const g = Math.max(0, Math.min(1, k));
    setRot(model, 'armR', -1.55 * g, 0, 0.55 * g);
    setRot(model, 'armL', -1.55 * g, 0, -0.55 * g);
    setRot(model, 'foreR', -1.5 * g, 0, 0);
    setRot(model, 'foreL', -1.5 * g, 0, 0);
    setRot(model, 'torso', 0.16 * g, 0, 0);
    setRot(model, 'head', 0.2 * g, 0, 0);
    void side;
  }

  /* Clutching a wound. `zone` says where the hand goes, which is what makes
   * it read as pain in a place rather than a generic hurt animation. */
  function poseClutch(model, k, zone, side) {
    clearPose(model);
    const g = Math.max(0, Math.min(1, k));
    const sgn = side === 'R' ? 1 : -1;
    if (zone === 'head') {
      setRot(model, 'arm' + side, -1.95 * g, 0, sgn * 0.35 * g);
      setRot(model, 'fore' + side, -1.75 * g, 0, 0);
      setRot(model, 'head', 0.3 * g, 0, 0);
    } else if (zone === 'leg') {
      setRot(model, 'arm' + side, -0.95 * g, 0, sgn * 0.5 * g);
      setRot(model, 'fore' + side, -0.6 * g, 0, 0);
      setRot(model, 'torso', 0.65 * g, 0, 0);
      setRot(model, 'leg' + side, -0.3 * g, 0, 0);
    } else {
      // chest, gut or arm: hand across the body onto the wound
      setRot(model, 'arm' + side, -1.05 * g, 0, sgn * 0.75 * g);
      setRot(model, 'fore' + side, -1.85 * g, 0, 0);
      setRot(model, 'torso', 0.34 * g, sgn * -0.2 * g, 0);
      setRot(model, 'head', 0.22 * g, 0, 0);
    }
    setRot(model, 'arm' + (side === 'R' ? 'L' : 'R'), -0.3 * g, 0, -sgn * 0.25 * g);
    setRot(model, 'fore' + (side === 'R' ? 'L' : 'R'), -0.8 * g, 0, 0);
    model.bob = -0.55 * g;
  }

  /* Taking a hit and staying on your feet: driven backwards, arms thrown up,
   * head turned away. A punch should not put anyone on the floor — it should
   * put them on their back foot. */
  function poseStagger(model, k, dirSide) {
    clearPose(model);
    const g = Math.max(0, Math.min(1, k));
    const lurch = Math.sin(g * Math.PI);
    const side = dirSide || 0;
    setRot(model, 'torso', -0.42 * lurch, side * 0.3 * lurch, side * 0.18 * lurch);
    setRot(model, 'head', -0.3 * lurch, side * 0.4 * lurch, 0);
    // arms fly up and out, which is what people actually do
    setRot(model, 'armR', -1.45 * lurch, 0, 0.85 * lurch);
    setRot(model, 'armL', -1.35 * lurch, 0, -0.95 * lurch);
    setRot(model, 'foreR', -1.1 * lurch, 0, 0);
    setRot(model, 'foreL', -1.25 * lurch, 0, 0);
    // back foot goes out to catch the weight
    setRot(model, 'legR', 0.55 * lurch, 0, 0.12 * lurch);
    setRot(model, 'legL', -0.35 * lurch, 0, -0.1 * lurch);
    setRot(model, 'shinR', 0.5 * lurch, 0, 0);
    setRot(model, 'shinL', 0.2 * lurch, 0, 0);
    model.bob = -1.1 * lurch;
  }

  /* ---------- going down without a ragdoll ----------
   *
   * The verlet ragdoll is for being run over by a horse. Most of the time a
   * body that goes down should go down the way it was hit — folding, landing
   * on its back, lying there, and getting up again — and none of that wants
   * to be simulated. A simulation cannot be asked to land somebody on their
   * back looking winded; it can only be asked to drop them and hope.
   *
   * So this is a posed fall. The whole model is tipped over at the root,
   * which is at the feet, so the body swings down about the ankles the way a
   * person actually goes over. Which way it tips is the direction of the blow
   * in the victim's own frame: punched in the face, they go backwards.
   *
   * `k` runs 0..1 through whichever phase is current.
   */

  const DOWN_ANGLE = 1.46;      // flat on the floor, near enough

  function poseCollapse(model, phase, k, dirSide, dirFront, zone, side) {
    clearPose(model);
    const g = Math.max(0, Math.min(1, k));

    /* How far over, and about which axis. A blow from in front tips them
     * backwards (positive X at the root lays the body away from the camera),
     * one from the side drops them sideways, and most blows are some of
     * both. */
    let lay;
    if (phase === 'fall') {
      // fast at first as the legs give, slowing as the shoulders meet the
      // ground: a body does not fall at a constant rate
      lay = 1 - Math.pow(1 - g, 2.2);
    } else if (phase === 'rise') {
      // and getting up is the other way about: slow to start, then quick
      lay = Math.pow(1 - g, 1.7);
    } else {
      lay = 1;
    }

    const len = Math.hypot(dirSide, dirFront) || 1;
    const fs = dirFront / len, ss = dirSide / len;
    const root = model.bones.root;
    if (root) {
      root.rot[0] = DOWN_ANGLE * lay * fs;
      root.rot[2] = DOWN_ANGLE * lay * ss;
      root.rot[1] = 0;
    }

    if (phase === 'fall') {
      /* The legs go first, which is what makes it a collapse rather than a
       * felled tree, and the arms come up and back as they try to catch
       * themselves. */
      const buckle = Math.sin(Math.min(1, g * 1.4) * Math.PI) * 0.9 + g * 0.3;
      /* Over the last of it the flail settles into the pose they will be
       * lying in, so the frame where the shoulders hit the ground is the
       * frame the lying pose starts from. Without this the two phases meet at
       * two different poses and the landing reads as a skipped frame. */
      const land = Math.max(0, (g - 0.62) / 0.38);
      const mix = function (name, a0, a1, a2, b0, b1, b2) {
        setRot(model, name,
          a0 + (b0 - a0) * land, a1 + (b1 - a1) * land, a2 + (b2 - a2) * land);
      };
      mix('legR', -0.35 * buckle, 0, 0.12 * buckle, -0.22, 0, 0.16);
      mix('legL', -0.5 * buckle, 0, -0.1 * buckle, -0.34, 0, -0.12);
      mix('shinR', 1.15 * buckle, 0, 0, 0.5, 0, 0);
      mix('shinL', 0.9 * buckle, 0, 0, 0.28, 0, 0);
      mix('torso', 0.38 * g, ss * 0.2, -ss * 0.2 * g, 0.12, 0, 0);
      mix('head', -0.45 * g, ss * 0.35, 0, -0.22, ss * 0.5, 0);
      const sgn0 = side === 'R' ? 1 : -1;
      const off0 = side === 'R' ? 'L' : 'R';
      const hold = zone === 'head' ? [-1.7, 0, sgn0 * 0.3, -1.85]
        : zone === 'leg' ? [-0.8, 0, sgn0 * 0.45, -1.0]
          : [-0.95, 0, sgn0 * 0.7, -1.75];
      mix('arm' + side, -1.5 * g, 0, sgn0 * 0.8 * g, hold[0], hold[1], hold[2]);
      mix('fore' + side, -0.7 * g, 0, 0, hold[3], 0, 0);
      mix('arm' + off0, -1.4 * g, 0, -sgn0 * 0.85 * g, -0.9, 0, -sgn0 * 1.15);
      mix('fore' + off0, -0.75 * g, 0, 0, -0.35, 0, 0);
      return;
    }

    if (phase === 'down') {
      /* Lying there. The only thing moving is the chest, and a hand resting
       * on whatever hurts. Stillness is what sells it — a body on the floor
       * that keeps shifting reads as a physics bug. */
      const breathe = Math.sin(g * Math.PI * 2 * 3) * 0.035;
      setRot(model, 'torso', 0.12 + breathe, 0, 0);
      setRot(model, 'head', -0.22, ss * 0.5, 0);
      setRot(model, 'legR', -0.22, 0, 0.16);
      setRot(model, 'legL', -0.34, 0, -0.12);
      setRot(model, 'shinR', 0.5, 0, 0);
      setRot(model, 'shinL', 0.28, 0, 0);
      // the free arm lies out; the other one is on the wound
      const off = side === 'R' ? 'L' : 'R';
      const sgn = side === 'R' ? 1 : -1;
      setRot(model, 'arm' + off, -0.9, 0, -sgn * 1.15);
      setRot(model, 'fore' + off, -0.35, 0, 0);
      if (zone === 'head') {
        setRot(model, 'arm' + side, -1.7, 0, sgn * 0.3);
        setRot(model, 'fore' + side, -1.85, 0, 0);
      } else if (zone === 'leg') {
        setRot(model, 'arm' + side, -0.8, 0, sgn * 0.45);
        setRot(model, 'fore' + side, -1.0, 0, 0);
      } else {
        setRot(model, 'arm' + side, -0.95, 0, sgn * 0.7);
        setRot(model, 'fore' + side, -1.75, 0, 0);
      }
      return;
    }

    /* Getting up. They roll onto one elbow, get a knee under themselves and
     * push, so the arms are doing work rather than hanging there while the
     * body floats upright. */
    const push = Math.sin(Math.min(1, (1 - g) * 1.6) * Math.PI);
    const sgn = side === 'R' ? 1 : -1;
    setRot(model, 'arm' + side, -0.55 - 0.7 * push, 0, sgn * (0.35 + 0.5 * push));
    setRot(model, 'fore' + side, -1.35 * push - 0.2, 0, 0);
    setRot(model, 'arm' + (side === 'R' ? 'L' : 'R'), -0.4 - 0.4 * push, 0, -sgn * 0.3);
    setRot(model, 'fore' + (side === 'R' ? 'L' : 'R'), -0.9 * push, 0, 0);
    setRot(model, 'legR', -0.3 - 0.75 * push, 0, 0.1);
    setRot(model, 'shinR', 1.5 * push, 0, 0);
    setRot(model, 'legL', -0.15 - 0.3 * push, 0, -0.08);
    setRot(model, 'shinL', 0.8 * push, 0, 0);
    setRot(model, 'torso', 0.45 * push + 0.1 * lay, 0, 0);
    setRot(model, 'head', -0.2 - 0.25 * push, 0, 0);
  }

  /* Puts somebody on the floor without the solver. `dirLocal` is the blow in
   * the victim's own frame — [sideways, frontways], the same pair the wounds
   * are placed with, so a punch in the face and the cut it leaves agree about
   * which way the blow came from. */
  function collapse(actor, dirLocal, opts) {
    if (actor.collapse) return false;
    const o = opts || {};
    const rng = actor.rng || Math.random;
    // A blow from the front (dirLocal[1] positive) puts them on their back.
    actor.collapse = {
      phase: 'fall',
      t: 0,
      fallFor: 0.42 + rng() * 0.12,
      downFor: o.downFor === undefined ? 4.5 + rng() * 5 : o.downFor,
      riseFor: 1.35 + rng() * 0.3,
      side: dirLocal ? dirLocal[0] : 0,
      front: dirLocal ? dirLocal[1] : 1,
      zone: o.zone || 'chest',
      hand: actor.leftHanded ? 'L' : 'R'
    };
    // whatever they were doing, they are not doing it
    actor.attack = null;
    actor.reaction = null;
    actor.gesture = null;
    actor.gait = 'idle';
    actor.vx = 0; actor.vy = 0;
    return true;
  }

  /* Runs the clock. Returns 'up' on the frame they finish getting up. */
  function updateCollapse(actor, dt) {
    const c = actor.collapse;
    if (!c) return null;
    c.t += dt;
    if (c.phase === 'fall') {
      if (c.t >= c.fallFor) { c.phase = 'down'; c.t = 0; }
      return null;
    }
    if (c.phase === 'down') {
      if (c.t >= c.downFor) { c.phase = 'rise'; c.t = 0; }
      return null;
    }
    if (c.t >= c.riseFor) {
      actor.collapse = null;
      // a beat of grace so the first thing that happens to them on standing
      // is not being knocked straight back down
      actor.hitCooldown = Math.max(actor.hitCooldown || 0, 0.8);
      return 'up';
    }
    return null;
  }

  /* On the floor by any means: crumpled by a punch, or thrown by a horse. */
  function isFloored(actor) {
    return !!actor.collapse || (actor.fall && actor.fall.active && actor.fall.mode === 'full');
  }

  /* Reaching across to draw from the belt, or putting something away. */
  function poseSheathe(model, k, side, putting) {
    clearPose(model);
    const g = Math.max(0, Math.min(1, k));
    const reach = Math.sin(g * Math.PI);
    const sgn = side === 'R' ? 1 : -1;
    setRot(model, 'arm' + side, -0.15 - 0.55 * reach, 0, sgn * (0.2 + 0.7 * reach));
    setRot(model, 'fore' + side, -0.4 - 1.5 * reach, 0, 0);
    setRot(model, 'torso', 0.12 * reach, sgn * -0.28 * reach, 0);
    setRot(model, 'head', 0.16 * reach, sgn * -0.3 * reach, 0);
    void putting;
  }

  /* Nocking an arrow, or laying a bolt in the groove. */
  function poseNock(model, k, side) {
    clearPose(model);
    const g = Math.max(0, Math.min(1, k));
    const sgn = side === 'R' ? 1 : -1;
    // reach to the quiver at the hip, bring it up to the string
    const grab = Math.min(1, g / 0.45);
    const lift = Math.max(0, (g - 0.45) / 0.55);
    setRot(model, 'arm' + (side === 'R' ? 'L' : 'R'), -1.3 * lift - 0.2, 0, -sgn * 0.14);
    setRot(model, 'fore' + (side === 'R' ? 'L' : 'R'), -0.2, 0, 0);
    setRot(model, 'arm' + side, 0.5 * grab - 1.6 * lift, 0, sgn * (0.55 - 0.15 * lift));
    setRot(model, 'fore' + side, -0.5 - 1.4 * grab + 0.9 * lift, 0, 0);
    setRot(model, 'torso', 0.16 * grab - 0.08 * lift, sgn * 0.3 * lift, 0);
    setRot(model, 'head', 0.1 * grab, sgn * -0.2 * lift, 0);
  }

  /* A shield up, and a weapon held ready rather than hanging. */
  function poseReady(model, side, shield) {
    const sgn = side === 'R' ? 1 : -1;
    setRot(model, 'arm' + side, -0.55, 0, sgn * 0.42);
    setRot(model, 'fore' + side, -1.15, 0, 0);
    if (shield) {
      setRot(model, 'arm' + (side === 'R' ? 'L' : 'R'), -1.0, 0, -sgn * 0.15);
      setRot(model, 'fore' + (side === 'R' ? 'L' : 'R'), -1.35, 0, 0);
    }
    setRot(model, 'torso', 0.05, sgn * 0.22, 0);
  }

  /* In the saddle. The thighs come forward and open around the barrel, the
   * knees fold back under, and the hands stay out in front on the reins. The
   * rider rises with the gait rather than sitting rigid, because a figure
   * bolted to a moving horse is the thing that makes riding look wrong. */
  function poseRide(model, t, opts) {
    clearPose(model);
    const o = opts || {};
    const gait = o.gait || 'idle';
    const rate = gait === 'gallop' ? 9.2 : gait === 'trot' ? 7.2 : gait === 'walk' ? 4.4 : 0;
    const amp = gait === 'gallop' ? 0.85 : gait === 'trot' ? 0.55 : gait === 'walk' ? 0.2 : 0;
    const p = t * rate;
    const rise = rate ? Math.abs(Math.sin(p)) : 0;
    const lean = (o.lean || 0) + (gait === 'gallop' ? 0.42 : gait === 'trot' ? 0.2 : 0.06);
    const rein = o.rein || 0;

    model.bob = rise * amp - amp * 0.4;

    // legs astride
    setRot(model, 'legR', -0.92, 0, -0.36);
    setRot(model, 'legL', -0.92, 0, 0.36);
    setRot(model, 'shinR', 1.28 + rise * 0.08, 0, 0.1);
    setRot(model, 'shinL', 1.28 + rise * 0.08, 0, -0.1);

    // hands forward on the reins, pulled back when the rider hauls on them
    const reach = -1.02 + rein * 0.55;
    setRot(model, 'armR', reach, 0, 0.16);
    setRot(model, 'armL', reach, 0, -0.16);
    setRot(model, 'foreR', -0.62 - rein * 0.5, 0, 0);
    setRot(model, 'foreL', -0.62 - rein * 0.5, 0, 0);

    setRot(model, 'torso', lean - rise * 0.06, (o.turn || 0) * 0.12, 0);
    setRot(model, 'head', -lean * 0.75, -(o.turn || 0) * 0.2, 0);
  }

  /* Swinging up into the saddle: k runs 0 to 1. The rider reaches for the
   * pommel, kicks the outside leg over, and lands astride. */
  function poseMount(model, k) {
    clearPose(model);
    const e = k < 0.5 ? (k / 0.5) : 1;
    const land = k < 0.5 ? 0 : (k - 0.5) / 0.5;
    model.bob = Math.sin(Math.min(1, k) * Math.PI) * 2.6;
    setRot(model, 'armR', -1.9 + land * 0.9, 0, 0.3);
    setRot(model, 'armL', -1.6 + land * 0.6, 0, -0.3);
    setRot(model, 'foreR', -0.5, 0, 0);
    setRot(model, 'foreL', -0.7, 0, 0);
    // the outside leg swings up and over, the inside one takes the weight
    setRot(model, 'legR', -0.4 - e * 0.6, 0, -e * 1.1 + land * 0.75);
    setRot(model, 'legL', -0.2 - e * 0.55, 0, e * 0.25 + land * 0.1);
    setRot(model, 'shinR', 0.5 + land * 0.8, 0, 0);
    setRot(model, 'shinL', 0.9 + land * 0.4, 0, 0);
    setRot(model, 'torso', 0.34 - land * 0.1, 0, -0.18 + land * 0.18);
  }

  /* Sitting on a cart's bench, reins in hand. Knees together and forward,
   * back straighter than in the saddle. */
  function poseDrive(model, t, opts) {
    clearPose(model);
    const o = opts || {};
    const jolt = o.jolt || 0;
    const rein = o.rein || 0;
    model.bob = jolt;
    setRot(model, 'legR', -1.32, 0, -0.12);
    setRot(model, 'legL', -1.32, 0, 0.12);
    setRot(model, 'shinR', 1.42, 0, 0);
    setRot(model, 'shinL', 1.42, 0, 0);
    const reach = -0.88 + rein * 0.6;
    setRot(model, 'armR', reach, 0, 0.2);
    setRot(model, 'armL', reach, 0, -0.2);
    setRot(model, 'foreR', -0.7 - rein * 0.45, 0, 0);
    setRot(model, 'foreL', -0.7 - rein * 0.45, 0, 0);
    setRot(model, 'torso', 0.1 + jolt * 0.05, (o.turn || 0) * 0.1, 0);
    setRot(model, 'head', -0.06, -(o.turn || 0) * 0.18, 0);
  }

  function poseTalk(model) {
    poseIdle(model);
  }

  /* ---------- ragdoll ----------
   *
   * A real articulated ragdoll: sixteen verlet particles joined by distance
   * constraints, falling under gravity onto a ground plane. Limbs swing and
   * settle independently, which a single rigid body tipping about the feet
   * could never do.
   *
   * The simulation runs in actor-local model units with y = 0 as the ground.
   * It is re-centred on the pelvis each frame and the drift handed back to the
   * actor's world position, so a body that tumbles actually travels.
   */

  const JOINT_NAMES = [
    'pelvis', 'chest', 'neck', 'headTop',
    'shoulderR', 'elbowR', 'handR', 'shoulderL', 'elbowL', 'handL',
    'hipR', 'kneeR', 'footR', 'hipL', 'kneeL', 'footL'
  ];

  // [a, b, stiffness] — the bracing links keep the torso from folding flat.
  const RAGDOLL_LINKS = [
    ['pelvis', 'chest', 1], ['chest', 'neck', 1], ['neck', 'headTop', 1],
    ['chest', 'shoulderR', 1], ['shoulderR', 'elbowR', 1], ['elbowR', 'handR', 1],
    ['chest', 'shoulderL', 1], ['shoulderL', 'elbowL', 1], ['elbowL', 'handL', 1],
    ['pelvis', 'hipR', 1], ['hipR', 'kneeR', 1], ['kneeR', 'footR', 1],
    ['pelvis', 'hipL', 1], ['hipL', 'kneeL', 1], ['kneeL', 'footL', 1],
    ['shoulderR', 'shoulderL', 0.9], ['hipR', 'hipL', 0.9],
    ['shoulderR', 'pelvis', 0.55], ['shoulderL', 'pelvis', 0.55],
    ['chest', 'hipR', 0.55], ['chest', 'hipL', 0.55],
    ['neck', 'shoulderR', 0.7], ['neck', 'shoulderL', 0.7],
    // loose limits so elbows and knees cannot hyperextend into the torso
    ['shoulderR', 'handR', 0.12], ['shoulderL', 'handL', 0.12],
    ['hipR', 'footR', 0.12], ['hipL', 'footL', 0.12]
  ];

  const PARTICLE_RADIUS = { headTop: 2.4, chest: 1.9, pelvis: 1.8 };
  const GRAVITY = 130;         // model units per second squared
  const SUBSTEP = 1 / 120;
  const ITERATIONS = 8;

  // Which segment drives each bone, and whether the bone's local +Y or -Y runs
  // along it. Arms and legs hang along -Y; the torso and head rise along +Y.
  const BONE_SEGMENTS = [
    { bone: 'pelvis', from: 'pelvis', to: 'chest', axis: 1 },
    { bone: 'torso', from: 'pelvis', to: 'chest', axis: 1 },
    { bone: 'head', from: 'neck', to: 'headTop', axis: 1 },
    { bone: 'armR', from: 'shoulderR', to: 'elbowR', axis: -1 },
    { bone: 'foreR', from: 'elbowR', to: 'handR', axis: -1 },
    { bone: 'armL', from: 'shoulderL', to: 'elbowL', axis: -1 },
    { bone: 'foreL', from: 'elbowL', to: 'handL', axis: -1 },
    { bone: 'legR', from: 'hipR', to: 'kneeR', axis: -1 },
    { bone: 'shinR', from: 'kneeR', to: 'footR', axis: -1 },
    { bone: 'legL', from: 'hipL', to: 'kneeL', axis: -1 },
    { bone: 'shinL', from: 'kneeL', to: 'footL', axis: -1 }
  ];

  // Walks the posed bone tree and reports where each joint actually is, in
  // model units with the feet at the origin. Used both to seed the ragdoll and
  // to give it something to stand back up into.
  const _jp = [0, 0, 0];
  function jointPositions(model, yaw, tiltPitch, tiltRoll) {
    const d = model.dims;
    let base = R.rotationY(yaw);
    // Tilt about the feet. Getting up needs targets for a body that is still
    // lying down, not for one that is already standing.
    if (tiltPitch) base = R.multiply(base, R.rotationX(tiltPitch));
    if (tiltRoll) base = R.multiply(base, R.rotationZ(tiltRoll));

    (function walk(node, parent) {
      let local = R.translation(node.origin[0], node.origin[1], node.origin[2]);
      if (node.rot[2]) local = R.multiply(local, R.rotationZ(node.rot[2]));
      if (node.rot[1]) local = R.multiply(local, R.rotationY(node.rot[1]));
      if (node.rot[0]) local = R.multiply(local, R.rotationX(node.rot[0]));
      node._m = R.multiply(parent, local);
      for (let i = 0; i < node.children.length; i++) walk(node.children[i], node._m);
    })(model.root, base);

    const out = {};
    function at(boneName, lx, ly, lz, key) {
      const b = model.bones[boneName];
      if (!b) return;
      R.transformPoint(b._m, lx, ly, lz, _jp);
      out[key] = [_jp[0], _jp[1], _jp[2]];
    }

    at('pelvis', 0, 0, 0, 'pelvis');
    at('torso', 0, d.torsoH * 0.92, 0, 'chest');
    at('head', 0, 0, 0, 'neck');
    at('head', 0, d.headH, 0, 'headTop');
    at('armR', 0, 0, 0, 'shoulderR');
    at('armR', 0, -d.upperArmH, 0, 'elbowR');
    at('foreR', 0, -d.lowerArmH, 0, 'handR');
    at('armL', 0, 0, 0, 'shoulderL');
    at('armL', 0, -d.upperArmH, 0, 'elbowL');
    at('foreL', 0, -d.lowerArmH, 0, 'handL');
    at('legR', 0, 0, 0, 'hipR');
    at('legR', 0, -d.upperLegH, 0, 'kneeR');
    at('shinR', 0, -d.lowerLegH, 0, 'footR');
    at('legL', 0, 0, 0, 'hipL');
    at('legL', 0, -d.upperLegH, 0, 'kneeL');
    at('shinL', 0, -d.lowerLegH, 0, 'footL');
    return out;
  }

  function createFall() {
    return {
      active: false,
      mode: 'soft',      // soft = jostled but stays upright; full = goes down
      state: 'up',       // up | falling | down | rising
      p: null, links: null, timer: 0, still: 0, rise: 0, settle: 0
    };
  }

  /* How hard each joint is dragged back toward where the animation says it
   * should be. The feet and hips are held firmly so a soft hit cannot topple
   * anyone; the further up the body, the more freely it swings. */
  /* A jostle is an arms-only reaction. Everything from the shoulders inward is
   * held exactly on the animated pose, so a knock never moves a character's
   * legs or neck — only a fall or a stumble does that. Letting the torso join
   * in is what kept reading as a flail. */
  const SOFT_PULL = {
    footR: 1, footL: 1, hipR: 1, hipL: 1, pelvis: 1,
    kneeR: 1, kneeL: 1,
    chest: 1, neck: 1, headTop: 1,
    shoulderR: 0.85, shoulderL: 0.85,
    elbowR: 0.26, elbowL: 0.26, handR: 0.19, handL: 0.19
  };
  const SOFT_TIME = 0.5;

  // How close every joint has to be to the animated pose before control is
  // handed back. Switching on a timer instead leaves the body wherever the
  // physics happened to put it and the model jumps — that is the teleport.
  const SETTLE_EPSILON = 0.22;

  /* Getting up, as poses rather than a straight interpolation back to
   * standing: face down with the arms planted, push the hips up, come onto a
   * knee, then stand. The physics still runs underneath, so the limbs collide
   * with the ground on the way through. */
  function getupKeys() {
    const k = [];
    function frame(spec) {
      const pose = emptyPose();
      for (const name in spec) pose[name] = spec[name].slice();
      k.push(pose);
    }
    frame({ torso: [0.62, 0, 0], head: [-0.4, 0, 0],
      armR: [1.0, 0, 0.55], armL: [1.0, 0, -0.55], foreR: [-1.5, 0, 0], foreL: [-1.5, 0, 0],
      legR: [-1.15, 0, 0.3], legL: [-1.0, 0, -0.3], shinR: [1.8, 0, 0], shinL: [1.7, 0, 0] });
    frame({ torso: [0.72, 0, 0], head: [-0.42, 0, 0],
      armR: [0.35, 0, 0.4], armL: [0.35, 0, -0.4], foreR: [-0.5, 0, 0], foreL: [-0.5, 0, 0],
      legR: [-1.45, 0, 0.22], legL: [-1.3, 0, -0.22], shinR: [2.0, 0, 0], shinL: [1.9, 0, 0] });
    frame({ torso: [0.4, 0, 0], head: [-0.18, 0, 0],
      armR: [-0.25, 0, 0.3], armL: [0.15, 0, -0.2], foreR: [-0.7, 0, 0], foreL: [-0.3, 0, 0],
      legR: [-1.0, 0, 0.16], legL: [-0.25, 0, -0.12], shinR: [1.5, 0, 0], shinL: [0.45, 0, 0] });
    frame({ torso: [0.12, 0, 0], head: [-0.05, 0, 0],
      armR: [0, 0, 0.12], armL: [0, 0, -0.12], foreR: [-0.2, 0, 0], foreL: [-0.2, 0, 0],
      legR: [-0.2, 0, 0.06], legL: [-0.05, 0, -0.04], shinR: [0.3, 0, 0], shinL: [0.1, 0, 0] });
    frame({ torso: [0.02, 0, 0], armR: [0, 0, 0.07], armL: [0, 0, -0.07],
      foreR: [-0.1, 0, 0], foreL: [-0.1, 0, 0] });
    return k;
  }
  const GETUP_KEYS = getupKeys();
  const RISE_TIME = 1.5;

  function distanceBetween(a, b) {
    return Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
  }

  // dirX/dirY is the world push direction (world y is depth, which is local z).
  function applyImpulse(actor, dirX, dirY, force, mode, opts) {
    const f = actor.fall;
    const model = actor.model;

    // pose the model as it currently stands, then read the joints off it
    poseActor(actor, quantiseTime(actor.animTime));
    const joints = jointPositions(model, actor.yaw);

    // A soft jostle already in progress can be escalated to a real fall.
    const reuse = f.active && f.p;
    const p = reuse ? f.p : {};
    const len = Math.hypot(dirX, dirY) || 1;
    const px = dirX / len, pz = dirY / len;
    const full = mode === 'full';
    const cap = full ? 9.0 : 5.0;
    const impulse = Math.max(0.6, Math.min(cap, force)) * SUBSTEP * (full ? 7.5 : 1.9);
    // Arms go up. A body that falls with its arms at its sides reads as a
    // dropped plank, so the hands and elbows get a good deal more of the
    // impulse than the trunk does, thrown up and out.
    const FLAIL = { handR: 3.2, handL: 3.2, elbowR: 2.1, elbowL: 2.1, headTop: 1.4 };

    let tallest = 1;
    for (let i = 0; i < JOINT_NAMES.length; i++) {
      const k = JOINT_NAMES[i];
      if (joints[k] && joints[k][1] > tallest) tallest = joints[k][1];
    }

    // Where the hit landed, in the actor's own frame: out on the side the
    // push came from, at whatever height the caller says it struck. Given
    // one, the impulse falls off with distance from that point, so bumping
    // someone's shoulder moves their shoulder rather than all of them.
    // jointPositions() already applies the actor's yaw, so particle space is
    // world-aligned and the push direction needs no further rotation.
    const contactY = opts && opts.contactY;
    const localised = typeof contactY === 'number';
    const cx = -px * 4.2, cy = contactY, cz = -pz * 4.2;
    const SIGMA2 = 2 * 7 * 7;

    for (let i = 0; i < JOINT_NAMES.length; i++) {
      const k = JOINT_NAMES[i];
      const j = joints[k];
      if (!j) continue;
      if (!reuse) {
        p[k] = { x: j[0], y: j[1], z: j[2], px: j[0], py: j[1], pz: j[2],
          r: PARTICLE_RADIUS[k] || 1.2 };
      }
      const q = p[k];
      let weight;
      if (localised) {
        const dx = q.x - cx, dy = q.y - cy, dz = q.z - cz;
        weight = 2.6 * Math.exp(-(dx * dx + dy * dy + dz * dz) / SIGMA2);
      } else {
        // whole-body shove: scales with height, so it topples rather than slides
        weight = 0.25 + 1.5 * (q.y / tallest);
      }
      q.px -= px * impulse * weight;
      q.pz -= pz * impulse * weight;
      q.py -= impulse * 0.16 * weight;
      const fl = FLAIL[k];
      if (fl && full) {
        const spin = (i % 2 ? 1 : -1) * impulse * fl;
        q.px -= pz * spin * 0.5;
        q.pz += px * spin * 0.5;
        q.py -= impulse * fl * 0.55;
      }
    }

    if (!reuse) {
      const links = [];
      for (let i = 0; i < RAGDOLL_LINKS.length; i++) {
        const a = RAGDOLL_LINKS[i][0], b = RAGDOLL_LINKS[i][1];
        if (!joints[a] || !joints[b]) continue;
        links.push({ a: a, b: b, len: distanceBetween(joints[a], joints[b]),
          stiff: RAGDOLL_LINKS[i][2] });
      }
      f.links = links;
      f.p = p;
      f.body = bodyVolumes(actor.model.dims);
    }

    f.active = true;
    f.mode = mode;
    f.state = full ? 'falling' : 'jostled';
    f.timer = full ? 0 : SOFT_TIME;
    f.still = 0;
    f.fallTime = 0;
    f.rise = 0;
    f.settle = 0;
    f.riseReady = false;
    actor.gait = 'idle';
    actor.speaking = false;
    actor.viseme = 'rest';
    return true;
  }

  // Jostled but still on their feet: the body reacts, nobody goes down.
  // `contactY` localises the reaction to the height the hit landed at.
  function nudge(actor, dirX, dirY, force, contactY) {
    if (actor.fall.active && actor.fall.mode === 'full') return false;
    return applyImpulse(actor, dirX, dirY, force, 'soft',
      contactY === undefined ? null : { contactY: contactY });
  }

  // Knocked off their feet entirely.
  function knockDown(actor, dirX, dirY, force) {
    return applyImpulse(actor, dirX, dirY, force, 'full');
  }

  function simulate(f, dt, gravityScale) {
    const p = f.p;
    const gStep = GRAVITY * (gravityScale === undefined ? 1 : gravityScale) * dt * dt;

    for (const k in p) {
      const q = p[k];
      const vx = (q.x - q.px) * 0.992;
      const vy = (q.y - q.py) * 0.992;
      const vz = (q.z - q.pz) * 0.992;
      q.px = q.x; q.py = q.y; q.pz = q.z;
      q.x += vx;
      q.y += vy - gStep;
      q.z += vz;
    }

    for (let it = 0; it < ITERATIONS; it++) {
      const links = f.links;
      for (let i = 0; i < links.length; i++) {
        const l = links[i];
        const a = p[l.a], b = p[l.b];
        const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
        const dist = Math.hypot(dx, dy, dz) || 1e-6;
        // the loose limit links only push apart, never pull together
        if (l.stiff < 0.2 && dist >= l.len) continue;
        const k = ((dist - l.len) / dist) * 0.5 * l.stiff;
        const ox = dx * k, oy = dy * k, oz = dz * k;
        a.x += ox; a.y += oy; a.z += oz;
        b.x -= ox; b.y -= oy; b.z -= oz;
      }
      separateLimbs(f);
      for (const key in p) {
        const q = p[key];
        if (q.y < q.r) {
          q.y = q.r;
          // ground friction, applied by dragging the previous position forward
          q.px += (q.x - q.px) * 0.4;
          q.pz += (q.z - q.pz) * 0.4;
        }
      }
    }
  }

  /* ------------------------------------------------------------------ *
   * Solid-body separation.
   *
   * The distance constraints alone are perfectly happy to let an arm swing
   * straight through the chest or the two legs scissor through each other,
   * because nothing in the solver knows the body has any volume. Since every
   * bone is drawn as a box spanning two particles, a segment that crosses the
   * torso is a limb visibly inside the body.
   *
   * So each frame we treat the body as solids and push overlapping parts
   * apart: an elliptical torso column (wide, shallow — a person is not a
   * cylinder), a head sphere, and the limbs as capsules against each other.
   * ------------------------------------------------------------------ */

  function bodyVolumes(d) {
    return {
      // Padded just under where an arm hangs at rest, so a limb lying along
      // the body touches the surface instead of being held off it — any more
      // and the solver splays the arms permanently.
      torsoX: d.torsoW / 2 + d.armW * 0.30,
      torsoZ: d.torsoD / 2 + d.armW * 0.30,
      headR: d.headW * 0.5 + d.armW * 0.2,
      armR: d.armW * 0.5,
      legR: d.legW * 0.5
    };
  }

  const DEFAULT_BODY = { torsoX: 4.6, torsoZ: 3.1, headR: 4.9, armR: 1.5, legR: 1.75 };

  // Limb segments tested against the torso and head, with which end is
  // anchored to the body itself (that end never moves — it *is* the torso).
  const LIMB_SEGMENTS = [
    { a: 'shoulderR', b: 'elbowR', rootA: true, vsHead: false },
    { a: 'elbowR', b: 'handR', rootA: false, vsHead: true },
    { a: 'shoulderL', b: 'elbowL', rootA: true, vsHead: false },
    { a: 'elbowL', b: 'handL', rootA: false, vsHead: true },
    { a: 'hipR', b: 'kneeR', rootA: true, vsHead: false },
    { a: 'kneeR', b: 'footR', rootA: false, vsHead: true },
    { a: 'hipL', b: 'kneeL', rootA: true, vsHead: false },
    { a: 'kneeL', b: 'footL', rootA: false, vsHead: true }
  ];

  // Limb pairs that must not pass through one another. Same-side arm/leg is
  // included: an arm sweeping through its own thigh reads just as wrong as
  // the legs crossing.
  const LIMB_PAIRS = [
    ['armR', 'armL'], ['armR', 'foreL'], ['foreR', 'armL'], ['foreR', 'foreL'],
    ['legR', 'legL'], ['legR', 'shinL'], ['shinR', 'legL'], ['shinR', 'shinL'],
    ['foreR', 'legR'], ['foreR', 'legL'], ['foreL', 'legL'], ['foreL', 'legR'],
    ['foreR', 'shinR'], ['foreL', 'shinL']
  ];

  const LIMB_BONES = {
    armR: ['shoulderR', 'elbowR', 'armR'], foreR: ['elbowR', 'handR', 'armR'],
    armL: ['shoulderL', 'elbowL', 'armR'], foreL: ['elbowL', 'handL', 'armR'],
    legR: ['hipR', 'kneeR', 'legR'], shinR: ['kneeR', 'footR', 'legR'],
    legL: ['hipL', 'kneeL', 'legR'], shinL: ['kneeL', 'footL', 'legR']
  };

  // Scratch frame, reused every iteration — this runs 8 times per substep.
  const _fr = {
    ox: 0, oy: 0, oz: 0, len: 1,
    ux: 0, uy: 1, uz: 0, lx: 1, ly: 0, lz: 0, fx: 0, fy: 0, fz: 1
  };

  /* Builds the torso's own axes: up along pelvis->neck, lateral across the
   * shoulders, forward as the cross product. Without a real frame the torso
   * can only be a round column, and a round column either lets arms through
   * at the front or holds them out at the sides. */
  function torsoFrame(p) {
    const a = p.pelvis, b = p.neck || p.chest;
    if (!a || !b) return null;
    let ux = b.x - a.x, uy = b.y - a.y, uz = b.z - a.z;
    const ul = Math.hypot(ux, uy, uz);
    if (ul < 1e-5) return null;
    ux /= ul; uy /= ul; uz /= ul;

    let lx, ly, lz;
    const sr = p.shoulderR, sl = p.shoulderL;
    if (sr && sl) { lx = sr.x - sl.x; ly = sr.y - sl.y; lz = sr.z - sl.z; }
    else { lx = 1; ly = 0; lz = 0; }
    const dot = lx * ux + ly * uy + lz * uz;
    lx -= ux * dot; ly -= uy * dot; lz -= uz * dot;
    let ll = Math.hypot(lx, ly, lz);
    if (ll < 1e-4) {
      // shoulders collapsed onto the spine: any perpendicular will do
      lx = Math.abs(ux) < 0.9 ? 1 : 0; ly = 0; lz = Math.abs(ux) < 0.9 ? 0 : 1;
      const d2 = lx * ux + ly * uy + lz * uz;
      lx -= ux * d2; ly -= uy * d2; lz -= uz * d2;
      ll = Math.hypot(lx, ly, lz) || 1;
    }
    lx /= ll; ly /= ll; lz /= ll;

    _fr.ox = a.x; _fr.oy = a.y; _fr.oz = a.z;
    _fr.len = ul;
    _fr.ux = ux; _fr.uy = uy; _fr.uz = uz;
    _fr.lx = lx; _fr.ly = ly; _fr.lz = lz;
    _fr.fx = uy * lz - uz * ly;
    _fr.fy = uz * lx - ux * lz;
    _fr.fz = ux * ly - uy * lx;
    return _fr;
  }

  // Push accumulator: a sample point can be pushed by torso and head in the
  // same pass, and both ends of a segment share what their samples ask for.
  const _push = { x: 0, y: 0, z: 0, hit: false };

  /* How far this point has to move to sit outside the torso column. */
  function torsoEscape(fr, body, x, y, z) {
    const dx = x - fr.ox, dy = y - fr.oy, dz = z - fr.oz;
    const s = dx * fr.ux + dy * fr.uy + dz * fr.uz;
    // The column starts above the hip block, not at the pelvis: the thighs
    // are *rooted* inside the pelvis, so testing them against it has the
    // solver fighting the skeleton's own geometry forever.
    if (s < fr.len * 0.3 || s > fr.len + 0.4) return false;
    const u = dx * fr.lx + dy * fr.ly + dz * fr.lz;
    const v = dx * fr.fx + dy * fr.fy + dz * fr.fz;
    const nu = u / body.torsoX, nv = v / body.torsoZ;
    const m = Math.hypot(nu, nv);
    if (m >= 1) return false;
    // scale out to the ellipse surface along the ray through the axis
    const k = m < 1e-4 ? 1 : 1 / m;
    const tu = u * k, tv = v * k;
    const eu = tu - u, ev = tv - v;
    _push.x = fr.lx * eu + fr.fx * ev;
    _push.y = fr.ly * eu + fr.fy * ev;
    _push.z = fr.lz * eu + fr.fz * ev;
    return true;
  }

  function headEscape(p, body, x, y, z) {
    const h = p.headTop, n = p.neck;
    if (!h || !n) return false;
    // the skull sits between the neck and the crown particle
    const cx = (h.x + n.x) * 0.5, cy = (h.y + n.y) * 0.5, cz = (h.z + n.z) * 0.5;
    const dx = x - cx, dy = y - cy, dz = z - cz;
    const d = Math.hypot(dx, dy, dz);
    if (d >= body.headR) return false;
    const k = d < 1e-4 ? 0 : (body.headR - d) / d;
    if (d < 1e-4) { _push.x = 0; _push.y = body.headR; _push.z = 0; return true; }
    _push.x = dx * k; _push.y = dy * k; _push.z = dz * k;
    return true;
  }

  const SAMPLES = [0.25, 0.55, 0.8, 1.0];

  /* Samples each limb segment along its length rather than only at the
   * joints. Testing endpoints alone is what let a forearm lie across the
   * chest with both the elbow and the hand clear of it. */
  function separateLimbs(f) {
    const p = f.p;
    const body = f.body || DEFAULT_BODY;
    const fr = torsoFrame(p);

    for (let i = 0; i < LIMB_SEGMENTS.length; i++) {
      const seg = LIMB_SEGMENTS[i];
      const a = p[seg.a], b = p[seg.b];
      if (!a || !b) continue;
      let ax = 0, ay = 0, az = 0, bx = 0, by = 0, bz = 0, any = false;

      for (let j = 0; j < SAMPLES.length; j++) {
        const t = SAMPLES[j];
        const x = a.x + (b.x - a.x) * t;
        const y = a.y + (b.y - a.y) * t;
        const z = a.z + (b.z - a.z) * t;
        let ex = 0, ey = 0, ez = 0, hit = false;
        if (fr && torsoEscape(fr, body, x, y, z)) {
          ex += _push.x; ey += _push.y; ez += _push.z; hit = true;
        }
        if (seg.vsHead && headEscape(p, body, x, y, z)) {
          ex += _push.x; ey += _push.y; ez += _push.z; hit = true;
        }
        if (!hit) continue;
        any = true;
        // Share the correction between the ends by how close the sample is to
        // each. A root end is welded to the torso, so it only takes a token
        // share — but not none: you cannot get a thigh out of your own chest
        // without your hips moving, and pushing only the knee leaves the
        // middle of the limb buried.
        const wa = seg.rootA ? (1 - t) * 0.3 : (1 - t);
        const wb = seg.rootA ? 1 : t;
        const sum = wa + wb || 1;
        ax += ex * wa / sum; ay += ey * wa / sum; az += ez * wa / sum;
        bx += ex * wb / sum; by += ey * wb / sum; bz += ez * wb / sum;
      }

      if (!any) continue;
      const n = SAMPLES.length;
      if (!seg.rootA) { a.x += ax / n; a.y += ay / n; a.z += az / n; }
      b.x += bx / n; b.y += by / n; b.z += bz / n;
    }

    separateLimbPairs(p, body);
  }

  // Closest points between two segments, then push them apart along that line.
  function separateLimbPairs(p, body) {
    for (let i = 0; i < LIMB_PAIRS.length; i++) {
      const A = LIMB_BONES[LIMB_PAIRS[i][0]], B = LIMB_BONES[LIMB_PAIRS[i][1]];
      const a0 = p[A[0]], a1 = p[A[1]], b0 = p[B[0]], b1 = p[B[1]];
      if (!a0 || !a1 || !b0 || !b1) continue;
      const want = body[A[2]] + body[B[2]];

      const ux = a1.x - a0.x, uy = a1.y - a0.y, uz = a1.z - a0.z;
      const vx = b1.x - b0.x, vy = b1.y - b0.y, vz = b1.z - b0.z;
      const wx = a0.x - b0.x, wy = a0.y - b0.y, wz = a0.z - b0.z;
      const uu = ux * ux + uy * uy + uz * uz;
      const uv = ux * vx + uy * vy + uz * vz;
      const vv = vx * vx + vy * vy + vz * vz;
      const uw = ux * wx + uy * wy + uz * wz;
      const vw = vx * wx + vy * wy + vz * wz;
      const den = uu * vv - uv * uv;
      let s, t;
      if (den < 1e-8) { s = 0; t = vv < 1e-8 ? 0 : vw / vv; }
      else { s = (uv * vw - vv * uw) / den; t = (uu * vw - uv * uw) / den; }
      s = s < 0 ? 0 : s > 1 ? 1 : s;
      t = t < 0 ? 0 : t > 1 ? 1 : t;

      const cax = a0.x + ux * s, cay = a0.y + uy * s, caz = a0.z + uz * s;
      const cbx = b0.x + vx * t, cby = b0.y + vy * t, cbz = b0.z + vz * t;
      let dx = cax - cbx, dy = cay - cby, dz = caz - cbz;
      let d = Math.hypot(dx, dy, dz);
      if (d >= want) continue;
      if (d < 1e-4) { dx = 1; dy = 0; dz = 0; d = 1; }
      // half each, softened — limbs are flesh, they can graze
      const k = (want - d) / d * 0.5 * 0.6;
      const px = dx * k, py = dy * k, pz = dz * k;
      a0.x += px * (1 - s); a0.y += py * (1 - s); a0.z += pz * (1 - s);
      a1.x += px * s; a1.y += py * s; a1.z += pz * s;
      b0.x -= px * (1 - t); b0.y -= py * (1 - t); b0.z -= pz * (1 - t);
      b1.x -= px * t; b1.y -= py * t; b1.z -= pz * t;
    }
  }

  function kineticEnergy(f) {
    let e = 0;
    for (const k in f.p) {
      const q = f.p[k];
      e += (q.x - q.px) * (q.x - q.px) + (q.y - q.py) * (q.y - q.py) + (q.z - q.pz) * (q.z - q.pz);
    }
    return e;
  }

  // Drags every particle toward where a given pose says the joint belongs.
  // Moving the previous position by the same amount makes this a pure
  // correction, so it repositions the body without wiping out its momentum —
  // which is what leaves the wobble in.
  function pullToward(f, target, strength, perJoint, damp) {
    for (const key in f.p) {
      const q = f.p[key];
      const t = target[key];
      if (!t) continue;
      // A weight of 1 in an explicit table means pinned: put the joint exactly
      // on the pose and stop it dead. Only ever from a table — treating a
      // missing table as "pin everything" turned the get-up and the settle
      // into instant snaps, which is what made characters teleport upright.
      const weight = perJoint
        ? (perJoint[key] === undefined ? 0.3 : perJoint[key])
        : 1;

      if (perJoint && weight >= 1) {
        q.x = t[0]; q.y = t[1]; q.z = t[2];
        q.px = t[0]; q.py = t[1]; q.pz = t[2];
        continue;
      }

      const k = Math.min(1, strength * weight);
      const dx = (t[0] - q.x) * k, dy = (t[1] - q.y) * k, dz = (t[2] - q.z) * k;
      q.x += dx; q.y += dy; q.z += dz;
      // Moving the previous position by the same amount makes this a pure
      // correction, leaving the body's momentum — and so its wobble — intact.
      q.px += dx; q.py += dy; q.pz += dz;
      if (damp) {
        q.px += (q.x - q.px) * damp;
        q.py += (q.y - q.py) * damp;
        q.pz += (q.z - q.pz) * damp;
      }
    }
  }

  // Blends the last of the way back onto the animated pose with gravity out of
  // the picture and the motion damped, so it always converges. Returns true
  // once every joint has arrived.
  function settleOntoPose(f, target, dt) {
    pullToward(f, target, Math.min(1, dt * 16), null, 0.45);
    separateLimbs(f);
    return worstError(f, target) < SETTLE_EPSILON;
  }

  function standingTarget(actor) {
    poseActor(actor, quantiseTime(actor.animTime));
    return jointPositions(actor.model, actor.yaw);
  }

  // Furthest any joint currently sits from where the animation wants it.
  function worstError(f, target) {
    let worst = 0;
    for (const key in f.p) {
      const q = f.p[key], t = target[key];
      if (!t) continue;
      const d = Math.hypot(t[0] - q.x, t[1] - q.y, t[2] - q.z);
      if (d > worst) worst = d;
    }
    return worst;
  }

  function updateFall(actor, dt) {
    const f = actor.fall;
    if (!f.active || !f.p) return;

    /* ---- jostled: the arms swing, nothing else moves ---- */
    if (f.mode !== 'full') {
      const target = standingTarget(actor);

      if (f.timer > 0) {
        let acc = Math.min(dt, 0.05);
        while (acc > 0) {
          const step = Math.min(SUBSTEP, acc);
          simulate(f, step, 0.25);
          acc -= step;
        }
        pullToward(f, target, Math.min(1, dt * 16), SOFT_PULL);
        separateLimbs(f);
        f.timer -= dt;
        return;
      }

      f.settle = (f.settle || 0) + dt;
      if (settleOntoPose(f, target, dt) || f.settle > 1.5) {
        f.active = false;
        f.state = 'up';
        f.settle = 0;
        f.p = null;
      }
      return;
    }

    /* ---- getting back up, under its own power ---- */
    if (f.state === 'rising') {
      if (!f.riseReady) {
        // Read which way the body is actually lying, so the get-up starts from
        // there. Pulling a prone body toward an upright pose is the teleport:
        // the very first target is already standing.
        const pel = f.p.pelvis, ch = f.p.chest;
        let ux = ch.x - pel.x, uy = ch.y - pel.y, uz = ch.z - pel.z;
        const L = Math.hypot(ux, uy, uz) || 1;
        ux /= L; uy /= L; uz /= L;
        const cy = Math.cos(actor.yaw), sy = Math.sin(actor.yaw);
        const side = ux * cy - uz * sy;
        const fwd = ux * sy + uz * cy;
        f.riseRoll = Math.asin(Math.max(-1, Math.min(1, -side)));
        f.risePitch = Math.atan2(fwd, uy);
        // Never tilt past flat. Someone who landed chest-down has their chest
        // below their pelvis, which reads as a tilt beyond ninety degrees, and
        // the get-up target then points the whole body into the ground.
        const lean = Math.hypot(f.risePitch, f.riseRoll);
        if (lean > Math.PI / 2) {
          const s = (Math.PI / 2) / lean;
          f.risePitch *= s;
          f.riseRoll *= s;
        }
        f.riseReady = true;
      }

      f.rise += dt / RISE_TIME;
      const k = Math.min(1, f.rise);
      const ease = k * k * (3 - 2 * k);

      let acc = Math.min(dt, 0.05);
      while (acc > 0) {
        const step = Math.min(SUBSTEP, acc);
        simulate(f, step, 0.55);
        acc -= step;
      }

      // walk the get-up keyframes, with the whole body righting itself from
      // however it landed toward vertical as the sequence plays
      const seg = k * (GETUP_KEYS.length - 1);
      const i = Math.min(GETUP_KEYS.length - 2, Math.floor(seg));
      const pose = lerpPose(GETUP_KEYS[i], GETUP_KEYS[i + 1], seg - i);
      applyPose(actor.model, pose, 0);
      const target = jointPositions(actor.model, actor.yaw,
        f.risePitch * (1 - ease), f.riseRoll * (1 - ease));

      // Lift the target itself off the floor before pulling toward it. The
      // keyframe's own forward lean adds to the body's tilt, which can aim a
      // joint well under the ground; correcting afterwards just moved the
      // snap somewhere else.
      for (const key in target) {
        const q = f.p[key];
        if (q && target[key][1] < q.r) target[key][1] = q.r;
      }
      pullToward(f, target, Math.min(1, dt * (2.5 + 9 * k)));
      // The pull aims at a keyframe, and a keyframe can put an arm where the
      // body is. Separate again afterwards or the last word each frame is the
      // pose, not the solid.
      separateLimbs(f);

      if (k >= 1) {
        // Blend the last of the way onto the pose rather than cutting over on
        // the clock, which is what made the model jump at the end.
        f.settle = (f.settle || 0) + dt;
        if (settleOntoPose(f, target, dt) || f.settle > 1.5) {
          f.active = false;
          f.state = 'up';
          f.settle = 0;
          f.p = null;
          /* A moment's grace on your feet. Standing up inside whatever put you
           * down means the next frame's contact floors you again, and you are
           * pinned there for ever getting up and falling over. */
          actor.hitCooldown = Math.max(actor.hitCooldown || 0, 0.9);
        }
      }
      return;
    }

    /* ---- going down ---- */
    let acc = Math.min(dt, 0.05);
    while (acc > 0) {
      const step = Math.min(SUBSTEP, acc);
      simulate(f, step, 1);
      acc -= step;
    }

    // hand the pelvis drift back to the actor so a tumbling body travels
    const pelvis = f.p.pelvis;
    const dx = pelvis.x, dz = pelvis.z;
    if (dx || dz) {
      for (const k in f.p) {
        const q = f.p[k];
        q.x -= dx; q.z -= dz;
        q.px -= dx; q.pz -= dz;
      }
      actor.x += dx;
      actor.y += dz;
    }

    if (f.state === 'falling') {
      /* Either it has come to rest, or it has been jittering long enough that
       * it never will. A body wedged against a tree is pushed out of the
       * trunk every frame, which keeps feeding the solver energy, so the
       * stillness test never trips and the character lies there for ever.
       * That is the freeze: not a pose that stops updating, a get-up that
       * never starts. */
      f.fallTime = (f.fallTime || 0) + dt;
      if (kineticEnergy(f) < 0.05) {
        f.still += dt;
        if (f.still > 0.15) { f.state = 'down'; f.timer = 0.18 + actor.rng() * 0.28; }
      } else {
        f.still = 0;
      }
      if (f.fallTime > 2.6) { f.state = 'down'; f.timer = 0.12; }
    } else if (f.state === 'down') {
      f.timer -= dt;
      if (f.timer <= 0) { f.state = 'rising'; f.rise = 0; f.riseReady = false; }
    }
  }

  // Down on the ground, as opposed to merely jostled.
  /* On the floor by any means. A posed collapse counts as down for every
   * purpose the rest of the game has — you cannot swing, cannot be talked to,
   * and anyone who walks past can see that you are lying there. The only code
   * that cares which of the two it is is the code that drives them, and that
   * asks for the state directly. */
  function isDown(actor) {
    if (actor.collapse) return true;
    return actor.fall.active && actor.fall.mode === 'full';
  }

  /* ---------- drawing a ragdoll ---------- */

  // Builds a bone matrix that runs from `from` to `to`, with `refLateral`
  // pinning the roll so knees and elbows keep pointing somewhere sensible.
  function segmentMatrix(from, to, axisSign, refLateral) {
    let ax = (to[0] - from[0]) * axisSign;
    let ay = (to[1] - from[1]) * axisSign;
