<title>Character Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root {
    --ink:        #151a22;
    --stage:      #0f131a;
    --panel:      #1d242e;
    --panel-2:    #232b37;
    --line:       #2f3846;
    --line-soft:  #262e3a;
    --bone:       #e7e2d4;
    --muted:      #8d97a6;
    --brass:      #c8963e;
    --brass-dim:  #8a6529;
    --verdigris:  #4f8f7d;
    --danger:     #b5565c;

    --pixel: "Silkscreen", "Courier New", monospace;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --gutter: 20px;
    --radius: 3px;
  }

  /* Light theme is the un-stamped default only when the OS asks for it. */
  :root {
    --ink:        #e3e1d8;
    --stage:      #141920;
    --panel:      #f1efe8;
    --panel-2:    #e7e4da;
    --line:       #c7c3b7;
    --line-soft:  #d5d1c6;
    --bone:       #24272d;
    --muted:      #5e656f;
    --brass:      #8c621d;
    --brass-dim:  #b08a3e;
    --verdigris:  #3b6f60;
    --danger:     #973f45;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink:        #151a22;
      --stage:      #0f131a;
      --panel:      #1d242e;
      --panel-2:    #232b37;
      --line:       #2f3846;
      --line-soft:  #262e3a;
      --bone:       #e7e2d4;
      --muted:      #8d97a6;
      --brass:      #c8963e;
      --brass-dim:  #8a6529;
      --verdigris:  #4f8f7d;
      --danger:     #b5565c;
    }
  }

  :root[data-theme="dark"] {
    --ink:        #151a22;
    --stage:      #0f131a;
    --panel:      #1d242e;
    --panel-2:    #232b37;
    --line:       #2f3846;
    --line-soft:  #262e3a;
    --bone:       #e7e2d4;
    --muted:      #8d97a6;
    --brass:      #c8963e;
    --brass-dim:  #8a6529;
    --verdigris:  #4f8f7d;
    --danger:     #b5565c;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    padding-inline: var(--gutter);
    padding-block: 18px 40px;
  }

  .shell { max-width: 1180px; margin: 0 auto; }

  /* ---------- header ---------- */

  header.masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }

  h1 {
    font-family: var(--pixel);
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--bone);
    text-wrap: balance;
  }

  .tagline {
    color: var(--muted);
    font-size: 12px;
    margin: 0;
    flex: 1 1 260px;
    min-width: 0;
  }

  .masthead .mode-switch { margin-left: auto; display: flex; gap: 6px; }

  /* ---------- layout ---------- */

  .workbench {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 360px);
    gap: 18px;
    align-items: start;
  }

  @media (max-width: 880px) {
    .workbench { grid-template-columns: minmax(0, 1fr); }
  }

  /* While playing, the whole editor gets out of the way. */
  body.playing .workbench { grid-template-columns: minmax(0, 1fr); }
  body.playing .rail { display: none; }
  body.playing .stage { position: static; }

  /* ---------- stage ---------- */

  .stage {
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 14px;
  }

  @media (max-width: 880px) { .stage { position: static; } }

  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    max-width: 100%;
    height: auto;
    background: #0b0e14;
    border-radius: 2px;
  }

  /* Shown at their own resolution where there is room, so one art pixel
     lands on one screen pixel. */
  #preview-canvas { width: 100%; max-width: 396px; }
  #world-canvas { width: 100%; max-width: 960px; display: block; }

  /* ---- touch controls ----
   * Overlaid on the viewport rather than below it, because a phone has no
   * room to spare and a thumb has to reach them without leaving the screen.
   * Everything is sized in vmin so it stays thumb-sized on any handset. */
  #world-wrap { position: relative; width: 100%; max-width: 960px; }

  #touch {
    position: absolute;
    inset: 0;
    pointer-events: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Sized against the viewport rather than the screen. The world is a
   * letterbox on a phone held upright, and a stick measured in vmin ended up
   * half as tall as the picture it was sitting on. */
  #stick {
    position: absolute;
    left: 3%;
    bottom: 7%;
    height: 46%;
    aspect-ratio: 1 / 1;
    min-height: 68px;
    max-height: 150px;
    border-radius: 50%;
    background: rgba(24, 21, 19, 0.42);
    border: 2px solid rgba(232, 214, 176, 0.35);
    pointer-events: auto;
    touch-action: none;
  }
  #stick-knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 42%;
    height: 42%;
    margin: -21% 0 0 -21%;
    border-radius: 50%;
    background: rgba(226, 208, 168, 0.72);
    border: 2px solid rgba(40, 33, 26, 0.6);
    pointer-events: none;
  }

  #pads {
    position: absolute;
    right: 3%;
    bottom: 6%;
    width: 36%;
    min-width: 124px;
    max-width: 230px;
    height: 68%;
    max-height: 216px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    /* bag, then the two it sits above, then the swing across the bottom
     * where the thumb already is */
    grid-template-rows: 0.8fr 1fr 1.3fr;
    gap: 5%;
    pointer-events: none;
  }
  .pad {
    pointer-events: auto;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    min-width: 0;
    padding: 0;
    border-radius: 12px;
    border: 2px solid rgba(232, 214, 176, 0.4);
    background: rgba(28, 24, 21, 0.58);
    color: #efe6d2;
    font: inherit;
    font-size: clamp(10px, 2.6vmin, 15px);
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .pad:active, .pad[aria-pressed="true"] {
    background: rgba(150, 112, 44, 0.85);
    border-color: rgba(246, 230, 190, 0.85);
  }
  .pad-wide { grid-column: 1 / -1; }
  .pad-act { background: rgba(46, 74, 46, 0.62); }
  .pad-hit { grid-column: 1 / -1; background: rgba(96, 36, 32, 0.66); }

  /* The attack pad doubles as an aim pad: press and drag to point the shot. */
  #pad-attack.aiming { background: rgba(160, 60, 48, 0.9); }

  /* With the bag open the screen belongs to the bag. Only the button that
   * closes it again stays put, so nothing sits over a slot you are reaching
   * for. */
  #touch.inv-open #stick,
  #touch.inv-open #pad-sprint,
  #touch.inv-open #pad-action,
  #touch.inv-open #pad-attack { display: none; }
  #touch.inv-open #pad-bag { background: rgba(96, 36, 32, 0.72); }

  @media (pointer: coarse) {
    #world-canvas { max-width: none; touch-action: none; }
    #world-wrap { max-width: none; }
    /* Every pixel of a phone screen belongs to the picture while playing. */
    body.playing { padding-inline: 0; padding-block: 8px 0; }
    body.playing .stage {
      padding: 0;
      border: 0;
      border-radius: 0;
      /* The picture sits in the middle of the handset rather than clinging to
       * the top with a screenful of nothing under it. */
      justify-content: center;
      min-height: calc(100svh - 74px);
    }
    body.playing .workbench { gap: 0; }
  }

  .stage-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    width: 100%;
  }

  .readout {
    font-family: var(--pixel);
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .readout b { color: var(--brass); font-weight: 400; }

  /* ---------- rail ---------- */

  .rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .tabs {
    display: flex;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .tabs button {
    flex: 1;
    border: 0;
    border-right: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-family: var(--pixel);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 4px;
    cursor: pointer;
  }
  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--brass); }
  .tabs button:hover { color: var(--bone); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel[hidden] { display: none !important; }

  .group { display: flex; flex-direction: column; gap: 9px; }

  .group > h2 {
    font-family: var(--pixel);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .group > h2 span { color: var(--muted); letter-spacing: 0.04em; }

  .field { display: flex; flex-direction: column; gap: 5px; }

  .field > label, .field-label {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .field-label var {
    font-style: normal;
    color: var(--bone);
    font-variant-numeric: tabular-nums;
  }

  input[type="text"], select {
    width: 100%;
    background: var(--panel-2);
    color: var(--bone);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 7px 8px;
    font-family: var(--mono);
    font-size: 13px;
  }
  input[type="text"] { font-family: var(--pixel); font-size: 12px; letter-spacing: 0.04em; }

  select { cursor: pointer; }

  input[type="range"] {
    width: 100%;
    accent-color: var(--brass);
    margin: 0;
    height: 20px;
  }

  :is(button, select, input, [tabindex]):focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 1px;
  }

  /* ---------- buttons ---------- */

  .btn {
    font-family: var(--pixel);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--panel-2);
    color: var(--bone);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 9px 11px;
    cursor: pointer;
    line-height: 1.3;
  }
  .btn:hover { border-color: var(--brass-dim); color: var(--brass); }
  .btn[aria-pressed="true"], .btn.is-active {
    background: var(--brass);
    border-color: var(--brass);
    color: #17130b;
  }
  .btn--primary {
    background: var(--brass);
    border-color: var(--brass);
    color: #17130b;
  }
  .btn--primary:hover { background: var(--brass-dim); border-color: var(--brass-dim); color: #fff; }
  .btn--ghost { background: transparent; }

  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-row > .btn { flex: 1 1 auto; }

  .segmented { display: flex; gap: 0; }
  .segmented .btn { flex: 1; border-radius: 0; border-right-width: 0; }
  .segmented .btn:first-child { border-radius: 2px 0 0 2px; }
  .segmented .btn:last-child { border-radius: 0 2px 2px 0; border-right-width: 1px; }

  /* ---------- swatches ---------- */

  .swatches { display: flex; flex-wrap: wrap; gap: 4px; }
  .swatch {
    width: 22px; height: 22px;
    border: 1px solid var(--line);
    border-radius: 2px;
    cursor: pointer;
    padding: 0;
    position: relative;
  }
  .swatch[aria-pressed="true"] {
    border-color: var(--brass);
    box-shadow: 0 0 0 1px var(--brass);
  }

  /* ---------- direction pad ---------- */

  .dirpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    max-width: 168px;
  }
  .dirpad .btn { padding: 8px 0; font-size: 8px; }
  .dirpad .spacer { visibility: hidden; }

  /* ---------- joints ---------- */

  .joint {
    border: 1px solid var(--line-soft);
    border-radius: 2px;
    padding: 8px 9px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--panel-2);
  }
  .joint > h3 {
    font-family: var(--pixel);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
    color: var(--bone);
  }
  .joint .axis { display: grid; grid-template-columns: 58px 1fr 38px; gap: 6px; align-items: center; }
  .joint .axis span { font-size: 10px; color: var(--muted); }
  .joint .axis var {
    font-style: normal; font-size: 10px; text-align: right;
    color: var(--brass); font-variant-numeric: tabular-nums;
  }

  .keyframes { display: flex; flex-wrap: wrap; gap: 4px; }
  .keyframe {
    font-family: var(--pixel); font-size: 9px;
    border: 1px solid var(--line); background: var(--panel-2);
    color: var(--muted); border-radius: 2px; padding: 6px 8px; cursor: pointer;
  }
  .keyframe:hover { color: var(--danger); border-color: var(--danger); }
  .keyframe b { color: var(--bone); font-weight: 400; }

  .hint {
    font-size: 11px;
    color: var(--muted);
    margin: 0;
    max-width: 62ch;
  }
  .hint kbd {
    font-family: var(--pixel); font-size: 9px;
    border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 2px; padding: 1px 4px; color: var(--bone);
    background: var(--panel-2);
  }

  .empty { color: var(--muted); font-size: 11px; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="shell">
  <header class="masthead">
    <h1>Character Forge</h1>
    <p class="tagline">Procedural pixel villagers &mdash; modelled in 3D, rendered to pixels, animated live.</p>
    <div class="mode-switch">
      <button class="btn is-active" id="mode-forge" type="button">Forge</button>
      <button class="btn" id="mode-world" type="button">World</button>
    </div>
  </header>

  <div class="workbench">
    <section class="stage" aria-label="Viewport">
      <canvas id="preview-canvas" width="396" height="456" aria-label="Character preview"></canvas>
      <div id="world-wrap" hidden>
        <canvas id="world-canvas" width="960" height="540" aria-label="Test scene"></canvas>
        <div id="touch" hidden aria-hidden="true">
          <div id="stick"><div id="stick-knob"></div></div>
          <div id="pads">
            <button class="pad pad-wide" id="pad-bag" type="button">BAG</button>
            <button class="pad" id="pad-sprint" type="button">RUN</button>
            <button class="pad pad-act" id="pad-action" type="button">E</button>
            <button class="pad pad-hit" id="pad-attack" type="button">HIT</button>
          </div>
        </div>
      </div>

      <div class="readout" id="readout"></div>

      <div class="stage-foot" id="forge-foot">
        <button class="btn" id="turn-left" type="button">&#8592; Turn</button>
        <button class="btn" id="turn-spin" type="button" aria-pressed="true">Turntable</button>
        <button class="btn" id="turn-right" type="button">Turn &#8594;</button>
      </div>

      <div class="stage-foot" id="world-foot" hidden></div>
    </section>

    <div class="rail">
      <div class="tabs" role="tablist" aria-label="Editor sections">
        <button role="tab" id="tab-identity" aria-selected="true" aria-controls="panel-identity" type="button">Identity</button>
        <button role="tab" id="tab-face" aria-selected="false" aria-controls="panel-face" type="button">Face &amp; hair</button>
        <button role="tab" id="tab-body" aria-selected="false" aria-controls="panel-body" type="button">Body</button>
        <button role="tab" id="tab-anim" aria-selected="false" aria-controls="panel-anim" type="button">Animation</button>
      </div>

      <section class="panel" id="panel-identity" role="tabpanel" aria-labelledby="tab-identity"></section>
      <section class="panel" id="panel-face" role="tabpanel" aria-labelledby="tab-face" hidden></section>
      <section class="panel" id="panel-body" role="tabpanel" aria-labelledby="tab-body" hidden></section>
      <section class="panel" id="panel-anim" role="tabpanel" aria-labelledby="tab-anim" hidden></section>

      <div class="btn-row">
        <button class="btn" id="randomise" type="button">Randomise</button>
        <button class="btn btn--primary" id="enter-world" type="button">Enter the world</button>
      </div>
    </div>
  </div>
</div>

<script src="render.js"></script>
<script src="parts.js"></script>
<script src="character.js"></script>

<script src="horse.js"></script>
<script src="vehicle.js"></script>
