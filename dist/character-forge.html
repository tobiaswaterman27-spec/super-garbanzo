    let az = (to[2] - from[2]) * axisSign;
    const alen = Math.hypot(ax, ay, az) || 1e-6;
    ax /= alen; ay /= alen; az /= alen;

    let rx = refLateral[0], ry = refLateral[1], rz = refLateral[2];
    const dot = rx * ax + ry * ay + rz * az;
    rx -= ax * dot; ry -= ay * dot; rz -= az * dot;
    let rlen = Math.hypot(rx, ry, rz);
    if (rlen < 1e-4) {
      // reference ran parallel to the bone; pick any perpendicular
      rx = Math.abs(ay) < 0.9 ? 0 : 1; ry = Math.abs(ay) < 0.9 ? 1 : 0; rz = 0;
      const d2 = rx * ax + ry * ay + rz * az;
      rx -= ax * d2; ry -= ay * d2; rz -= az * d2;
      rlen = Math.hypot(rx, ry, rz) || 1e-6;
    }
    rx /= rlen; ry /= rlen; rz /= rlen;

    // Z = X cross Y, giving a right-handed basis so normals are not mirrored
    const fx = ry * az - rz * ay;
    const fy = rz * ax - rx * az;
    const fz = rx * ay - ry * ax;

    const m = R.identity();
    m[0] = rx; m[1] = ax; m[2] = fx; m[3] = from[0];
    m[4] = ry; m[5] = ay; m[6] = fy; m[7] = from[1];
    m[8] = rz; m[9] = az; m[10] = fz; m[11] = from[2];
    return m;
  }

  function drawRagdoll(target, model, camera, fall, faceParts, extra) {
    const p = fall.p;
    const scale = model.root.scale || 1;
    const scaleM = R.scaling(scale);

    const sr = p.shoulderR, sl = p.shoulderL;
    let lateral = [sl.x - sr.x, sl.y - sr.y, sl.z - sr.z];
    const ll = Math.hypot(lateral[0], lateral[1], lateral[2]);
    if (ll < 1e-4) lateral = [1, 0, 0];
    else { lateral = [lateral[0] / ll, lateral[1] / ll, lateral[2] / ll]; }

    for (let i = 0; i < BONE_SEGMENTS.length; i++) {
      const seg = BONE_SEGMENTS[i];
      const bone = model.bones[seg.bone];
      if (!bone) continue;
      const a = p[seg.from], b = p[seg.to];
      if (!a || !b) continue;

      const m = R.multiply(scaleM,
        segmentMatrix([a.x, a.y, a.z], [b.x, b.y, b.z], seg.axis, lateral));

      for (let k = 0; k < bone.parts.length; k++) {
        const part = bone.parts[k];
        R.drawMesh(target, m, part.mesh, R.ramp(part.colour), camera, part);
      }
      if (faceParts && seg.bone === 'head') {
        for (let k = 0; k < faceParts.length; k++) {
          const part = faceParts[k];
          R.drawMesh(target, m, part.mesh, R.ramp(part.colour), camera, part);
        }
      }
      if (extra && extra[seg.bone]) {
        const list = extra[seg.bone];
        for (let k = 0; k < list.length; k++) {
          const part = list[k];
          const mm = part.at ? R.multiply(m, part.at) : m;
          R.drawMesh(target, mm, part.mesh, R.ramp(part.colour), camera, part);
        }
      }
    }
  }

  /* ---------- gestures ----------
   *
   * Deliberate, occasional actions layered over the still idle pose. They are
   * the one thing besides eyes and mouth allowed to move a standing character,
   * because they read as someone doing something rather than as drift.
   *
   * Each returns bone rotations to add to the idle pose; an envelope eases
   * them in and out so nothing snaps.
   */

  const TWO_PI = Math.PI * 2;

  const GESTURES = {
    wave: {
      duration: 2.1,
      label: 'Wave',
      pose: function (t) {
        return {
          armR: [-0.25, 0, -2.35],
          foreR: [0, 0, Math.sin(t * TWO_PI * 3) * 0.45 - 0.6],
          head: [0, 0.16, 0],
          torso: [0, 0.05, 0]
        };
      }
    },
    fear: {
      duration: 1.7,
      label: 'Alarm',
      pose: function (t) {
        const flinch = 1 - Math.min(1, t * 3);
        return {
          armR: [-1.45, 0, -0.42], foreR: [-1.35, 0, 0],
          armL: [-1.45, 0, 0.42], foreL: [-1.35, 0, 0],
          torso: [-0.26 - flinch * 0.1, 0, 0],
          head: [0.22, 0, 0]
        };
      }
    },
    laugh: {
      duration: 2.2,
      label: 'Laugh',
      pose: function (t) {
        const rock = Math.sin(t * TWO_PI * 3.2);
        return {
          torso: [0.2 + rock * 0.15, 0, 0],
          head: [-0.3 + rock * 0.1, 0, 0],
          armR: [-0.85, 0, 0.7], foreR: [-1.6, 0, 0],
          armL: [0.15, 0, -0.2]
        };
      }
    },
    ponder: {
      duration: 2.6,
      label: 'Ponder',
      pose: function (t) {
        return {
          armR: [-1.25, 0, 0.5], foreR: [-1.95, 0, 0.15],
          head: [0.08, 0.12, 0.14],
          torso: [0.04, 0.06, 0]
        };
      }
    },
    carry: {
      duration: 3.2,
      label: 'Carry',
      pose: function (t) {
        const sway = Math.sin(t * TWO_PI) * 0.05;
        return {
          armR: [-0.28, 0, 0.16], foreR: [-1.5 + sway, 0, 0.1],
          armL: [-0.28, 0, -0.16], foreL: [-1.5 - sway, 0, -0.1]
        };
      }
    },
    greet: {
      duration: 1.6,
      label: 'Nod',
      pose: function (t) {
        const nod = Math.sin(t * TWO_PI * 1.5);
        return { head: [nod * 0.26, 0, 0], torso: [nod * 0.06, 0, 0] };
      }
    },

    /* The arm goes out straight and stays out. Used by a witness telling the
     * watch where it happened and by a guard telling an onlooker to get back,
     * so it has to read while the pointer is moving — hence the overlay. */
    point: {
      duration: 1.9,
      label: 'Point',
      overlay: true,
      pose: function (t) {
        // a jab at the start, then held
        const jab = Math.max(0, 1 - t * 5) * 0.3;
        return {
          armR: [-1.42 - jab, 0, 0.34],
          foreR: [0.22 + jab * 0.6, 0, 0],
          torso: [-0.06, 0.18, 0],
          head: [-0.04, 0.2, 0]
        };
      }
    },

    /* Hands thrown up and shaken, which is what somebody running away from
     * something actually does with their arms. Overlaid, because it is only
     * ever wanted on top of a run. */
    flail: {
      duration: 1.5,
      label: 'Panic',
      overlay: true,
      pose: function (t) {
        const w = Math.sin(t * TWO_PI * 5.4);
        const w2 = Math.sin(t * TWO_PI * 5.4 + 2.1);
        return {
          armR: [-2.0 - w * 0.35, 0, -0.55],
          foreR: [-0.5 + w * 0.5, 0, 0],
          armL: [-2.0 - w2 * 0.35, 0, 0.55],
          foreL: [-0.5 + w2 * 0.5, 0, 0],
          head: [-0.18, w * 0.12, 0],
          torso: [-0.1, 0, 0]
        };
      }
    },

    /* Standing over somebody. The head goes down and the hands come together
     * in front, and nothing else happens at all — the stillness is the whole
     * of it. */
    mourn: {
      duration: 3.4,
      label: 'Bow head',
      pose: function (t) {
        const breathe = Math.sin(t * TWO_PI * 0.8) * 0.02;
        return {
          head: [0.62 + breathe, 0, 0],
          torso: [0.16 + breathe, 0, 0],
          armR: [-0.42, 0, 0.30], foreR: [-1.30, 0, -0.18],
          armL: [-0.42, 0, -0.30], foreL: [-1.34, 0, 0.18]
        };
      }
    },

    /* Stooping over somebody on the floor. Bent at the waist, one hand out
     * toward them, head down — the shape of asking whether they are alright,
     * which is different from the shape of grief because the hand is
     * reaching rather than covering. */
    tend: {
      duration: 3.0,
      label: 'Tend',
      pose: function (t) {
        const reach = Math.min(1, t * 3.5) * (1 - Math.max(0, (t - 0.8) / 0.2));
        return {
          torso: [0.72, 0.1, 0],
          head: [0.34, -0.12, 0],
          armR: [-0.55 - reach * 0.75, 0, 0.3],
          foreR: [-0.5 - reach * 0.5, 0, 0],
          armL: [0.2, 0, -0.22],
          foreL: [-0.45, 0, 0],
          legR: [0.16, 0, 0.1],
          shinR: [0.35, 0, 0],
          legL: [-0.1, 0, -0.08]
        };
      }
    },

    /* The other kind: a hand up to the face, shoulders down, and a shake
     * they cannot quite keep still. */
    sorrow: {
      duration: 3.8,
      label: 'Grieve',
      pose: function (t) {
        const shake = Math.sin(t * TWO_PI * 2.6) * 0.045;
        return {
          head: [0.5 + shake, -0.1, 0],
          torso: [0.3, -0.06, 0],
          armR: [-1.15, 0, 0.5], foreR: [-1.95, 0, 0.2],
          armL: [0.16, 0, -0.12], foreL: [-0.3, 0, 0]
        };
      }
    }
  };

  const GESTURE_IDS = Object.keys(GESTURES);

  function startGesture(actor, id) {
    const g = GESTURES[id];
    if (!g) return false;
    actor.gesture = { id: id, t: 0, duration: g.duration };
    return true;
  }

  /* The rotations a gesture is adding this frame, eased in and out so it
   * never starts or ends on a jump. Separated from applying them because an
   * overlay gesture adds the same numbers on top of a walk instead of on top
   * of the idle pose. */
  function gestureOffsets(model, gesture, qTime) {
    const g = GESTURES[gesture.id];
    if (!g) return;
    const t = Math.min(gesture.duration, quantiseTime(gesture.t));
    const phase = t / gesture.duration;
    const env = Math.min(1, phase / 0.14) * Math.min(1, (1 - phase) / 0.18);
    const offs = g.pose(phase);
    for (const name in offs) {
      const v = offs[name];
      addRot(model, name, v[0] * env, v[1] * env, v[2] * env);
    }
    void qTime;
  }

  function applyGesture(model, gesture, qTime) {
    poseIdle(model);
    gestureOffsets(model, gesture, qTime);
  }

  function isOverlayGesture(gesture) {
    const g = gesture && GESTURES[gesture.id];
    return !!(g && g.overlay);
  }

  /* ---------- custom poses and keyframes ---------- */

  function emptyPose() {
    const pose = {};
    for (let i = 0; i < JOINTS.length; i++) pose[JOINTS[i].name] = [0, 0, 0];
    return pose;
  }

  function clonePose(pose) {
    const out = {};
    for (const k in pose) out[k] = [pose[k][0], pose[k][1], pose[k][2]];
    return out;
  }

  function applyPose(model, pose, bob) {
    clearPose(model);
    for (const name in pose) {
      const v = pose[name];
      setRot(model, name, v[0], v[1], v[2]);
    }
    model.bob = bob || 0;
  }

  function lerpPose(a, b, t) {
    const out = {};
    for (const k in a) {
      const va = a[k], vb = b[k] || a[k];
      out[k] = [
        va[0] + (vb[0] - va[0]) * t,
        va[1] + (vb[1] - va[1]) * t,
        va[2] + (vb[2] - va[2]) * t
      ];
    }
    return out;
  }

  function samplePoseTrack(frames, t, duration) {
    if (!frames.length) return emptyPose();
    if (frames.length === 1) return frames[0].pose;
    const wrapped = ((t % duration) + duration) % duration;
    const step = duration / frames.length;
    const i = Math.min(frames.length - 1, Math.floor(wrapped / step));
    const j = (i + 1) % frames.length;
    return lerpPose(frames[i].pose, frames[j].pose, (wrapped - i * step) / step);
  }

  /* ---------- directions ---------- */

  // Ordered by increasing yaw so directionName() can index straight into it.
  // Yaw 0 faces the camera (south); yaw grows clockwise on screen.
  const DIRECTIONS = [
    { id: 'S', label: 'South', dx: 0, dy: 1 },
    { id: 'SE', label: 'South-east', dx: 0.7071, dy: 0.7071 },
    { id: 'E', label: 'East', dx: 1, dy: 0 },
    { id: 'NE', label: 'North-east', dx: 0.7071, dy: -0.7071 },
    { id: 'N', label: 'North', dx: 0, dy: -1 },
    { id: 'NW', label: 'North-west', dx: -0.7071, dy: -0.7071 },
    { id: 'W', label: 'West', dx: -1, dy: 0 },
    { id: 'SW', label: 'South-west', dx: -0.7071, dy: 0.7071 }
  ];

  function yawForDirection(dx, dy) { return Math.atan2(dx, dy); }

  function snapToEight(dx, dy) {
    const step = Math.PI / 4;
    return Math.round(Math.atan2(dx, dy) / step) * step;
  }

  function directionName(yaw) {
    const step = Math.PI / 4;
    let i = Math.round(yaw / step) % 8;
    if (i < 0) i += 8;
    return DIRECTIONS[i].id;
  }

  function shortestAngle(from, to) {
    let diff = (to - from) % (Math.PI * 2);
    if (diff > Math.PI) diff -= Math.PI * 2;
    if (diff < -Math.PI) diff += Math.PI * 2;
    return diff;
  }

  /* ---------- actors ---------- */

  function createActor(character, x, y, seed) {
    const model = CM.buildModel(character);
    return {
      character: character,
      model: model,
      x: x, y: y,
      vx: 0, vy: 0,
      yaw: 0,
      targetYaw: 0,
      gait: 'idle',          // idle | walk | run | skid
      animTime: Math.random() * 10,
      rng: CM.makeRng(seed === undefined ? (Math.random() * 0xffffffff) >>> 0 : seed),
      blink: 0,
      blinkPhase: 0,
      blinkTimer: 1 + Math.random() * 4,
      blinkQueue: 0,
      viseme: 'rest',
      gaze: 0,
      speaking: false,
      shoveX: 0, shoveY: 0, stumbleTime: 0, hitCooldown: 0,
      gesture: null,
      fall: createFall(),
      brain: null,
      buffer: null,
      // combat and carrying, filled in by whoever creates the actor
      body: global.Combat ? global.Combat.createBody() : null,
      inv: global.Items ? global.Items.createInventory(undefined, true) : null,
      leftHanded: false,
      attack: null,
      attackCooldown: 0,
      stamina: 100,
      _key: ''
    };
  }

  function rebuildActorModel(actor) {
    actor.model = CM.buildModel(actor.character);
    actor._key = '';
  }

  /* Being shoved moves the whole character. A bump should push someone aside,
   * not leave them rooted to the spot waving their arms — that reads as a
   * flail no matter how the limbs are tuned. */
  function shove(actor, dirX, dirY, speed) {
    const len = Math.hypot(dirX, dirY) || 1;
    actor.shoveX += (dirX / len) * speed;
    actor.shoveY += (dirY / len) * speed;
  }

  // A stumble: shoved hard enough that they have to put their feet down. The
  // walk cycle runs for the duration so the legs actually catch them.
  function stumble(actor, dirX, dirY, speed, duration) {
    shove(actor, dirX, dirY, speed);
    actor.stumbleTime = Math.max(actor.stumbleTime || 0, duration === undefined ? 0.55 : duration);
  }

  function applyShove(actor, dt) {
    if (actor.stumbleTime > 0) actor.stumbleTime = Math.max(0, actor.stumbleTime - dt);
    // One reaction per contact. Bodies stay overlapped for many frames while
    // they are pushed apart, and re-reacting on each of those frames stacks
    // into a shove several times the size of the one that was intended.
    if (actor.hitCooldown > 0) actor.hitCooldown = Math.max(0, actor.hitCooldown - dt);
    if (!actor.shoveX && !actor.shoveY) return;
    actor.x += actor.shoveX * dt;
    actor.y += actor.shoveY * dt;
    const decay = Math.exp(-dt * 5.5);
    actor.shoveX *= decay;
    actor.shoveY *= decay;
    if (Math.abs(actor.shoveX) < 0.6 && Math.abs(actor.shoveY) < 0.6) {
      actor.shoveX = 0;
      actor.shoveY = 0;
    }
  }

  const TURN_RATE = 11.0;

  function updateActorMotion(actor, dt) {
    const diff = shortestAngle(actor.yaw, actor.targetYaw);
    const maxStep = TURN_RATE * dt;
    if (Math.abs(diff) <= maxStep) actor.yaw = actor.targetYaw;
    else actor.yaw += Math.sign(diff) * maxStep;

    actor.animTime += dt;
    if (actor.gesture) {
      actor.gesture.t += dt;
      if (actor.gesture.t >= actor.gesture.duration) actor.gesture = null;
    }
    updateFall(actor, dt);
    updateBlink(actor, dt);
  }

  function updateBlink(actor, dt) {
    if (actor.blink > 0) {
      actor.blinkPhase += dt;
      const p = actor.blinkPhase / 0.17;
      if (p >= 1) {
        actor.blink = 0;
        if (actor.blinkQueue > 0) { actor.blinkQueue--; actor.blinkTimer = 0.09; }
        else actor.blinkTimer = 5.0 + actor.rng() * 7.0;
      } else {
        actor.blink = p < 0.4 ? p / 0.4 : 1 - (p - 0.4) / 0.6;
      }
      return;
    }
    actor.blinkTimer -= dt;
    if (actor.blinkTimer <= 0) {
      actor.blink = 0.001;
      actor.blinkPhase = 0;
      actor.blinkQueue = actor.rng() < 0.07 ? 1 : 0;
    }
  }

  function poseActor(actor, qTime) {
    const model = actor.model;
    if (actor.customPose) { applyPose(model, actor.customPose, actor.customBob || 0); return; }
    const side = actor.leftHanded ? 'L' : 'R';
    if (actor.collapse) {
      const c = actor.collapse;
      const span = c.phase === 'fall' ? c.fallFor : c.phase === 'down' ? c.downFor : c.riseFor;
      // the fall and the get-up run on the action clock; lying there runs on
      // the slow one, because a body on the floor has nothing quick to do
      const t = c.phase === 'down' ? quantiseTime(c.t) : quantiseAction(c.t);
      poseCollapse(model, c.phase, span > 0 ? t / span : 1, c.side, c.front, c.zone, c.hand);
      return;
    }
    if (actor.attack) {
      const k = quantiseAction(actor.attack.t) / actor.attack.duration;
      poseAttack(model, actor.attack.anim, k, side, actor.gait, qTime);
      return;
    }
    if (actor.reaction) {
      const r = actor.reaction;
      const rk = Math.round(r.k * ACTION_FPS) / ACTION_FPS;
      if (r.kind === 'clutch') { poseClutch(model, rk, r.zone, side); return; }
      if (r.kind === 'stagger') { poseStagger(model, rk, r.side || 0); return; }
      if (r.kind === 'sheathe' || r.kind === 'draw') { poseSheathe(model, r.k, side); return; }
      if (r.kind === 'nock') { poseNock(model, r.k, side); return; }
      if (r.kind === 'guard' || r.kind === 'surrender') { poseGuard(model, r.k, side); return; }
    }
    const mode = carryMode(actor);
    if (actor.gait === 'walk') poseWalk(model, qTime, false);
    else if (actor.gait === 'run') poseWalk(model, qTime, true);
    else if (actor.gesture && !isOverlayGesture(actor.gesture)) {
      applyGesture(model, actor.gesture, qTime);
    } else {
      poseIdle(model);
      // someone holding a weapon holds it ready, not dangling
      const I = global.Items;
      if (I && actor.inv && actor.inv[I.HAND] && actor.alert && mode !== 'upright') {
        poseReady(model, actor.leftHanded ? 'L' : 'R', !!actor.inv[I.SHIELD]);
      }
    }
    poseCarry(actor, model, side, mode);
    // Fear and accusation have to read while somebody is moving, so those
    // gestures are added on top of whatever the legs are doing rather than
    // replacing it.
    if (actor.gesture && isOverlayGesture(actor.gesture)) {
      gestureOffsets(model, actor.gesture, qTime);
    }
  }

  /* ---------- carrying a weapon ----------
   *
   * A weapon hangs off the forearm and runs down the arm's own axis, so with
   * the arm at rest it points at the floor. Measured against the rig, the
   * grip sits about eleven units up and every weapon but the dagger is longer
   * than that: a sword stuck five units into the turf, a poleaxe thirteen.
   * Nothing clipped, because the sprite is drawn whole and blitted at the
   * feet — so the point simply hung in front of the grass looking like it
   * ought to be buried in it.
   *
   * The fix is to carry the thing properly. How much it has to come up is not
   * a guess: it is whatever angle keeps the far end of that particular
   * weapon off the ground, measured from its own mesh. Short blades still
   * hang; long ones ride up across the body; a polearm goes over the
   * shoulder because nothing else will fit.
   */

  const CARRY_CLEAR = 3.2;       // how far above the grass the point rides
  // A walk drops the shoulder a little and a run drops it further, so the
  // point needs more room the faster somebody is going.
  const CARRY_GAIT_CLEAR = { walk: 0.8, run: 1.8 };
  // Past this much tilt the thing is simply too long to carry in front of
  // you, and it goes on the shoulder instead.
  const CARRY_SHOULDER = 1.02;

  const _wLen = Object.create(null);

  /* How far a weapon reaches past the hand, in model units, once it has been
   * scaled to the wielder. Read off the mesh rather than listed, so a
   * redesigned blade carries correctly without anyone remembering to update a
   * table. */
  function weaponDrop(id) {
    let d = _wLen[id];
    if (d !== undefined) return d;
    const I = global.Items;
    const parts = I && I.iconParts ? I.iconParts(id) : null;
    let lo = 0;
    if (parts) {
      for (let i = 0; i < parts.length; i++) {
        const a = parts[i].mesh.aabb;
        if (a.y < lo) lo = a.y;
      }
    }
    d = -lo * WEAPON_SCALE;
    _wLen[id] = d;
    return d;
  }

  /* Where the hand sits with the arm hanging, measured off this body rather
   * than assumed, so a short character does not carry a sword differently
   * from a tall one by accident. */
  function gripHeight(model) {
    const d = model.dims;
    return d.legTotal + d.torsoH - 1.0 - d.upperArmH - d.lowerArmH - 0.9;
  }

  /* How this person is carrying what is in their hand, this frame. Both the
   * pose and the grip need the answer and they are worked out at different
   * points in the draw, so it is decided once, here, from the same facts.
   *
   *   none     something else owns the arm — a swing, a flinch, a ready
   *            stance, a gesture. The weapon goes where that pose puts it.
   *   hang     short enough to hang at the side on its own.
   *   trail    too long to hang: the elbow comes up and it rides forward.
   *   upright  too long for that too: it is turned over in the hand and
   *            stood up, butt by the hip and point above the shoulder.
   */
  function carryMode(actor) {
    const I = global.Items;
    if (!I || !actor.inv || !actor.inv[I.HAND]) return 'none';
    if (actor.customPose || actor.attack || actor.reaction) return 'none';
    if (actor.fall && actor.fall.active) return 'none';
    const moving = actor.gait === 'walk' || actor.gait === 'run';
    if (!moving && actor.gesture && !isOverlayGesture(actor.gesture)) return 'none';

    const hand = actor.inv[I.HAND];
    const drop = weaponDrop(hand.id);
    const room = gripHeight(actor.model) - CARRY_CLEAR
      - (CARRY_GAIT_CLEAR[actor.gait] || 0);
    let cls;
    if (drop <= room) cls = 'hang';
    else if (Math.acos(Math.max(-1, Math.min(1, room / drop))) < CARRY_SHOULDER) {
      cls = 'trail';
    } else {
      /* A bow is never stood up: it is held by the grip with its limbs either
       * side of the hand, and turning it over would put the top limb through
       * the ground instead of the bottom one. It rides forward like the
       * rest. */
      const C = global.Combat;
      const d = I.def(hand.id);
      cls = (C && d && d.weapon && C.weapon(d.weapon).ranged) ? 'trail' : 'upright';
    }
    /* Standing ready owns the arm — except for a pole. Levelling twenty-four
     * units of poleaxe at chest height runs it straight through whoever is
     * standing beside you, which is exactly the thing that reads as a bug. A
     * watchman at rest stands it up instead, and it is the better pose
     * anyway. */
    if (!moving && actor.alert && cls !== 'upright') return 'none';
    return cls;
  }

  function carryNeed(actor) {
    const I = global.Items;
    const hand = actor.inv[I.HAND];
    const drop = weaponDrop(hand.id);
    const room = gripHeight(actor.model) - CARRY_CLEAR
      - (CARRY_GAIT_CLEAR[actor.gait] || 0);
    return Math.acos(Math.max(-1, Math.min(1, room / Math.max(room, drop))));
  }

  function poseCarry(actor, model, side, mode) {
    const sgn = side === 'R' ? 1 : -1;
    if (mode === 'trail') {
      /* The elbow comes up and the blade rides forward across the front of
       * the leg. The shoulder takes a little of it and the elbow the rest,
       * because an elbow doing all of it reads as a cramp. */
      const need = carryNeed(actor);
      setRot(model, 'arm' + side, -need * 0.3, 0, sgn * 0.22);
      setRot(model, 'fore' + side, -need * 0.7, 0, 0);
      return;
    }
    if (mode === 'upright') {

    for (let s2 = -1; s2 <= 1; s2 += 2) {
      head.parts.push(part(G.superellipsoid(s2 * (d.headW / 2 - 0.5), d.headLen * 0.2, 0.6,
        1.5, 2.6, 2.4, 0.7, 4, 8), c.body));
    }
    // forelock, hanging between the ears
    head.parts.push(part(G.slab(-1.8, d.headLen * 0.02, -d.headH / 2 - 0.7,
      3.6, 3.8, 2.2, 0.7, 1), c.mane));
    for (let s2 = -1; s2 <= 1; s2 += 2) {
      // ears, swept back off the poll
      head.parts.push(part(G.pyramid(s2 * 1.7 - 0.8, d.headLen * 0.02, -1.9,
        1.6, 3.2, 1.6), c.points));
      // eyes, set on the sides of the skull the way a prey animal's are
      head.parts.push(part(G.superellipsoid(s2 * (d.headW / 2 + 0.1), d.headLen * 0.3, -0.7,
        0.7, 1.0, 0.9, 0.6, 4, 7), '#17120e'));
    }
    // face white
    if (h.marking === 'blaze' || h.marking === 'stripe') {
      const w = h.marking === 'blaze' ? 2.8 : 1.3;
      head.parts.push(part(G.slab(-w / 2, d.headLen * 0.12, -d.headH / 2 - 0.45,
        w, d.headLen * 0.8, 1.1, 0.9, 1), c.white));
    } else if (h.marking === 'star') {
      head.parts.push(part(G.superellipsoid(0, d.headLen * 0.16, -d.headH / 2 - 0.2,
        1.4, 1.6, 0.8, 0.7, 4, 7), c.white));
    } else if (h.marking === 'snip') {
      head.parts.push(part(G.superellipsoid(0, d.headLen * 0.88, -d.headH / 2 + 0.4,
        1.1, 1.4, 0.8, 0.7, 4, 7), c.white));
    }
    neck.children.push(head);

    /* ---- tail ---- */
    const tail = bone('tail', [0, d.bodyLen * 0.06, -halfH * 0.55]);
    tail.rot[0] = TAIL_ANGLE;
    // dock, then a rope of hair. Narrow — a wide taper seen edge-on at this
    // camera angle reads as a plank nailed to the horse.
    tail.parts.push(part(G.superellipsoid(0, 1.4, 0, 1.7, 2.2, 1.7, 0.7, 4, 8), c.body));
    tail.parts.push(part(G.superellipsoid(0, d.tailLen * 0.42, 0,
      1.5, d.tailLen * 0.34, 1.5, 0.75, 5, 9), c.mane));
    tail.parts.push(part(G.superellipsoid(0, d.tailLen * 0.86, 0,
      1.1, d.tailLen * 0.3, 1.1, 0.75, 5, 9), c.mane));
    body.children.push(tail);

    /* ---- legs ---- */
    const legs = [
      ['legFL', -1, d.bodyLen * 0.34], ['legFR', 1, d.bodyLen * 0.34],
      ['legBL', -1, -d.bodyLen * 0.34], ['legBR', 1, -d.bodyLen * 0.34]
    ];
    for (let i = 0; i < legs.length; i++) {
      const name = legs[i][0], side = legs[i][1], z = legs[i][2];
      const rear = name[3] === 'B';
      const sock = h.socks > i;
      const upper = bone(name, [side * (d.bodyW / 2 - d.legW / 2 + 0.3), d.legY, z]);
      // haunch or shoulder mass at the top of the leg, then the cannon bone
      upper.parts.push(part(G.superellipsoid(0, -3.6, rear ? -1.4 : 0.5,
        d.legW / 2 + 1.1, 5.2, d.legW / 2 + (rear ? 2.4 : 1.2), 0.66, 5, 9), c.body));
      upper.parts.push(part(G.taper(-d.legW / 2, -d.upperLeg, -d.legW / 2,
        d.legW, d.upperLeg, d.legW, 1.18), c.body));
      root.children.push(upper);

      const lower = bone(name.replace('leg', 'shin'), [0, -d.upperLeg, 0]);
      const lw = d.legW * 0.68;
      lower.parts.push(part(G.superellipsoid(0, -0.4, 0,
        d.legW / 2 * 0.9, 1.6, d.legW / 2 * 0.9, 0.5, 3, 7), sock ? c.white : c.body));
      lower.parts.push(part(G.slab(-lw / 2, -d.lowerLeg, -lw / 2,
        lw, d.lowerLeg, lw, 0.9, 1), sock ? c.white : c.points));
      // fetlock and hoof
      lower.parts.push(part(G.superellipsoid(0, -d.lowerLeg + 0.4, 0,
        lw * 0.62, 1.4, lw * 0.62, 0.5, 3, 7), sock ? c.white : c.points));
      lower.parts.push(part(G.taper(-lw / 2 - 0.5, -d.lowerLeg - d.hoofH, -lw / 2 - 0.5,
        lw + 1.0, d.hoofH, lw + 1.0, 1.12), c.hoof));
      upper.children.push(lower);
    }

    /* ---- tack ---- */
    if (h.saddle) {
      const sy = d.legY + halfH * 0.72;
      const sz = d.bodyLen * 0.06;
      body.parts.push(part(G.superellipsoid(0, d.bodyLen * 0.56, -halfH * 0.86,
        halfW * 0.92, 5.2, 2.2, 0.4, 4, 9), c.saddle));
      // cantle and pommel, front and back of the seat
      body.parts.push(part(G.superellipsoid(0, d.bodyLen * 0.56 - 5.0, -halfH * 1.05,
        halfW * 0.7, 1.3, 2.0, 0.45, 3, 7), c.saddle));
      body.parts.push(part(G.superellipsoid(0, d.bodyLen * 0.56 + 5.0, -halfH * 1.02,
        halfW * 0.6, 1.2, 1.8, 0.45, 3, 7), c.saddle));
      // girth around the barrel
      body.parts.push(part(G.slab(-halfW - 0.2, d.bodyLen * 0.54, -halfH - 0.2,
        d.bodyW + 0.4, 2.0, d.bodyH + 0.4, 0.5, 1), c.strap));
      void sy; void sz;
      // stirrups
      for (let s = -1; s <= 1; s += 2) {
        body.parts.push(part(G.slab(s * halfW * 0.95 - 0.5, d.bodyLen * 0.54, -halfH * 0.4,
          1.0, 1.4, 5.6, 1, 1), c.strap));
        body.parts.push(part(G.slab(s * halfW * 0.95 - 1.2, d.bodyLen * 0.52, halfH * 0.22,
          2.4, 2.2, 1.0, 1, 1), c.brass));
      }
    }
    // bridle and reins — the reins are what the rider actually holds
    head.parts.push(part(G.slab(-d.headW / 2 - 0.2, d.headLen * 0.5, -d.headH / 2 - 0.2,
      d.headW + 0.4, 1.1, d.headH + 0.4, 0.6, 1), c.strap));
    head.parts.push(part(G.slab(-d.headW / 2 - 0.2, d.headLen * 0.16, -d.headH / 2 - 0.2,
      d.headW + 0.4, 1.0, d.headH + 0.4, 0.6, 1), c.strap));

    const bones = {};
    (function index(node) {
      bones[node.name] = node;
      for (let i = 0; i < node.children.length; i++) index(node.children[i]);
    })(root);

    return { root: root, bones: bones, dims: d, colours: c, horse: h };
  }

  /* ---------- where the rider sits ---------- */

  // In world units from the horse's own origin, before the model scale.
  function saddlePoint(model) {
    const d = model.dims;
    return {
      x: 0,
      y: (d.legY + d.bodyH * 0.5 + 1.6) * d.scale,
      z: d.bodyLen * 0.06 * d.scale
    };
  }

  function reinPoint(model) {
    const d = model.dims;
    return {
      y: (d.legY + d.bodyH * 0.42 + d.neckLen * 0.55) * d.scale,
      z: (d.bodyLen * 0.4 + 3) * d.scale
    };
  }


  /* ================= gaits ================= */

  const ANIM_FPS = 12;
  const YAW_STEPS = 16;
  const YAW_STEP = (Math.PI * 2) / YAW_STEPS;
  function quantiseTime(t) { return Math.floor(t * ANIM_FPS) / ANIM_FPS; }
  function quantiseYaw(y) { return Math.round(y / YAW_STEP) * YAW_STEP; }

  const LEGS = ['legFL', 'legFR', 'legBL', 'legBR'];
  const SHINS = ['shinFL', 'shinFR', 'shinBL', 'shinBR'];
  // Diagonal pairs: a horse moves front-left with hind-right. Getting this
  // wrong is the difference between a trot and a pantomime horse.
  const PHASE = { legFL: 0, legBR: 0, legFR: 0.5, legBL: 0.5 };

  function setRot(model, name, x, y, z) {
    const b = model.bones[name];
    if (!b) return;
    b.rot[0] = x || 0; b.rot[1] = y || 0; b.rot[2] = z || 0;
  }

  function clearPose(model) {
    for (const k in model.bones) {
      const r = model.bones[k].rot;
      r[0] = 0; r[1] = 0; r[2] = 0;
    }
    setRot(model, 'body', Math.PI / 2, 0, 0);
    setRot(model, 'neck', -NECK_ANGLE, 0, 0);
    setRot(model, 'head', HEAD_ANGLE, 0, 0);
    setRot(model, 'tail', TAIL_ANGLE, 0, 0);
    model.bob = 0;
  }

  const GAITS = {
    idle: { rate: 0.9, swing: 0.0, knee: 0.0, bob: 0.0, lift: 0, neck: 0 },
    walk: { rate: 4.4, swing: 0.30, knee: 0.34, bob: 0.5, lift: 0.10, neck: 0.05 },
    trot: { rate: 7.2, swing: 0.46, knee: 0.62, bob: 1.1, lift: 0.16, neck: 0.09 },
    gallop: { rate: 9.2, swing: 0.78, knee: 1.05, bob: 2.2, lift: 0.26, neck: 0.20 }
  };

  function poseGait(model, t, gait) {
    clearPose(model);
    const g = GAITS[gait] || GAITS.idle;
    const p = t * g.rate;

    if (gait === 'idle') {
      // breathing: the barrel lifts, the head nods, nothing else moves
      const breath = Math.sin(t * 1.5);
      model.bob = breath * 0.16;
      setRot(model, 'neck', -NECK_ANGLE + breath * 0.028, 0, 0);
      setRot(model, 'head', HEAD_ANGLE + Math.sin(t * 1.1) * 0.05, 0, 0);
      setRot(model, 'tail', TAIL_ANGLE + Math.sin(t * 0.7) * 0.09, 0, 0);
      return;
    }

    for (let i = 0; i < LEGS.length; i++) {
      const name = LEGS[i];
      const ph = (p + PHASE[name] * Math.PI * 2) % (Math.PI * 2);
      const swing = Math.sin(ph) * g.swing;
      // the knee only folds on the half of the cycle where the foot is off
      // the ground; a leg bending while it carries weight reads as a limp
      const fold = Math.max(0, Math.cos(ph)) * g.knee;
      const rear = name[3] === 'B';
      setRot(model, name, swing, 0, 0);
      setRot(model, SHINS[i], rear ? -fold * 0.8 : fold, 0, 0);
    }

    // At a gallop the whole animal gathers and extends, so the bob runs at
    // the stride rate rather than at twice it.
    const bobPhase = gait === 'gallop' ? p : p * 2;
    model.bob = Math.sin(bobPhase) * g.bob;
    const reach = Math.sin(p) * g.neck;
    setRot(model, 'neck', -NECK_ANGLE - Math.abs(reach) * 0.5 - g.lift * 0.3, 0, 0);
    setRot(model, 'head', HEAD_ANGLE + reach * 0.6, 0, 0);
    setRot(model, 'tail', TAIL_ANGLE - g.lift * 1.6 - Math.sin(p * 0.7) * 0.12, 0, 0);
  }

  // A horse pulling up short or refusing: front end comes off the ground.
  function poseRear(model, k) {
    clearPose(model);
    const lift = Math.sin(Math.min(1, k) * Math.PI) * 1.05;
    setRot(model, 'body', Math.PI / 2 - lift, 0, 0);
    setRot(model, 'legFL', -1.1 - lift * 0.4, 0, 0);
    setRot(model, 'legFR', -0.8 - lift * 0.5, 0, 0);
    setRot(model, 'shinFL', 1.3, 0, 0);
    setRot(model, 'shinFR', 1.0, 0, 0);
    setRot(model, 'neck', -NECK_ANGLE - lift * 0.3, 0, 0);
    model.bob = lift * 3;
  }

  /* ================= joints ================= */

  const JOINT_NAMES = [
    'croup', 'withers', 'poll', 'muzzle', 'tailTip',
    'rootFL', 'kneeFL', 'hoofFL', 'rootFR', 'kneeFR', 'hoofFR',
    'rootBL', 'kneeBL', 'hoofBL', 'rootBR', 'kneeBR', 'hoofBR'
  ];

  // Which bone each drawn segment runs along, and whether its mesh climbs the
  // bone's local +Y or hangs down -Y. Same contract as the character rig, so
  // the ragdoll can place every part from two points.
  const BONE_SEGMENTS = [
    { bone: 'body', from: 'croup', to: 'withers', axis: 1 },
    { bone: 'neck', from: 'withers', to: 'poll', axis: 1 },
    { bone: 'head', from: 'poll', to: 'muzzle', axis: 1 },
    { bone: 'tail', from: 'croup', to: 'tailTip', axis: 1 },
    { bone: 'legFL', from: 'rootFL', to: 'kneeFL', axis: -1 },
    { bone: 'shinFL', from: 'kneeFL', to: 'hoofFL', axis: -1 },
    { bone: 'legFR', from: 'rootFR', to: 'kneeFR', axis: -1 },
    { bone: 'shinFR', from: 'kneeFR', to: 'hoofFR', axis: -1 },
    { bone: 'legBL', from: 'rootBL', to: 'kneeBL', axis: -1 },
    { bone: 'shinBL', from: 'kneeBL', to: 'hoofBL', axis: -1 },
    { bone: 'legBR', from: 'rootBR', to: 'kneeBR', axis: -1 },
    { bone: 'shinBR', from: 'kneeBR', to: 'hoofBR', axis: -1 }
  ];

  const PARTICLE_R = {
    croup: 5.5, withers: 5.5, poll: 3.2, muzzle: 2.4, tailTip: 1.4,
    rootFL: 3.0, rootFR: 3.0, rootBL: 3.0, rootBR: 3.0,
    kneeFL: 2.0, kneeFR: 2.0, kneeBL: 2.0, kneeBR: 2.0,
    hoofFL: 1.8, hoofFR: 1.8, hoofBL: 1.8, hoofBR: 1.8
  };

  /* Walks the posed tree and reports where each named joint has ended up, in
   * world units with the hooves at y=0. */
  const _jp = [0, 0, 0];
  function jointPositions(model, yaw, tiltPitch, tiltRoll) {
    const d = model.dims;
    const scale = model.root.scale || 1;
    let base = R.rotationY(yaw);
    // Tilt about the hooves, so a get-up can aim at a body that is still on
    // its side rather than at one that is already standing.
    if (tiltPitch) base = R.multiply(base, R.rotationX(tiltPitch));
    if (tiltRoll) base = R.multiply(base, R.rotationZ(tiltRoll));
    base = R.multiply(base, R.scaling(scale));
    base = R.multiply(base, R.translation(0, model.bob || 0, 0));

    (function walk(node, parent) {
      let local = R.translation(node.origin[0], node.origin[1], node.origin[2]);
      if (node.rot[2]) local = R.multiply(local, R.rotationZ(node.rot[2]));
      if (node.rot[1]) local = R.multiply(local, R.rotationY(node.rot[1]));
      if (node.rot[0]) local = R.multiply(local, R.rotationX(node.rot[0]));
      node._m = R.multiply(parent, local);
      for (let i = 0; i < node.children.length; i++) walk(node.children[i], node._m);
    })(model.root, base);

    const out = {};
    function at(boneName, lx, ly, lz, key) {
      const b = model.bones[boneName];
      if (!b) return;
      R.transformPoint(b._m, lx, ly, lz, _jp);
      out[key] = [_jp[0], _jp[1], _jp[2]];
    }

    at('body', 0, 0, 0, 'croup');
    at('body', 0, d.bodyLen * 0.9, -d.bodyH * 0.25, 'withers');
    at('neck', 0, d.neckLen, 0, 'poll');
    at('head', 0, d.headLen, 0, 'muzzle');
    at('tail', 0, d.tailLen, 0, 'tailTip');
    const legs = ['FL', 'FR', 'BL', 'BR'];
    for (let i = 0; i < legs.length; i++) {
      at('leg' + legs[i], 0, 0, 0, 'root' + legs[i]);
      at('leg' + legs[i], 0, -d.upperLeg, 0, 'knee' + legs[i]);
      at('shin' + legs[i], 0, -d.lowerLeg - d.hoofH, 0, 'hoof' + legs[i]);
    }
    return out;
  }

  /* ================= ragdoll ================= */

  const LINKS = [
    ['croup', 'withers', 1], ['withers', 'poll', 1], ['poll', 'muzzle', 1],
    ['croup', 'tailTip', 0.5],
    ['withers', 'rootFL', 1], ['withers', 'rootFR', 1],
    ['croup', 'rootBL', 1], ['croup', 'rootBR', 1],
    ['rootFL', 'rootFR', 0.95], ['rootBL', 'rootBR', 0.95],
    ['rootFL', 'rootBL', 0.8], ['rootFR', 'rootBR', 0.8],
    ['croup', 'rootFL', 0.55], ['croup', 'rootFR', 0.55],
    ['withers', 'rootBL', 0.55], ['withers', 'rootBR', 0.55],
    ['rootFL', 'kneeFL', 1], ['kneeFL', 'hoofFL', 1],
    ['rootFR', 'kneeFR', 1], ['kneeFR', 'hoofFR', 1],
    ['rootBL', 'kneeBL', 1], ['kneeBL', 'hoofBL', 1],
    ['rootBR', 'kneeBR', 1], ['kneeBR', 'hoofBR', 1],
    // loose limits: a leg can fold, it cannot fold through the animal
    ['rootFL', 'hoofFL', 0.12], ['rootFR', 'hoofFR', 0.12],
    ['rootBL', 'hoofBL', 0.12], ['rootBR', 'hoofBR', 0.12],
    ['withers', 'tailTip', 0.1]
  ];

  const GRAVITY = 130;
  const SUBSTEP = 1 / 120;
  const ITERATIONS = 8;
  const MAX_STEP = 1.05;   // model units per 120Hz substep, ~126 units/second
  const STILL_TIME = 1.4;

  function createFall() {
    return { active: false, p: null, links: null, state: 'up', still: 0, rise: 0, timer: 0,
      risePitch: 0, riseRoll: 0, vol: null };
  }

  function knockDown(entity, dirX, dirY, force) {
    const f = entity.fall;
    const model = entity.model;
    poseGait(model, quantiseTime(entity.animTime), entity.gait === 'idle' ? 'idle' : entity.gait);
    const joints = jointPositions(model, entity.yaw);
    const len = Math.hypot(dirX, dirY) || 1;
    const px = dirX / len, pz = dirY / len;
    const p = {};
    const impulse = Math.max(1, Math.min(11, force)) * SUBSTEP * 4.4;

    for (let i = 0; i < JOINT_NAMES.length; i++) {
      const k = JOINT_NAMES[i];
      const j = joints[k];
      if (!j) continue;
      const q = { x: j[0], y: j[1], z: j[2], px: 0, py: 0, pz: 0, r: PARTICLE_R[k] || 2 };
      // The push goes in through the flank and the whole animal rolls with it,
      // so the top of the body travels further than the feet.
      const high = Math.max(0, Math.min(1, j[1] / 34));
      q.px = q.x - px * impulse * (0.5 + high);
      q.pz = q.z - pz * impulse * (0.5 + high);
      q.py = q.y - impulse * 0.12 * high;
      p[k] = q;
    }

    const links = [];
    for (let i = 0; i < LINKS.length; i++) {
      const a = LINKS[i][0], b = LINKS[i][1];
      if (!joints[a] || !joints[b]) continue;
      const dx = joints[a][0] - joints[b][0];
      const dy = joints[a][1] - joints[b][1];
      const dz = joints[a][2] - joints[b][2];
      links.push({ a: a, b: b, len: Math.hypot(dx, dy, dz), stiff: LINKS[i][2] });
    }

    // Centre the body on the entity before anything else. The solver works in
    // a local frame whose origin is the middle of the barrel, and hands back
    // how far that middle moved each step; if it does not start at zero, the
    // very first step hands back the model's own layout as if it were motion.
    recentre(p);

    f.p = p;
    f.links = links;
    f.active = true;
    f.state = 'falling';
    f.still = 0;
    f.rise = 0;
    f.timer = 0;
    entity.gait = 'idle';
    return true;
  }

  /* Midpoint of the barrel, in whatever frame the particles are currently in. */
  function bodyMid(p) {
    const c = p.croup, w = p.withers;
    return { x: (c.x + w.x) * 0.5, z: (c.z + w.z) * 0.5 };
  }

  function recentre(p) {
    const m = bodyMid(p);
    for (const k in p) {
      const q = p[k];
      q.x -= m.x; q.z -= m.z;
      q.px -= m.x; q.pz -= m.z;
    }
    return m;
  }


  /* ---------- solid body ---------- */

  /* The same problem the villagers had: the distance constraints are happy to
   * let a foreleg swing straight through the barrel, and every bone is drawn
   * as a box spanning two particles, so a segment crossing the body is a leg
   * visibly inside the horse. The barrel is an elliptical column along the
   * spine — a horse is far deeper than it is wide — plus a neck capsule, and
   * every limb is sampled along its length rather than only at the joints. */
  function bodyVolumes(d) {
    return {
      barrelW: d.bodyW / 2 + d.legW * 0.44,
      barrelH: d.bodyH / 2 + d.legW * 0.44,
      neckR: d.neckW * 0.5 + d.legW * 0.2,
      legR: d.legW * 0.5
    };
  }

  const LIMB_SEGMENTS = [
    { a: 'rootFL', b: 'kneeFL', root: true }, { a: 'kneeFL', b: 'hoofFL', root: false },
    { a: 'rootFR', b: 'kneeFR', root: true }, { a: 'kneeFR', b: 'hoofFR', root: false },
    { a: 'rootBL', b: 'kneeBL', root: true }, { a: 'kneeBL', b: 'hoofBL', root: false },
    { a: 'rootBR', b: 'kneeBR', root: true }, { a: 'kneeBR', b: 'hoofBR', root: false }
  ];

  const LIMB_PAIRS = [
    [['rootFL', 'kneeFL'], ['rootFR', 'kneeFR']], [['kneeFL', 'hoofFL'], ['kneeFR', 'hoofFR']],
    [['rootBL', 'kneeBL'], ['rootBR', 'kneeBR']], [['kneeBL', 'hoofBL'], ['kneeBR', 'hoofBR']],
    [['kneeFL', 'hoofFL'], ['kneeBL', 'hoofBL']], [['kneeFR', 'hoofFR'], ['kneeBR', 'hoofBR']]
  ];

  const _hf = { ox: 0, oy: 0, oz: 0, len: 1, ax: 0, ay: 0, az: 1,
    lx: 1, ly: 0, lz: 0, ux: 0, uy: 1, uz: 0 };

  /* Barrel frame: the spine runs croup to withers, the lateral axis across
   * the shoulders, and up is their cross product. Without a real frame the
   * barrel can only be a round tube, which either lets legs through at the
   * belly or holds them out at the flanks. */
  function barrelFrame(p) {
    const a = p.croup, b = p.withers;
    if (!a || !b) return null;
    let ax = b.x - a.x, ay = b.y - a.y, az = b.z - a.z;
    const al = Math.hypot(ax, ay, az);
    if (al < 1e-5) return null;
    ax /= al; ay /= al; az /= al;

    let lx = p.rootFL.x - p.rootFR.x, ly = p.rootFL.y - p.rootFR.y, lz = p.rootFL.z - p.rootFR.z;
    const dot = lx * ax + ly * ay + lz * az;
    lx -= ax * dot; ly -= ay * dot; lz -= az * dot;
    let ll = Math.hypot(lx, ly, lz);
    if (ll < 1e-4) {
      lx = Math.abs(ax) < 0.9 ? 1 : 0; ly = 0; lz = Math.abs(ax) < 0.9 ? 0 : 1;
      const d2 = lx * ax + ly * ay + lz * az;
      lx -= ax * d2; ly -= ay * d2; lz -= az * d2;
      ll = Math.hypot(lx, ly, lz) || 1;
    }
    lx /= ll; ly /= ll; lz /= ll;

    _hf.ox = a.x; _hf.oy = a.y; _hf.oz = a.z; _hf.len = al;
    _hf.ax = ax; _hf.ay = ay; _hf.az = az;
    _hf.lx = lx; _hf.ly = ly; _hf.lz = lz;
    _hf.ux = ay * lz - az * ly;
    _hf.uy = az * lx - ax * lz;
    _hf.uz = ax * ly - ay * lx;
    return _hf;
  }

  const _push = { x: 0, y: 0, z: 0 };

  function barrelEscape(fr, v, x, y, z) {
    const dx = x - fr.ox, dy = y - fr.oy, dz = z - fr.oz;
    const s = dx * fr.ax + dy * fr.ay + dz * fr.az;
    // Only the run of the barrel itself. The legs are rooted at its ends, so
    // testing them against those is the solver fighting the skeleton.
    if (s < fr.len * 0.16 || s > fr.len * 0.94) return false;
    const u = dx * fr.lx + dy * fr.ly + dz * fr.lz;
    const w = dx * fr.ux + dy * fr.uy + dz * fr.uz;
    const nu = u / v.barrelW, nw = w / v.barrelH;
    const m = Math.hypot(nu, nw);
    if (m >= 1) return false;
    const k = m < 1e-4 ? 1 : 1 / m;
    const eu = u * k - u, ew = w * k - w;

    _push.y = fr.ly * eu + fr.uy * ew;
    _push.z = fr.lz * eu + fr.uz * ew;

  function capsuleEscape(a, b, r, x, y, z) {
    const bx = b.x - a.x, by = b.y - a.y, bz = b.z - a.z;
    const len2 = bx * bx + by * by + bz * bz || 1e-6;
    let t = ((x - a.x) * bx + (y - a.y) * by + (z - a.z) * bz) / len2;

  const SAMPLES = [0.22, 0.45, 0.68, 0.86, 1.0];

  function separateLimbs(f, dims) {
    const p = f.p;
    const v = f.vol || (f.vol = bodyVolumes(dims));
    const fr = barrelFrame(p);

    for (let i = 0; i < LIMB_SEGMENTS.length; i++) {
      const seg = LIMB_SEGMENTS[i];

        }
        if (!hit) continue;

        const wa = seg.root ? (1 - t) * 0.45 : (1 - t);

      const n = SAMPLES.length;

      const A = LIMB_PAIRS[i][0], B = LIMB_PAIRS[i][1];
      const a0 = p[A[0]], a1 = p[A[1]], b0 = p[B[0]], b1 = p[B[1]];
      if (!a0 || !a1 || !b0 || !b1) continue;
      const want = v.legR * 2;
      const ux = a1.x - a0.x, uy = a1.y - a0.y, uz = a1.z - a0.z;
      const vx = b1.x - b0.x, vy = b1.y - b0.y, vz = b1.z - b0.z;
      const wx = a0.x - b0.x, wy = a0.y - b0.y, wz = a0.z - b0.z;

      const uv = ux * vx + uy * vy + uz * vz;
      const vv = vx * vx + vy * vy + vz * vz;
      const uw = ux * wx + uy * wy + uz * wz;
      const vw = vx * wx + vy * wy + vz * wz;
      const den = uu * vv - uv * uv;
      let sa, tb;
      if (den < 1e-8) { sa = 0; tb = vv < 1e-8 ? 0 : vw / vv; }

      tb = tb < 0 ? 0 : tb > 1 ? 1 : tb;

      let dy = (a0.y + uy * sa) - (b0.y + vy * tb);
      let dz = (a0.z + uz * sa) - (b0.z + vz * tb);

     * position. Rate-limited: a crash can throw a horse a long way, but a horse

     * solver's fight with the get-up pose reads as the animal dragging itself
     * across the field. Whatever is held back stays as particle offset and is
     * delivered over the following frames, so a real slide still arrives — it
     * just cannot arrive faster than a horse can move. */

    f.rise += dt / RISE_TIME;

    // Pulling toward it uncentred means every single frame hands that offset
    // back as drift — which is a horse that walks itself across the field
    // while lying on its side.
    const tm = {

    const pull = Math.min(1, dt * (1.6 + 8 * k));

      const q = f.p[key], t = target[key];
      if (!t) continue;
      const ty = Math.max(t[1], q.r * 0.34);
      const dx = (t[0] - q.x) * pull, dy = (ty - q.y) * pull, dz = (t[2] - q.z) * pull;
      q.x += dx; q.y += dy; q.z += dz;
      q.px += dx; q.py += dy; q.pz += dz;
    }
    separateLimbs(f, entity.model.dims);
    if (k >= 1) {
      let worst = 0;
      for (const key in f.p) {
        const q = f.p[key], t = target[key];
        if (!t) continue;
        const e = Math.hypot(t[0] - q.x, t[1] - q.y, t[2] - q.z);
        if (e > worst) worst = e;
      }
      if (worst < 0.8 || f.rise > 2.2) {
        f.active = false;
        f.state = 'up';
        f.p = null;
      }
    }

  }

    const n = sides || 12;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      verts.push(cx - halfWidth, cy0 + ca * outer, cz0 + sa * outer);
      verts.push(cx + halfWidth, cy0 + ca * outer, cz0 + sa * outer);
      verts.push(cx - halfWidth, cy0 + ca * inner, cz0 + sa * inner);
      verts.push(cx + halfWidth, cy0 + ca * inner, cz0 + sa * inner);
    }
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const a0 = i * 4, b0 = j * 4;
      faces.push([a0, b0, b0 + 1, a0 + 1]);             // outer rim
      faces.push([a0 + 2, a0 + 3, b0 + 3, b0 + 2]);     // inner bore
      faces.push([a0, a0 + 2, b0 + 2, b0]);             // left face
      faces.push([a0 + 1, b0 + 1, b0 + 3, a0 + 3]);     // right face
    }
    return G.finish(verts, faces);
  }

  /* One spoke, a slim bar lying in the wheel's plane at the given angle. */
  function spokeMesh(cx, cy, cz, halfWidth, halfLen, halfThick, angle) {
    const ca = Math.cos(angle), sa = Math.sin(angle);
    const verts = [];
    const faces = [];
    for (let i = 0; i < 4; i++) {
      const u = (i & 1) ? halfLen : -halfLen;
      const v = (i & 2) ? halfThick : -halfThick;
      const py = cy + ca * u - sa * v;
      const pz = cz + sa * u + ca * v;
      verts.push(cx - halfWidth, py, pz);
      verts.push(cx + halfWidth, py, pz);
    }
    const q = [0, 2, 6, 4];
    faces.push([q[0], q[1], q[2], q[3]]);
    faces.push([q[3] + 1, q[2] + 1, q[1] + 1, q[0] + 1]);
    for (let i = 0; i < 4; i++) {
      const a0 = q[i], b0 = q[(i + 1) % 4];
      faces.push([a0, b0, b0 + 1, a0 + 1]);
    }
    return G.finish(verts, faces);
  }

  /* ---------- parts, tagged so damage can take them away ---------- */

  function part(mesh, colour, tag) {
    return { mesh: mesh, colour: colour, tag: tag || 'frame' };
  }

  /* Builds the full cart. `stage` 0-2 is how battered it is: planks go
   * missing, the sides sag and the ironwork shows through. */
  function buildParts(type, stage, rng) {
    const t = TYPES[type];
    const parts = [];
    const L = t.length, W = t.width, deck = t.deckY;
    const halfL = L / 2, halfW = W / 2;

    // Which deck planks and side boards have been knocked out. Seeded off the
    // cart so a given cart loses the same boards each time it is redrawn.
    const gone = {};
    if (stage > 0) {
      const n = stage === 1 ? 2 : 5;
      for (let i = 0; i < n; i++) gone['d' + Math.floor(rng() * 7)] = true;
      for (let i = 0; i < stage * 2; i++) gone['s' + Math.floor(rng() * 8)] = true;
    }

    /* chassis rails — these never break off; without them there is no cart */
    for (let s = -1; s <= 1; s += 2) {
      parts.push(part(G.box(s * (halfW - 1.6) - 0.9, deck - 2.2, -halfL, 1.8, 2.2, L),
        t.woodDark, 'frame'));
    }
    // axles
    for (let i = 0; i < 2; i++) {
      const z = i ? halfL - 5.5 : -halfL + 5.5;
      parts.push(part(G.box(-halfW - 1.0, deck - 3.4, z - 1.0, W + 2.0, 1.9, 2.0),
        t.iron, 'frame'));
    }

    /* deck planks, laid across the rails */
    const planks = 7;
    for (let i = 0; i < planks; i++) {
      if (gone['d' + i]) continue;
      const z = -halfL + 1.2 + (i + 0.5) * ((L - 2.4) / planks);
      const sag = stage > 1 && (i % 3 === 0) ? -0.9 : 0;
      parts.push(part(G.box(-halfW + 0.6, deck + sag, z - (L - 2.4) / planks / 2 + 0.25,
        W - 1.2, 1.1, (L - 2.4) / planks - 0.5), t.wood, 'plank'));
    }

    /* sideboards */
    const boards = t.cushions ? 3 : 2;
    for (let s = -1; s <= 1; s += 2) {
      for (let i = 0; i < boards; i++) {
        const idx = (s > 0 ? 0 : 4) + i;
        if (gone['s' + idx]) continue;
        const y = deck + 1.1 + i * (t.sideH / boards);
        const lean = stage > 1 && i === boards - 1 ? 0.8 : 0;
        parts.push(part(G.box(s * (halfW - 1.2) - 0.7 - lean * s, y, -halfL + 1.0,
          1.4, t.sideH / boards - 0.3, L - 2.0), t.wood, 'plank'));
      }
    }
    // front and tail boards
    for (let e = -1; e <= 1; e += 2) {
      if (stage > 1 && e > 0) continue;   // the tailgate is the first thing to go
      parts.push(part(G.box(-halfW + 0.8, deck + 1.1, e * (halfL - 1.4) - 0.7,
        W - 1.6, t.sideH - 0.4, 1.4), t.wood, 'plank'));
    }

    /* type-specific fittings */
    if (t.chest) {
      /* Planked box, a domed lid banded in iron, corner straps, a hasp and a
       * lockplate. A plain cube on the deck reads as a crate; it is the
       * curved lid and the ironwork that say chest. */
      const cw = W - 5.0, cl = 13, ch = 8.6;
      const cz = -cl / 2 - 1.5;
      const body = stage > 1 ? t.woodDark : '#5a4227';
      const band = '#3b3530';
      const brass = '#9c7b32';
      const y0 = deck + 1.1;
      parts.push(part(G.box(-cw / 2, y0, cz, cw, ch, cl), body, 'chest'));
      // vertical plank grooves down the front and back
      for (let i = -1; i <= 1; i++) {
        parts.push(part(G.box(i * cw * 0.26 - 0.3, y0 + 0.4, cz - 0.28, 0.6, ch - 0.8, 0.4),
          '#4a3620', 'chest'));
        parts.push(part(G.box(i * cw * 0.26 - 0.3, y0 + 0.4, cz + cl - 0.12, 0.6, ch - 0.8, 0.4),
          '#4a3620', 'chest'));
      }
      // iron corner straps
      for (let sx = -1; sx <= 1; sx += 2) {
        for (let sz = 0; sz <= 1; sz++) {
          parts.push(part(G.box(sx * (cw / 2 - 0.9) - 0.45, y0, cz + sz * (cl - 0.9) - 0.2,
            0.9, ch, 1.1), band, 'chest'));
        }
      }
      // domed lid: three courses, each narrower and taller than the last
      const tilt = stage > 1 ? 2.2 : 0;
      const lid = [[1.00, 1.5], [0.88, 1.3], [0.68, 1.1], [0.40, 0.8]];
      let ly = y0 + ch + tilt;
      for (let i = 0; i < lid.length; i++) {
        const f = lid[i][0], hgt = lid[i][1];
        parts.push(part(G.box(-cw / 2 * f - 0.3, ly, cz + (cl * (1 - f)) / 2 - 0.3,
          cw * f + 0.6, hgt, cl * f + 0.6), i === 0 ? '#4a3620' : body, 'chest'));
        ly += hgt;
      }
      // the band over the crown of the lid, and the hasp and lock at the front
      parts.push(part(G.box(-cw * 0.09, y0 + ch + tilt, cz - 0.4,
        cw * 0.18, ly - (y0 + ch + tilt), cl + 0.8), band, 'chest'));
      parts.push(part(G.box(-1.5, y0 + ch - 2.4 + tilt * 0.4, cz - 0.55, 3.0, 3.0, 0.7),
        brass, 'chest'));
      parts.push(part(G.box(-0.8, y0 + ch - 3.4 + tilt * 0.4, cz - 0.75, 1.6, 1.6, 0.5),
        band, 'chest'));
    }
    if (t.cushions) {
      // a bench with padded cushions, and gilt trim along the top rail
      const by = deck + 1.1;
      parts.push(part(G.box(-W / 2 + 2.2, by, -halfL + 4, W - 4.4, 4.0, 9), t.woodDark, 'frame'));
      if (stage < 2) {
        parts.push(part(G.superellipsoid(0, by + 5.2, -halfL + 8.5,
          (W - 5.6) / 2, 1.9, 4.6, 0.42, 4, 8), t.cushion, 'cushion'));
        parts.push(part(G.superellipsoid(0, by + 8.2, -halfL + 4.6,
          (W - 6.4) / 2, 3.2, 1.7, 0.42, 4, 8), stage ? t.cushionDark : t.cushion, 'cushion'));

        parts.push(part(G.box(-(W - 7) / 2, by + 4.2, -halfL + 5.5, W - 7, 1.6, 6), t.cushionDark, 'cushion'));
      }
      for (let s = -1; s <= 1; s += 2) {
        parts.push(part(G.box(s * (halfW - 1.3) - 0.75, deck + t.sideH + 0.8, -halfL + 1.2,
          1.5, 1.0, L - 2.4), t.trim, 'frame'));
      }
    }

    /* wheels — four, and they stay on until the cart breaks */
    const wheelR = 7.6;
    for (let i = 0; i < 4; i++) {
      const s = i % 2 ? 1 : -1;
      const z = i < 2 ? -halfL + 5.5 : halfL - 5.5;

      const wobble = stage > 1 && i === 3 ? 1.6 : 0;
      const ws = wheelParts(s * (halfW + 1.2), deck - 3.4 + wobble, z,
        wheelR * (stage > 1 && i === 3 ? 0.88 : 1), 1.5, t.woodDark, t.iron);
      for (let k = 0; k < ws.length; k++) parts.push(ws[k]);
    }

    /* shafts running forward to the horse */
    for (let s = -1; s <= 1; s += 2) {
      parts.push(part(G.box(s * (halfW - 3.5) - 0.75, deck - 1.4, halfL - 1, 1.5, 1.5, 15),
        t.woodDark, 'frame'));
    }
    return parts;
  }

  /* ---------- debris ---------- */

  const DEBRIS = {
    plank: { label: 'Plank', colour: '#7d5c36', w: 9, h: 1.1, d: 2.4 },
    wheel: { label: 'Wheel', colour: '#5e441f', r: 6.4 },
    leather: { label: 'Leather', colour: '#6b4526', w: 5.5, h: 0.8, d: 4.2 },
    feather: { label: 'Feathers', colour: '#e0d9c6', w: 2.6, h: 0.7, d: 1.8 }
  };

  function debrisMesh(kind) {
    const d = DEBRIS[kind];
    if (kind === 'wheel') {
      return wheelParts(0, 0, 0, d.r, 1.4, d.colour, '#4a4540');
    }
    if (kind === 'feather') {
      return [{ mesh: G.superellipsoid(0, 0, 0, d.w / 2, d.h / 2, d.d / 2, 0.55, 3, 7), colour: d.colour }];
    }
    return [{ mesh: G.box(-d.w / 2, -d.h / 2, -d.d / 2, d.w, d.h, d.d), colour: d.colour }];
  }

  /* What a cart throws out when it finally comes apart. Deliberately a fixed
   * list per type rather than "whatever is left", so breaking a cart always
   * yields the same haul. */
  function wreckage(type) {
    const drops = TYPES[type].drops;
    const out = [];
    for (const kind in drops) {
      const n = drops[kind];
      const k = kind === 'wheelLoose' ? 'wheel' : kind;
      for (let i = 0; i < n; i++) out.push(k);
    }
    return out;
  }

  function stageFor(hp, maxHp) {
    const f = hp / maxHp;
    if (f > 0.66) return 0;
    if (f > 0.33) return 1;
    return 2;
  }

  function create(type, x, y, seed) {
    const t = TYPES[type];
    return {
      type: type,
      def: t,
      x: x, y: y,
      vx: 0, vy: 0,
      yaw: 0,
      hp: t.hp,
      maxHp: t.hp,
      stage: 0,
      hitFlash: 0,
      hitCooldown: 0,
      shedPlanks: 0,      // planks already shaken loose, so each stage sheds once
      broken: false,
      hitch: null,        // the horse pulling it
      rider: null,
      sprite: null,
      spriteStage: -1,
      rng: CM.makeRng(seed === undefined ? (Math.random() * 0xffffffff) >>> 0 : seed),
      seed: seed === undefined ? 1 : seed

  }

  global.Vehicle = {
    TYPES, DEBRIS, buildParts, debrisMesh, wreckage, stageFor, create,
    wheelMesh, ringMesh, spokeMesh, wheelParts

})(window);

/* combat.js — weapons, wounds, blood and dying.
 *
 * Nothing here is deterministic. A mace that always killed in one hit would
 * be a rule rather than a fight, so every blow is
 *
 *     damage = weapon power x hit quality x target vulnerability x variation
 *
 * and the same swing can drop one villager and leave another standing. What
 * *is* deterministic is where the wound goes: the blow is resolved against a
 * height on the body, the wound is stitched to the bone it landed on, and it
 * bleeds from there until the bleeding stops — which is either because they
 * were bandaged, or because there is nothing left to bleed.

  const STEEL = '#b9bec6';
  const STEEL_DARK = '#7d838c';

  const STEEL_DEEP = '#565b63';   // the shadow in a fuller or a socket
  const BRASS_LIT = '#d8b45c';
  const HAFT = '#6b4a29';
  const HAFT_DARK = '#4a3119';

   * actually meets the haft. */
  function bladeMesh(y0, y1, reach, halfWidth, curve, back) {
    const verts = [];
    const faces = [];
    const N = 7;
    const ring = [];
    for (let i = 0; i <= N; i++) {

      // the edge bows out from the socket and sweeps back at both horns

      const y = y0 + (y1 - y0) * t;
      const z = -(back + reach * (0.35 + 0.65 * bow) * curve);
      ring.push([y, z]);
      verts.push(-halfWidth, y, -back);
      verts.push(halfWidth, y, -back);
      verts.push(-halfWidth * (0.45 + 0.3 * bow), y, z);
      verts.push(halfWidth * (0.45 + 0.3 * bow), y, z);
    }
    for (let i = 0; i < N; i++) {
      const a = i * 4, b = (i + 1) * 4;
      faces.push([a, a + 2, b + 2, b]);           // left face
      faces.push([a + 1, b + 1, b + 3, a + 3]);   // right face
      faces.push([a + 2, a + 3, b + 3, b + 2]);   // the edge itself
      faces.push([a, b, b + 1, a + 1]);           // the back, against the haft

    /* A bow is a stave that bends. Segments are placed along a curve and each
     * one is long enough to overlap its neighbour, so the limb reads as one
     * piece of wood rather than as a row of blocks. */
    bow: function () {
      const p = [];
      const N = 9, SPAN = 17.0;
      let prev = null;
      for (let i = 0; i <= N; i++) {
        const t = (i / N) * 2 - 1;
        const y = -t * SPAN;
        const z = -(1 - t * t) * 3.4;
        if (prev) {
          const my = (y + prev.y) / 2, mz = (z + prev.z) / 2;
          const len = Math.hypot(y - prev.y, z - prev.z) * 0.62;
          const thick = 0.62 - Math.abs(t) * 0.22;
          p.push(part(G.slab(-thick, my - len, mz - thick, thick * 2, len * 2, thick * 2, 0.8, 1),

      p.push(part(G.superellipsoid(0, -SPAN, 0, 0.55, 0.9, 0.55, 0.5, 3, 7), BONE_COL));

      p.push(part(G.box(-0.16, -SPAN, -0.16, 0.32, SPAN * 2, 0.32), '#e6e0cc'));
      return p;

  /* power        — the base of the damage roll
   * reach        — how far in front the blow lands, in model units
   * swing        — seconds from the start of the attack to the moment it lands
   * recover      — seconds after that before you can swing again
   * kind         — blunt staggers and knocks down; edged and pierce bleed
   * bleed        — how much a wound from this weapon bleeds, per second
   * arc          — how wide a cone it covers, in radians either side
   * gore         — whether a hit leaves a slash across the body */

    // stand toe to toe and still be out of range of each other.

  const MELEE_IDS = ['club', 'dagger', 'sword', 'axe', 'mace', 'spear', 'greatsword', 'poleaxe'];
  const ALL_IDS = MELEE_IDS.concat(['bow', 'crossbow']);

  const _cache = {};
  function weaponParts(id) {
    if (!BUILD[id]) return [];
    if (!_cache[id]) _cache[id] = BUILD[id]();
    return _cache[id];
  }

  function weapon(id) { return WEAPONS[id] || WEAPONS.fists; }

  /* ================= the damage roll ================= */

  const MAX_HP = 100;
  // How much bare-handed punishment somebody takes before the skin goes.
  const SPLIT_AT = 26;
  // and how much the skin going is allowed to bleed, all told
  const SPLIT_BLEED_CAP = 0.16;
  /* How long a beating that was not meant to kill you holds you above the
   * line. Long enough for the bleeding it caused to clot. */
  const SPARED_FOR = 32;
  // and how hard a pulled blow is allowed to leave somebody bleeding
  const SPARED_BLEED_CAP = 0.45;

  /* Where on the body a blow landed, as a fraction of standing height, and
   * how badly that place takes it. Deciding this before the damage is what
   * lets the wound be stitched to the right bone afterwards. */
  const ZONES = [
    { id: 'head', bone: 'head', from: 0.82, to: 1.0, quality: 1.85, lethal: 2.2 },
    { id: 'chest', bone: 'torso', from: 0.58, to: 0.82, quality: 1.25, lethal: 1.5 },
    { id: 'gut', bone: 'torso', from: 0.44, to: 0.58, quality: 1.1, lethal: 1.25 },
    { id: 'arm', bone: 'armR', from: 0.60, to: 0.78, quality: 0.65, lethal: 0.5 },
    { id: 'leg', bone: 'legR', from: 0.0, to: 0.44, quality: 0.7, lethal: 0.45 }
  ];

  function zoneFor(id) {
    for (let i = 0; i < ZONES.length; i++) if (ZONES[i].id === id) return ZONES[i];
    return ZONES[1];
  }

  /* Rolls where a blow lands. Most blows go to the body; a careful attacker
   * (standing still, close, facing them) lands higher and better. */
  function rollZone(rng, aim) {
    const r = rng();
    const good = aim === undefined ? 0.5 : aim;
    if (r < 0.06 + good * 0.14) return zoneFor('head');
    if (r < 0.52 + good * 0.12) return zoneFor('chest');
    if (r < 0.70) return zoneFor('gut');
    if (r < 0.86) return zoneFor('arm');
    return zoneFor('leg');
  }

  /* damage = power x hit quality x vulnerability x variation.
   *
   * Hit quality folds in where it landed and how well it was thrown. Being
   * already hurt makes the next blow worse, which is what produces fights
   * that turn rather than fights that grind. */
  function rollDamage(w, target, opts) {
    const o = opts || {};
    const rng = o.rng || Math.random;
    const zone = o.zone || rollZone(rng, o.aim);
    // the health lives on the body, not on the actor that owns it
    const body = target.body || target;
    const hp = typeof body.hp === 'number' ? body.hp : MAX_HP;
    const hurt = 1 - Math.max(0, Math.min(1, hp / MAX_HP));
    const vulnerable = 1 + hurt * 0.75 + (o.defenceless ? 0.4 : 0)
      + (body.blocking ? -0.55 : 0);
    const variation = 0.72 + rng() * 0.62;
    const quality = zone.quality * (0.75 + (o.aim === undefined ? 0.5 : o.aim) * 0.5)
      * (o.charge || 1);
    const amount = w.power * quality * Math.max(0.15, vulnerable) * variation;
    return {
      amount: amount,
      zone: zone,
      // bleeding scales with how deep it went, not just how hard
      bleed: w.bleed * (0.6 + variation * 0.7) * zone.lethal * 0.7,
      knock: w.knock * variation * (zone.id === 'leg' ? 1.3 : 1),
      kind: w.kind,
      gore: w.gore,
      floor: w.floor
    };
  }

  /* ================= wounds ================= */

  /* A wound is a mark stitched to a bone, at a spot on that bone. It is drawn
   * with the body, so it turns with them, swings with the limb it is on, and
   * stays where the blow landed rather than floating at chest height. */
  /* A wound is a mark stitched to a bone. What it looks like is decided by
   * what made it, not by how much damage it did:
   *
   *   edged   a slash, laid along the line the blade travelled. Long, thin,
   *           and it runs.
   *   pierce  a small deep hole. Barely wider than the blade, dark, and it
   *           runs hard because a puncture does. An arrow leaves the shaft
   *           in it.
   *   blunt   a bruise. Broad, flat, soft, no run at all, and it changes
   *           colour over the days rather than shrinking much.
   *
   * `travel` is the direction the weapon was moving in the victim's own
   * frame, which is what a slash lies along; without it every cut on a body
   * is at a random angle and a row of them reads as a rash.
   */
  function makeWound(model, zone, dirLocal, opts) {
    const o = opts || {};
    const rng = o.rng || Math.random;
    const kind = o.kind || 'blunt';
    const gore = o.gore === undefined ? 0 : o.gore;
    const power = o.power === undefined ? 20 : o.power;
    const d = model.dims;
    /* A limb wound goes on the limb the blow actually reached. The zone table
     * names the right arm because it has to name one, but a sword coming in
     * from somebody's left does not land on their right arm. */
    let boneName = zone.bone;
    if (boneName === 'armR' && dirLocal[0] < 0) boneName = 'armL';
    if (boneName === 'legR' && dirLocal[0] < 0) boneName = 'legL';
    const bone = model.bones[boneName] ? boneName : 'torso';

    /* Which face of the body it landed on, and where that face is.
     *
     * This matters more than it sounds. A wound placed at some fraction of
     * the body's depth sits *inside* the body, and since the torso is wearing
     * a tunic over the top of that, it is invisible — which is exactly what
     * was happening: every cut in the game was being drawn under somebody's
     * shirt. It has to be put on the surface, and on the surface the blow
     * came from. */
    const onHead = bone === 'head';
    const onLimb = bone.indexOf('arm') === 0 || bone.indexOf('leg') === 0;
    let halfW, halfD;
    if (onHead) { halfW = d.headW * 0.5; halfD = d.headD * 0.5; }
    else if (onLimb) {
      const t = bone.indexOf('arm') === 0 ? d.armW : d.legW;
      // clothing sits on a limb too, just not as thickly
      halfW = t * 0.5 + 0.55; halfD = t * 0.5 + 0.55;
    } else {
      // the tunic, the surcoat and the belt all stand proud of the torso
      halfW = d.torsoW * 0.5 + 0.7; halfD = d.torsoD * 0.5 + 0.7;
    }

    const side = dirLocal[0], front = dirLocal[1];
    const useSide = Math.abs(side) > Math.abs(front);
    const face = useSide ? (side > 0 ? 'right' : 'left')
      : (front >= 0 ? 'front' : 'back');
    const jitter = (rng() - 0.5) * 0.7;

    let x, z;
    if (useSide) {
      x = (side > 0 ? 1 : -1) * (halfW + 0.2);
      z = jitter * halfD;
    } else {
      z = (front >= 0 ? 1 : -1) * (halfD + 0.2);
      x = jitter * halfW;
    }

    let y;
    if (bone === 'head') y = 1.5 + rng() * 4.5;
    else if (bone === 'torso') y = zone.id === 'gut' ? 1.0 + rng() * 3.0 : 4.5 + rng() * 5.5;
    else if (bone.indexOf('arm') === 0) y = -1.0 - rng() * 3.5;
    else y = -1.5 - rng() * 4.0;

    // how heavy the blow was, as a fraction of the worst thing in the game
    const heft = Math.max(0.2, Math.min(1.4, power / 45));
    const wound = {
      bone: bone,
      x: x, y: y, z: z,
      face: face,
      kind: kind,
      age: 0,
      run: 0,
      // Size is what heals. Everything drawn is scaled by it, so a wound
      // closing up is one number going down rather than a second set of
      // shapes.
      size: 1,
      day: 0,
      bruise: 0

    if (kind === 'edged') {
      /* Along the swing. A cut lies across the body in the direction the
       * edge was travelling, which is why an overhead leaves a vertical one
       * and a horizontal slash leaves a belt across the chest. */
      const tx = o.travel ? o.travel[0] : (rng() - 0.5);
      const ty = o.travel ? o.travel[1] : 0.2;
      wound.angle = Math.atan2(ty, tx) + (rng() - 0.5) * 0.5;
      wound.w = (3.4 + gore * 3.2 + rng() * 2.6) * heft;
      wound.h = (0.75 + rng() * 0.4) * (0.7 + heft * 0.5);
      wound.maxRun = (4 + rng() * 5) * heft;
      wound.heal = 0.075;        // a fortnight or so
    } else if (kind === 'pierce') {
      wound.angle = 0;
      wound.w = (1.1 + rng() * 0.8) * (0.7 + heft * 0.4);
      wound.h = wound.w * (0.9 + rng() * 0.3);
      // a hole runs harder than it looks like it should
      wound.maxRun = (4.5 + rng() * 5.5) * heft;
      wound.heal = 0.055;        // the deepest, and the slowest
      if (o.shaft) {

        wound.shaftLen = 5 + rng() * 3;

       * its time going — but it goes through the colours while it does. */
      wound.angle = (rng() - 0.5) * 0.8;
      wound.w = (2.2 + rng() * 1.8) * (0.6 + heft * 0.7);
      wound.h = wound.w * (0.65 + rng() * 0.4);
      wound.maxRun = 0;
      wound.heal = 0.22;         // four or five days
      wound.bruise = 1;

   * through its colours on the way out; a cut just gets shorter and stops

      wd.run = Math.max(0, wd.run - n * 1.6);

          /* An arrow does not disappear on contact. The shaft stands out of
           * them until somebody pulls it out, and it is the single clearest
           * way to read at a glance what hit whom. */
          /* Built as a stepped stack rather than one box, so the shaft
           * slopes down and out of them instead of pointing straight at the
           * camera. An arrow aimed exactly along the view axis projects to
           * about two pixels and reads as a smudge; one at an angle reads as
           * a stick, which is the entire point of leaving it in. */
          const len = wd.shaftLen * size;

          for (let k = 0; k < SEG; k++) {
            const t = k / SEG;
            const outAt = out * len * t;
            const dropAt = -len * 0.34 * t;      // it hangs as it comes out
            const seg = len / SEG + 0.3;
            list.push(part(sideFace
              ? G.box(wd.x + outAt, wd.y + dropAt - 0.28, u0 - 0.28, out * seg, 0.56, 0.56)
              : G.box(u0 - 0.28, wd.y + dropAt - 0.28, wd.z + outAt, 0.56, 0.56, out * seg),

          const tipOut = out * len * 0.92;
          const tipY = -len * 0.34 * 0.92;
          for (let f = 0; f < 3; f++) {
            const ang = (f / 3) * Math.PI * 2;
            const fu = Math.cos(ang) * 0.6, fy = Math.sin(ang) * 0.6;
            list.push(part(sideFace
              ? G.box(wd.x + tipOut, wd.y + tipY + fy - 0.17, u0 + fu - 0.17, out * 1.7, 0.34, 0.34)
              : G.box(u0 + fu - 0.17, wd.y + tipY + fy - 0.17, wd.z + tipOut, 0.34, 0.34, out * 1.7),

      } else {

        const steps = w > 3 ? 6 : w > 1.6 ? 3 : 1;
        for (let k = 0; k < steps; k++) {
          const t = steps === 1 ? 0 : (k / (steps - 1) - 0.5) * 2;

    return byBone;
  }

  /* ================= bleeding out ================= */

  function createBody() {

      dying: false,

     * you down to the floor and no further; if you are already below it, it
     * does nothing more to your health at all, and what it does instead is
     * hurt — the pain and the bruising still go up. */
    const floor = roll.floor === undefined ? 0 : roll.floor;
    body.hp = Math.max(Math.min(body.hp, floor), body.hp - roll.amount);
    if (floor > 0) {

       * held above the line for a while, rather than merely stopping the
       * blows there. The bleeding still runs — you are badly hurt and you
       * have to do something about it — but it clots inside the window, so
       * the arrest does not quietly finish you twenty seconds later in a
       * field. Without this the whole graded response was theatre: the watch
       * pulled their punches and you died anyway. */
      body.floor = Math.max(body.floor || 0, floor);
      body.floorFor = Math.max(body.floorFor || 0, SPARED_FOR);
      /* And they did not open an artery either. Holding somebody above the
       * line while leaving them bleeding three points a second is not mercy,
       * it is a slower way of doing the same thing: the hold runs out and
       * they die in a field anyway. A blow pulled on purpose cuts shallow. */
      body.bleed = Math.min(body.bleed, SPARED_BLEED_CAP);
      roll.bleed = Math.min(roll.bleed, SPARED_BLEED_CAP);

     * bruises; keep it up and the skin goes, which is the point at which a
     * fist fight starts producing blood. */
    let kind = roll.kind;

      if (body.bruised > SPLIT_AT && rand() < 0.55) {

         * hardly at all, and it clots. A split lip has never killed anybody,
         * and letting these stack was quietly making bare hands lethal by the
         * back door: the floor stopped the punches at twelve and then the
         * bleeding finished the job anyway. */
        kind = 'edged';

    const worthMarking = roll.bleed > 0.05 || roll.amount > 12
      || (roll.kind === 'blunt' && roll.amount > 4);

      body.wounds.push(makeWound(target.model, roll.zone, dirLocal, {
        kind: kind, gore: gore, power: o.power === undefined ? roll.amount * 1.6 : o.power,
        travel: o.travel, shaft: o.shaft, rng: rand

        : roll.amount > 14 ? 'wounded' : 'minor';

      body.dying = true;
      body.deathTimer = 0.35 + (rng ? rng() : Math.random()) * 1.4;
    }
    return { severity: severity, amount: roll.amount, zone: roll.zone.id, roll: roll };
  }

  /* Bleeding is the other way to die. A blow that does not drop someone can
   * still finish them a minute later, which is why a dagger is dangerous. */
  function updateBody(actor, dt) {
    const body = actor.body;
    if (!body || body.dead) return null;
    body.pain = Math.max(0, body.pain - dt * 0.55);

    if (body.floorFor > 0) {
      body.floorFor -= dt;
      if (body.floorFor <= 0) { body.floorFor = 0; body.floor = 0; }

/* ===== dialogue.js ===== */
/* dialogue.js — the paged text box.
 *
 * Typewriter reveal, a name plate, and a bobbing arrow in the bottom-right that
 * only appears once the page has finished revealing. Click or press space to
 * advance; advancing past the last page closes the box.
 */
(function (global) {
  'use strict';

  const R = global.Render;
  const T = global.Text;
  const CM = global.CharacterModel;

  const CHARS_PER_SECOND = 34;

  const COLOURS = {
    panel: R.pack(243, 236, 217),
    panelShade: R.pack(214, 202, 175),
    border: R.pack(58, 46, 38),
    inner: R.pack(255, 251, 240),
    text: R.pack(48, 38, 32),
    plate: R.pack(200, 150, 62),
    plateText: R.pack(36, 28, 22),
    arrow: R.pack(122, 78, 40)
  };

  function create() {
    return {
      open: false,
      pages: [],
      pageIndex: 0,
      revealed: 0,
      speaker: '',
      time: 0,
      lastLetter: '',
      onLetter: null,
      onClose: null,
      justClosed: false
    };
  }

  function start(box, pages, speaker, opts) {
    box.open = true;
    box.pages = pages.slice();
    box.pageIndex = 0;
    box.revealed = 0;
    box.speaker = speaker || '';
    box.time = 0;
    box.lastLetter = '';
    box.onLetter = (opts && opts.onLetter) || null;
    box.onClose = (opts && opts.onClose) || null;
  }

  function currentPage(box) { return box.pages[box.pageIndex] || ''; }

  function pageComplete(box) { return box.revealed >= currentPage(box).length; }

  function update(box, dt) {
    if (!box.open) return;
    box.time += dt;
    const page = currentPage(box);
    if (box.revealed < page.length) {
      const before = Math.floor(box.revealed);
      box.revealed = Math.min(page.length, box.revealed + CHARS_PER_SECOND * dt);
      const after = Math.floor(box.revealed);
      for (let i = before; i < after; i++) {
        const ch = page[i];
        if (ch && ch !== ' ') {
          box.lastLetter = ch;
          if (box.onLetter) box.onLetter(ch);
        }
      }
      if (box.revealed >= page.length && box.onLetter) box.onLetter(null);
    }
  }

  // Returns true if the box consumed the input.
  function advance(box) {
    if (!box.open) return false;
    if (!pageComplete(box)) {
      box.revealed = currentPage(box).length; // first click completes the page
      if (box.onLetter) box.onLetter(null);
      return true;
    }
    if (box.pageIndex < box.pages.length - 1) {
      box.pageIndex++;
      box.revealed = 0;
      box.time = 0;
      return true;
    }
    close(box);
    return true;
  }

  function close(box) {
    box.open = false;
    box.pages = [];
    box.revealed = 0;
    box.justClosed = true;
    if (box.onLetter) box.onLetter(null);
    if (box.onClose) box.onClose();
  }

  /* ---------- drawing ---------- */

  function panel(target, x, y, w, h) {
    R.fillRect(target, x, y, w, h, COLOURS.panel);
    // notch the corners so the box reads as rounded at this scale
    for (let i = 0; i < 2; i++) {
      const n = 2 - i;
      R.fillRect(target, x + i, y + i, n, 1, 0);
      R.fillRect(target, x + w - i - n, y + i, n, 1, 0);
      R.fillRect(target, x + i, y + h - i - 1, n, 1, 0);
      R.fillRect(target, x + w - i - n, y + h - i - 1, n, 1, 0);
    }
    R.strokeRect(target, x, y, w, h, COLOURS.border);
    // clip the border's own corner pixels to match the notch
    R.fillRect(target, x, y, 1, 1, 0);
    R.fillRect(target, x + w - 1, y, 1, 1, 0);
    R.fillRect(target, x, y + h - 1, 1, 1, 0);
    R.fillRect(target, x + w - 1, y + h - 1, 1, 1, 0);

    R.fillRect(target, x + 2, y + 1, w - 4, 1, COLOURS.inner);
    R.fillRect(target, x + 1, y + 2, 1, h - 4, COLOURS.inner);
    R.fillRect(target, x + 2, y + h - 2, w - 4, 1, COLOURS.panelShade);
    R.fillRect(target, x + w - 2, y + 2, 1, h - 4, COLOURS.panelShade);
  }

    if (!box.open) return;

    const S = T.SCALE;
    const margin = 10 * S;
    const h = 62 * S;
    const w = target.w - margin * 2;
    const x = margin;
    const y = target.h - h - 6 * S;

    if (box.speaker) {
      const plateH = T.CELL_H + 4;
      const nameW = T.measure(box.speaker) + 12 * S;

      R.strokeRect(target, plateX, plateY, nameW, plateH, COLOURS.border);
      R.fillRect(target, plateX, plateY, 1, 1, 0);
      R.fillRect(target, plateX + nameW - 1, plateY, 1, 1, 0);

    }

    const page = currentPage(box);
    const shown = page.slice(0, Math.floor(box.revealed));
    const lines = T.wrap(page, w - 22 * S);

    // Wrap the full page once, then reveal per line, so text never re-flows
    // mid-reveal — re-flowing is the classic typewriter bug.
    let remaining = shown.length;
    let ty = y + 9 * S;

      const line = lines[i];
      const take = Math.max(0, Math.min(line.length, remaining));

      remaining -= line.length + 1; // +1 for the space the wrap consumed
      ty += T.LINE_H + 3 * S;

      const bob = Math.round(Math.sin(box.time * 5.0) * 1.5) * S;
      drawArrow(target, x + w - 13 * S, y + h - 12 * S + bob, S);
    }

    // page pips, so you can see how much is left
    const pips = box.pages.length;
    if (pips > 1) {
      for (let i = 0; i < pips; i++) {
        const px = x + w - 10 * S - (pips - 1 - i) * 5 * S;
        const on = i <= box.pageIndex;
        R.fillRect(target, px, y + 5 * S, 3 * S, 3 * S, on ? COLOURS.arrow : COLOURS.panelShade);
      }
    }
  }

  function drawArrow(target, x, y, s) {

  }

    create, start, update, advance, close, draw,
    currentPage, pageComplete, COLOURS

})(window);

    }
    const upper = 6;
    for (let i = 0; i < upper; i++) {
      const a = (i / upper) * Math.PI * 2 + rng() * 0.4 + 0.5;
      const rad = 5 + rng() * 1.8;
      const s = 14 + rng() * 4;
      clump(Math.cos(a) * rad, base + 8 + rng() * 2.5, Math.sin(a) * rad, s, rng() < 0.65);
    }
    // crown, and a filler under it so the two rings never show daylight
    clump(0, base + 5, 0, 16 + rng() * 2, false);
    clump(rng() * 2 - 1, base + 14 + rng() * 2, rng() * 2 - 1, 14 + rng() * 3, true);
    return renderBoxes(boxes, 128 * PIXEL, 168 * PIXEL, 64 * PIXEL, 158 * PIXEL, CAM_SCALE);
  }

  function makeRock(rng) {
    const B = global.Parts.box;
    const boxes = [];
    const n = 2 + Math.floor(rng() * 3);
    for (let i = 0; i < n; i++) {
      const s = 3.5 + rng() * 4;
      boxes.push({
        mesh: G.superellipsoid((rng() - 0.5) * 4, rng() * 2 + s * 0.4, (rng() - 0.5) * 4,
          s / 2, s * 0.42, s / 2, 0.55, 4, 8),
        colour: rng() < 0.5 ? '#6d6a63' : '#5a5750'
      });
    }
    return renderBoxes(boxes, 44 * PIXEL, 44 * PIXEL, 22 * PIXEL, 36 * PIXEL, CAM_SCALE);
  }

  function makeBarrel() {
    const B = global.Parts.box;
